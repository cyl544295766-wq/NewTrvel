# Travel OS 生产 Nginx 站点（生产专用模板，与服务器现状一致，无需再改端口）
# 端口约定：对外监听 8082（80 已被其他项目的整合页占用）；/api/ 与 /files/ 反代本机
# 后端 127.0.0.1:3001（travel-os-api，.env APP_PORT=3001）。3000 已被 monevo-nginx
# 容器占用，其 /api/ 恒 200——严禁把上游改回 3000（健康检查会假通过，见 publish.sh 注释）。
# 应用步骤与验证见 deploy/服务器初始化手册.md 第七节（nginx -t 通过后 reload）。
server {
    listen 8082 default_server;
    server_name _;

    root /var/www/travel-os;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1k;

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20m;
    }

    # 受保护上传文件（/files/**）：唯一读取通道是后端 FileController（HttpOnly Cookie 登录态
    # + FileAccessService 对象级授权），必须整体代理到与 /api/ 相同的后端。
    # - `^~` 前缀修饰使该 location 优先于下方所有正则 location：否则 /files/*.png|jpg|svg|woff
    #   会被扩展名规则截获、走 try_files 静态404，永远到不了后端（.pdf 则落到 location / 同样404）；
    # - `proxy_pass` 不带 URI 部分（无路径、无尾部斜杠）→ nginx 原样转发完整请求路径，
    #   /files/ 前缀不会被剥离；
    # - 不设置 expires / add_header Cache-Control、不改 error_page → 后端的 401/404/206 状态码、
    #   Content-Type、Cache-Control: private, no-store、Content-Range 等响应头原样返回，
    #   受保护文件绝不会被标成 public 缓存或被改写成页面；
    # - Cookie（access_token）、Host、X-Forwarded-* 与 /api/ 同法转发；
    #   GET/HEAD/Range/If-Range 均按原样透传（nginx 默认不改写请求头与方法）。
    location ^~ /files/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
    }

    location / {
        # 多页面站点：目录由 index 指令解析，未命中的路径直接 404（不做 SPA 兜底）
        try_files $uri $uri/ =404;
    }

    # 仅命中非 /files/ 的静态资源（/files/** 已被上面的 ^~ 前缀拦截，不会进入本规则）
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
