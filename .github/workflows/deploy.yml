name: CI/CD

# push 到 main：构建 + 部署；PR：只构建不部署；支持手动触发
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-backend:
    name: 构建后端 (apps/server)
    runs-on: ubuntu-latest
    outputs:
      start_ts: ${{ steps.t0.outputs.start_ts }}
    steps:
      - uses: actions/checkout@v4

      - id: t0
        run: echo "start_ts=$(date +%s)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Maven verify（编译 + 测试 + 打包）
        working-directory: apps/server
        run: mvn -B verify

      - uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: apps/server/target/*.jar
          retention-days: 7

  deploy:
    name: 部署到生产服务器
    needs: [build-backend]
    # 仅 main 分支 push / 手动触发才部署；PR 只构建
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      HOST: ${{ secrets.SSH_HOST }}
      PORT: ${{ secrets.SSH_PORT }}
      USER: ${{ secrets.SSH_USER }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: jar

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: 信任服务器指纹
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts

      - name: 备份服务器现有版本（各保留最近 3 份）
        run: |
          ssh -p "$PORT" "$USER@$HOST" '
            mkdir -p /opt/travel-os/backups
            TS=$(date +%Y%m%d%H%M%S)
            [ -f /opt/travel-os/travel-os-api.jar ] && cp /opt/travel-os/travel-os-api.jar "/opt/travel-os/backups/travel-os-api.jar.bak-$TS" || true
            [ -f /var/www/travel-os/index.html ] && tar czf "/opt/travel-os/backups/www.bak-$TS.tar.gz" -C /var/www/travel-os . || true
            ls -1t /opt/travel-os/backups/travel-os-api.jar.bak-* 2>/dev/null | tail -n +4 | xargs -r rm -f
            ls -1t /opt/travel-os/backups/www.bak-*.tar.gz 2>/dev/null | tail -n +4 | xargs -r rm -f
            ls -la /opt/travel-os/backups/'

      - name: 上传 jar 到 COS 中转（全球加速端点）
        id: cos
        env:
          TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
          COS_BUCKET: travel-os-deploy-1503378108
        run: |
          curl -sL -o coscli https://cosbrowser.cloud.tencent.com/software/coscli/coscli-linux-amd64
          chmod +x coscli
          printf 'cos:\n  base:\n    secretid: %s\n    secretkey: %s\n    sessiontoken: ""\n    protocol: https\n  buckets: []\n' \
            "$TENCENT_SECRET_ID" "$TENCENT_SECRET_KEY" > ~/.cos.yaml
          ./coscli cp jar/*.jar "cos://$COS_BUCKET/travel-os-api.jar" -e cos.accelerate.myqcloud.com
          url=$(./coscli signurl "cos://$COS_BUCKET/travel-os-api.jar" -e cos.ap-beijing.myqcloud.com -t 3600 2>/dev/null | grep -o 'https://[^ "]*')
          echo "presigned_url=$url" >> "$GITHUB_OUTPUT"

      - name: 服务器经内网拉取 jar（<1s）
        run: |
          ssh -p "$PORT" "$USER@$HOST" '
            curl -sfL -o /opt/travel-os/travel-os-api.jar.new "${{ steps.cos.outputs.presigned_url }}"
            mv /opt/travel-os/travel-os-api.jar.new /opt/travel-os/travel-os-api.jar'

      - name: 应用数据库迁移（apps/server/db/migration/*.sql，需保持幂等）
        run: |
          tar czf migrations.tar.gz -C apps/server/db migration
          scp -P "$PORT" migrations.tar.gz "$USER@$HOST:/tmp/"
          ssh -p "$PORT" "$USER@$HOST" 'set -e
            rm -rf /tmp/mig && mkdir -p /tmp/mig
            tar xzf /tmp/migrations.tar.gz -C /tmp/mig
            for f in $(ls /tmp/mig/migration/*.sql 2>/dev/null | sort); do
              echo "applying: $f"
              sudo docker exec -i travel-os-postgres psql -U travel_os -d travel_os -v ON_ERROR_STOP=1 -q -f - < "$f"
            done'

      - name: 发布前端静态站点（rsync apps/web，排除 /ci/ 状态页）
        run: rsync -az --delete --exclude '/ci/' -e "ssh -p $PORT" apps/web/ "$USER@$HOST:/var/www/travel-os/"

      - name: 重启后端 + 健康检查（失败自动回滚）
        run: |
          ssh -p "$PORT" "$USER@$HOST" '
            sudo systemctl restart travel-os-api
            ok=0
            for i in $(seq 1 12); do
              sleep 5
              if curl -sf -m 5 http://127.0.0.1:3000/api/health > /dev/null; then ok=1; break; fi
            done
            if [ "$ok" = "1" ]; then echo "health check OK"; exit 0; fi
            echo "!! 健康检查失败，最近 50 行日志："
            sudo journalctl -u travel-os-api --no-pager -n 50 || true
            echo "!! 自动回滚到最近备份 jar"
            latest=$(ls -1t /opt/travel-os/backups/travel-os-api.jar.bak-* | head -1)
            cp "$latest" /opt/travel-os/travel-os-api.jar
            sudo systemctl restart travel-os-api
            exit 1'

  record:
    name: 记录本次运行结果（写入服务器 /ci/）
    needs: [build-backend, deploy]
    if: always()
    runs-on: ubuntu-latest
    env:
      HOST: ${{ secrets.SSH_HOST }}
      PORT: ${{ secrets.SSH_PORT }}
      USER: ${{ secrets.SSH_USER }}
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: 信任服务器指纹
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts

      - name: 生成运行记录并写入服务器
        env:
          FRONTEND: static
          BACKEND: ${{ needs.build-backend.result }}
          DEPLOY: ${{ needs.deploy.result }}
          START_TS: ${{ needs.build-backend.outputs.start_ts }}
        run: |
          NOW=$(date +%s)
          DURATION=null
          [ -n "$START_TS" ] && DURATION=$(( NOW - START_TS ))
          CONCLUSION=success
          for r in "$BACKEND" "$DEPLOY"; do
            case "$r" in
              success|skipped) ;;
              cancelled) [ "$CONCLUSION" = "success" ] && CONCLUSION=cancelled ;;
              *) CONCLUSION=failure; break ;;
            esac
          done
          jq -n \
            --arg run_id "${{ github.run_id }}" \
            --arg run_number "${{ github.run_number }}" \
            --arg url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --arg commit "${{ github.sha }}" \
            --arg message "${{ github.event.head_commit.message || github.event.pull_request.title || '手动触发' }}" \
            --arg branch "${{ github.ref_name }}" \
            --arg actor "${{ github.actor }}" \
            --arg event "${{ github.event_name }}" \
            --arg frontend "$FRONTEND" --arg backend "$BACKEND" --arg deploy "$DEPLOY" \
            --arg conclusion "$CONCLUSION" \
            --arg finished_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson duration_sec "$DURATION" \
            '{run_id:$run_id,run_number:$run_number,url:$url,commit:$commit,message:$message,branch:$branch,actor:$actor,event:$event,frontend:$frontend,backend:$backend,deploy:$deploy,conclusion:$conclusion,finished_at:$finished_at,duration_sec:$duration_sec}' \
            > record.json
          scp -P "$PORT" record.json "$USER@$HOST:/tmp/ci-record.json"
          ssh -p "$PORT" "$USER@$HOST" '
            python3 - <<PYEOF
          import json
          path = "/var/www/travel-os/ci/runs.json"
          try:
              runs = json.load(open(path))
          except Exception:
              runs = []
          runs.insert(0, json.load(open("/tmp/ci-record.json")))
          json.dump(runs[:50], open(path, "w"), ensure_ascii=False, indent=1)
          PYEOF'
