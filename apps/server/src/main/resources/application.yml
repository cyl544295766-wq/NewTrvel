server:
  port: ${APP_PORT:3000}

spring:
  jackson:
    date-format: yyyy-MM-dd'T'HH:mm:ss.SSS'Z'
    time-zone: UTC
    default-property-inclusion: always
  servlet:
    multipart:
      enabled: false
  mvc:
    static-path-pattern: /**
  web:
    resources:
      welcome-page: login/index.html
      add-mappings: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: assign_id

jwt:
  secret: ${JWT_SECRET:change_me_in_local_env}
  # P2-4：true=默认密钥仅警告（本地开发）；生产置 false——仍为默认密钥则拒绝启动
  allow-default-secret: ${JWT_ALLOW_DEFAULT:true}

auth:
  cookie-name: ${AUTH_COOKIE_NAME:access_token}
  # P2-2：生产（HTTPS）务必置 true，令牌 Cookie 不再走明文
  secure-cookie: ${AUTH_SECURE_COOKIE:false}

cors:
  # P2-2：跨域白名单（逗号分隔）；留空 = 仅同源可用（默认安全态）
  allowed-origins: ${CORS_ALLOWED_ORIGINS:}

travelos:
  files:
    # P3-1：上传文件落盘目录（相对路径基于工作目录；生产建议绝对路径并纳入备份）
    dir: ${FILES_DIR:}

amap:
  web-service-key: ${AMAP_WEB_SERVICE_KEY:}

llm:
  # OpenAI 兼容协议（/chat/completions，支持 tools）；三项都配置后 AI 助手才启用
  base-url: ${LLM_BASE_URL:}
  api-key: ${LLM_API_KEY:}
  model: ${LLM_MODEL:}

seed:
  admin-username: ${SEED_ADMIN_USERNAME:admin}
  admin-display-name: ${SEED_ADMIN_DISPLAY_NAME:Admin}
  admin-password: ${SEED_ADMIN_PASSWORD:admin123}

app:
  user-cleanup:
    enabled: false
  booking-reminder:
    enabled: true

logging:
  level:
    root: info
    com.travelos: info
