<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Travel OS · 旅途影像</title>
<link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Space+Grotesk:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/theme.css">
<link rel="stylesheet" href="../assets/css/pet.css">
<style>
  /* ===== 骨架（与全站统一：侧栏 + 主区） ===== */
  .shell {
    display: grid;
    grid-template-columns: var(--rail-w, 232px) 1fr;
    min-height: 100vh;
    transition: grid-template-columns 0.24s cubic-bezier(0.4,0,0.2,1);
  }
  .shell[data-collapsed="true"] { --rail-w: 76px; }

  .side {
    background: linear-gradient(180deg, #E8F6F5 0%, #DCF2F0 100%);
    padding: 18px 14px 20px;
    display: flex; flex-direction: column; gap: 6px;
    border-right: 1px solid #C9E8E6; overflow: hidden;
  }
  .rail-toggle {
    align-self: flex-end; width: 34px; height: 34px; margin-bottom: 8px;
    display: grid; place-items: center; border: none; border-radius: 9px;
    background: rgba(255,255,255,0.7); color: var(--brand); font-size: 15px;
    cursor: pointer; flex: none;
    transition: background .16s, transform .24s;
  }
  .rail-toggle:hover { background: #fff; }
  .shell[data-collapsed="true"] .rail-toggle { transform: rotate(180deg); align-self: center; }

  .brand { font-family: var(--slab); font-weight: 700; font-size: 23px; padding: 0 8px 4px; color: var(--brand); white-space: nowrap; }
  .brand small { display: block; font-weight: 500; font-size: 11px; color: var(--mute); letter-spacing: .1em; margin-top: 2px; }
  .brand-mark { display: none; font-family: var(--slab); font-weight: 700; font-size: 20px; color: var(--brand); text-align: center; padding: 4px 0 6px; }

  .nav-label { font-size: 11px; letter-spacing: .15em; color: var(--mute); padding: 20px 10px 6px; white-space: nowrap; }
  .nav a {
    display: flex; align-items: center; gap: 12px; padding: 10px 12px;
    color: var(--ink-2); text-decoration: none; font-size: 14.5px; border-radius: 9px;
    white-space: nowrap;
    transition: background .16s, color .16s;
  }
  .nav a .ico { flex: none; width: 20px; text-align: center; font-size: 15px; }
  .nav a:hover { background: rgba(255,255,255,.85); color: var(--brand); }
  .nav a[aria-current="page"] { background: #fff; color: var(--brand); font-weight: 600; box-shadow: 0 2px 8px rgba(13,110,110,0.10); }
  .nav a[aria-current="page"] .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--stamp); margin-left: auto; }

  .side-foot {
    margin-top: auto; padding: 14px 8px 4px; border-top: 1px dashed #B9DEDC;
    font-size: 13px; color: var(--ink-2); display: flex; align-items: center; gap: 9px; white-space: nowrap;
  }
  .side-foot .avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--brand-soft); color: #fff; display: grid; place-items: center; font-size: 11px; font-weight: 600; flex: none; }

  .shell[data-collapsed="true"] .nav a { justify-content: center; padding: 11px 0; }
  .shell[data-collapsed="true"] .nav a .txt,
  .shell[data-collapsed="true"] .brand,
  .shell[data-collapsed="true"] .side-foot .who { display: none; }
  .shell[data-collapsed="true"] .brand-mark { display: block; }
  .shell[data-collapsed="true"] .nav-label { padding: 0; margin: 14px 12px 6px; height: 0; border-top: 1px solid #C9E8E6; font-size: 0; overflow: hidden; }
  .shell[data-collapsed="true"] .side-foot { justify-content: center; padding: 14px 0 4px; }

  /* ===== 主区 ===== */
  main { padding: 36px 44px 60px; max-width: 1320px; }

  .crumb { font-size: 13px; color: var(--mute); display: flex; gap: 7px; align-items: center; }
  .crumb a { color: var(--mute); text-decoration: none; }
  .crumb a:hover { color: var(--brand); }
  .crumb b { color: var(--brand); font-weight: 600; }

  .page-head { margin-top: 14px; display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; flex-wrap: wrap; }
  h1 { font-family: var(--slab); font-weight: 600; font-size: 34px; line-height: 1.15; color: var(--brand); }
  h1 .en {
    display: block; font-size: 12px; font-family: var(--grot); font-weight: 500;
    letter-spacing: .24em; color: var(--mute); text-transform: uppercase; margin-top: 8px;
  }
  .meta { font-size: 14px; color: var(--mute); margin-top: 10px; }
  .meta b { color: var(--brand); font-weight: 600; }
  .head-actions { display: flex; gap: 10px; align-items: center; }

  .view-seg { display: flex; gap: 4px; background: #fff; padding: 4px; border-radius: 11px; box-shadow: var(--card-shadow); }
  .view-seg button {
    font-family: var(--grot); font-size: 13px; color: var(--ink-2);
    background: none; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer;
    transition: background .14s, color .14s;
  }
  .view-seg button[aria-pressed="true"] { background: var(--brand); color: #fff; font-weight: 600; }

  .btn-add-toggle {
    font-family: var(--grot); font-weight: 600; font-size: 14px; color: #fff;
    background: var(--stamp); border: none; padding: 12px 22px; border-radius: 10px;
    cursor: pointer; box-shadow: 0 6px 16px rgba(255,138,76,0.30);
    transition: transform .14s ease, box-shadow .14s ease;
  }
  .btn-add-toggle:hover { transform: translateY(-2px); box-shadow: 0 10px 22px rgba(255,138,76,0.38); }

  /* ===== 总览 ===== */
  .overview { margin-top: 24px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .ov {
    background: #fff; border-radius: var(--r-card, 14px); box-shadow: var(--card-shadow);
    padding: 16px 20px; display: flex; align-items: center; gap: 14px;
  }
  .ov .ic { flex: none; width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; font-size: 18px; }
  .ov .v { font-family: var(--grot); font-weight: 600; font-size: 22px; color: var(--ink); line-height: 1.2; }
  .ov .k { font-size: 12px; color: var(--mute); margin-top: 2px; }

  /* ===== 上传面板 ===== */
  .form-panel {
    margin-top: 20px; background: #fff; border-radius: var(--r-card, 14px);
    box-shadow: var(--card-shadow); padding: 22px 24px; border-top: 3px solid var(--stamp);
  }
  .form-panel[hidden] { display: none; }
  .fp-head { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
  .fp-head .t { font-family: var(--slab); font-weight: 600; font-size: 17px; color: var(--ink); }
  .fp-head .hint { font-size: 12px; color: var(--mute); }
  .fp-head .x { margin-left: auto; width: 30px; height: 30px; border: none; background: var(--cloud); border-radius: 8px; color: var(--mute); cursor: pointer; font-size: 14px; }
  .dropzone {
    border: 2px dashed #B9DEDC; border-radius: 13px; background: var(--cloud);
    padding: 26px 20px; text-align: center; cursor: pointer;
    transition: border-color .16s, background .16s;
  }
  .dropzone:hover, .dropzone.drag { border-color: var(--brand-soft); background: #F0F8F7; }
  .dropzone .ic { font-size: 30px; margin-bottom: 8px; }
  .dropzone .t { font-size: 14px; font-weight: 600; color: var(--ink-2); }
  .dropzone .d { font-size: 12px; color: var(--mute); margin-top: 4px; }
  .dropzone input[type="file"] { display: none; }
  .file-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .fchip {
    display: flex; align-items: center; gap: 9px; background: var(--mist); border-radius: 10px;
    padding: 7px 12px; font-size: 12.5px; color: var(--brand); max-width: 260px;
  }
  .fchip img { width: 30px; height: 30px; border-radius: 6px; object-fit: cover; flex: none; }
  .fchip .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fchip button { border: none; background: none; color: var(--mute); cursor: pointer; font-size: 12px; flex: none; }
  .fchip button:hover { color: #D2543A; }
  .fp-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; margin-top: 16px; }
  .fp-field { display: flex; flex-direction: column; gap: 6px; }
  .fp-field label { font-size: 12px; font-weight: 600; color: var(--ink-2); }
  .fp-field input, .fp-field select {
    font-family: var(--grot); font-size: 13.5px; color: var(--ink);
    background: var(--cloud); border: 1.5px solid var(--line); border-radius: 10px;
    padding: 10px 12px; outline: none; width: 100%;
  }
  .fp-field input:focus, .fp-field select:focus { border-color: var(--brand-soft); background: #fff; }
  .fp-actions { margin-top: 18px; display: flex; gap: 10px; justify-content: flex-end; align-items: center; }
  .fp-actions .cnt { margin-right: auto; font-size: 12.5px; color: var(--mute); }
  .btn-primary-sm {
    font-family: var(--grot); font-weight: 600; font-size: 14px; color: #fff;
    background: var(--brand); border: none; padding: 11px 26px; border-radius: 10px; cursor: pointer;
    box-shadow: 0 4px 12px rgba(13,110,110,.24);
  }
  .btn-primary-sm:disabled { opacity: .55; cursor: not-allowed; }
  .btn-plain {
    font-family: var(--grot); font-size: 13.5px; color: var(--ink-2);
    background: none; border: 1.5px solid var(--line); border-radius: 10px;
    padding: 11px 20px; cursor: pointer;
  }
  .btn-plain:hover { border-color: var(--brand-soft); color: var(--brand); }

  /* ===== 分组 & 瀑布流 ===== */
  .day-sec { margin-top: 28px; }
  .day-bar { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .day-bar .dn {
    font-family: var(--slab); font-weight: 700; font-size: 16px; color: #fff;
    background: linear-gradient(135deg, var(--brand-soft), var(--brand));
    border-radius: 9px; padding: 5px 12px;
  }
  .day-bar .dd { font-family: var(--grot); font-weight: 600; font-size: 14.5px; color: var(--ink); }
  .day-bar .dw { font-size: 12.5px; color: var(--mute); }
  .day-bar .n { margin-left: auto; font-size: 12.5px; color: var(--mute); }

  /* 拼贴：CSS columns 保留原始比例 */
  .masonry { column-count: 4; column-gap: 16px; }
  .masonry .ph-card { break-inside: avoid; margin-bottom: 16px; }

  /* 网格：等高裁切 */
  .grid-view { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
  .grid-view .ph-card .ph-img { aspect-ratio: 1 / 1; }
  .grid-view .ph-card .ph-img img { height: 100%; object-fit: cover; }

  .ph-card {
    position: relative; border-radius: 13px; overflow: hidden;
    background: #fff; box-shadow: var(--card-shadow);
    transition: transform .16s, box-shadow .16s;
  }
  .ph-card:hover { transform: translateY(-3px); box-shadow: 0 14px 32px rgba(13,110,110,.18); }
  .ph-img { display: block; width: 100%; background: #EDF5F4; cursor: zoom-in; line-height: 0; }
  .ph-img img { width: 100%; display: block; }
  .ph-cover-badge {
    position: absolute; top: 10px; left: 10px; z-index: 2;
    font-family: var(--slab); font-weight: 700; font-size: 11px; letter-spacing: .1em;
    color: #fff; background: rgba(255,138,76,.92); border-radius: 8px; padding: 4px 10px;
    box-shadow: 0 4px 12px rgba(255,138,76,.4);
  }
  .ph-ops {
    position: absolute; top: 8px; right: 8px; z-index: 2;
    display: flex; gap: 4px; opacity: 0; transition: opacity .16s;
  }
  .ph-card:hover .ph-ops { opacity: 1; }
  .ph-ops button {
    width: 28px; height: 28px; border: none; border-radius: 8px;
    background: rgba(255,255,255,.92); color: var(--ink-2); font-size: 13px; cursor: pointer;
    display: grid; place-items: center;
  }
  .ph-ops button:hover { background: #fff; color: var(--brand); }
  .ph-ops button.del:hover { color: #D2543A; }
  .ph-cap {
    padding: 10px 13px 12px; font-size: 12.5px; color: var(--ink-2);
    line-height: 1.5; display: flex; gap: 8px; align-items: baseline;
  }
  .ph-cap .tx { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .ph-cap .when { flex: none; color: var(--mute); font-size: 11.5px; white-space: nowrap; }
  .ph-cap.empty { color: #B9CFCE; font-style: normal; }

  /* 空态 */
  .empty-state {
    margin-top: 22px; background: #fff; border-radius: 16px; box-shadow: var(--card-shadow);
    padding: 58px 30px; text-align: center;
  }
  .empty-state .ic { font-size: 40px; margin-bottom: 10px; }
  .empty-state .t { font-family: var(--slab); font-weight: 600; font-size: 18px; color: var(--ink); }
  .empty-state .d { font-size: 13px; color: var(--mute); margin-top: 6px; }
  .empty-state .d b { color: var(--stamp); font-weight: 500; }

  /* ===== Lightbox ===== */
  .lb-mask {
    position: fixed; inset: 0; z-index: 95; background: rgba(8,26,28,.94);
    display: grid; place-items: center; padding: 26px;
  }
  .lb-mask[hidden] { display: none; }
  .lb-box {
    background: #fff; border-radius: 16px; overflow: hidden;
    display: grid; grid-template-columns: minmax(0, 1.6fr) 320px;
    max-width: min(1180px, 95vw); max-height: 90vh; width: 100%;
  }
  .lb-stage { background: #102A2C; display: grid; place-items: center; padding: 20px; min-height: 320px; }
  .lb-stage img { max-width: 100%; max-height: 76vh; border-radius: 8px; display: block; }
  .lb-side { padding: 20px 22px; display: flex; flex-direction: column; gap: 14px; overflow: auto; }
  .lb-side .lb-head { display: flex; align-items: flex-start; gap: 10px; }
  .lb-side .lb-head .t { font-family: var(--slab); font-weight: 600; font-size: 16px; color: var(--ink); }
  .lb-side .lb-head .x { margin-left: auto; width: 30px; height: 30px; border: none; background: var(--cloud); border-radius: 8px; color: var(--mute); cursor: pointer; flex: none; }
  .lb-meta { display: flex; flex-direction: column; gap: 9px; font-size: 12.5px; }
  .lb-meta .row { display: flex; gap: 10px; }
  .lb-meta .k { color: var(--mute); width: 62px; flex: none; }
  .lb-meta .v { color: var(--ink); font-weight: 500; }
  .lb-side label { font-size: 12px; font-weight: 600; color: var(--ink-2); display: block; margin-bottom: 6px; }
  .lb-side textarea, .lb-side input, .lb-side select {
    width: 100%; font-family: var(--grot); font-size: 13px; color: var(--ink);
    background: var(--cloud); border: 1.5px solid var(--line); border-radius: 10px;
    padding: 9px 12px; outline: none; resize: vertical;
  }
  .lb-side :is(textarea, input, select):focus { border-color: var(--brand-soft); background: #fff; }
  .lb-actions { margin-top: auto; display: flex; gap: 9px; flex-wrap: wrap; }
  .lb-actions button {
    font-family: var(--grot); font-size: 12.5px; font-weight: 600;
    border-radius: 9px; padding: 9px 15px; cursor: pointer; border: 1.5px solid transparent;
  }
  .lb-actions .save { background: var(--brand); color: #fff; }
  .lb-actions .cover { background: var(--stamp-bg); color: var(--stamp-deep); border-color: #F8D3C2; }
  .lb-actions .del { background: none; color: #D2543A; border-color: #F3C6BB; margin-left: auto; }

  /* ===== Toast ===== */
  .toast {
    position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%) translateY(16px);
    background: var(--ink); color: #fff; font-size: 13.5px;
    padding: 11px 20px; border-radius: 999px; opacity: 0; pointer-events: none;
    transition: opacity .22s, transform .22s; z-index: 99;
    box-shadow: 0 12px 32px rgba(18,58,60,.30); max-width: 76vw;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ===== 响应式 ===== */
  @media (max-width: 1120px) { .masonry { column-count: 3; } }
  @media (max-width: 980px) {
    main { padding: 28px 24px 50px; }
    .overview { grid-template-columns: 1fr 1fr; }
    .lb-box { grid-template-columns: 1fr; }
    .lb-side { max-height: 40vh; }
  }
  @media (max-width: 720px) {
    .shell { grid-template-columns: 1fr !important; }
    .side { flex-direction: row; flex-wrap: wrap; align-items: center; padding: 12px 16px; border-right: none; border-bottom: 1px solid #C9E8E6; }
    .rail-toggle { display: none; }
    .brand { display: block !important; padding: 0; }
    .brand-mark { display: none !important; }
    .nav-label { display: none; }
    .nav { display: flex; gap: 4px; flex-wrap: wrap; }
    .nav a { padding: 8px 10px; }
    .nav a .txt { display: inline !important; }
    .side-foot { margin-top: 0; margin-left: auto; border: none; padding: 0; }
    .side-foot .who { display: inline !important; }
    main { padding: 22px 16px 50px; }
    h1 { font-size: 27px; }
    .overview { grid-template-columns: 1fr 1fr; }
    .masonry { column-count: 2; }
    .fp-grid { grid-template-columns: 1fr; }
    .ph-ops { opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="shell">

  <aside class="side">
    <button class="rail-toggle" id="railToggle" aria-label="折叠侧边栏" aria-expanded="true" aria-controls="sideNav" title="折叠 / 展开">&#8249;</button>
    <div class="brand">Travel OS<small>行程驾驶舱</small></div>
    <div class="brand-mark" aria-hidden="true">T</div>
    <nav class="nav" id="sideNav" aria-label="主导航">
      <div class="nav-label">总览</div>
      <a href="/home/"><span class="ico" aria-hidden="true">&#8962;</span><span class="txt">首页</span></a>
      <a href="/trips/"><span class="ico" aria-hidden="true">&#9992;</span><span class="txt">我的旅行</span></a>
      <div class="nav-label">洞察</div>
      <a href="/stats/"><span class="ico" aria-hidden="true">&#9638;</span><span class="txt">旅行统计</span></a>
      <a href="/notifications/"><span class="ico" aria-hidden="true">&#9719;</span><span class="txt">通知中心</span></a>
      <div class="nav-label">行程</div>
      <a href="/map/"><span class="ico" aria-hidden="true">&#9673;</span><span class="txt">地图</span></a>
      <a href="/account/"><span class="ico" aria-hidden="true">&#9684;</span><span class="txt">账户</span></a>
    </nav>
    <div class="side-foot">
      <span class="avatar" id="avatar">A</span>
      <span class="who" id="who">…</span>
    </div>
  </aside>

  <main>
    <p class="crumb"><a href="/trips/">我的旅行</a><span>/</span><a href="#" id="crumbTrip">行程详情</a><span>/</span><b>旅途影像</b></p>
    <div class="page-head">
      <div>
        <h1>旅途影像<span class="en">Travel Photos</span></h1>
        <p class="meta" id="pageMeta">正在加载…</p>
      </div>
      <div class="head-actions">
        <div class="view-seg" role="group" aria-label="视图切换" id="viewSeg">
          <button type="button" data-v="masonry" aria-pressed="true">▦ 拼贴</button>
          <button type="button" data-v="grid" aria-pressed="false">⊞ 网格</button>
        </div>
        <button class="btn-add-toggle" id="btnToggleForm">⤒ 上传照片</button>
      </div>
    </div>

    <!-- 总览 -->
    <section class="overview">
      <div class="ov">
        <span class="ic" style="background:#FDEFF2;color:#C2566C;">🖼</span>
        <div><div class="v" id="ovTotal">0</div><div class="k">照片总数</div></div>
      </div>
      <div class="ov">
        <span class="ic" style="background:#E9F2FD;color:#2F6FB5;">📅</span>
        <div><div class="v" id="ovDays">0</div><div class="k">覆盖行程天</div></div>
      </div>
      <div class="ov">
        <span class="ic" style="background:#E9F8EE;color:#2A8055;">◉</span>
        <div><div class="v" id="ovPlaces">0</div><div class="k">关联地点</div></div>
      </div>
      <div class="ov">
        <span class="ic" style="background:#FDF5E2;color:#B8830F;">★</span>
        <div><div class="v" id="ovCover">–</div><div class="k">当前封面</div></div>
      </div>
    </section>

    <!-- 上传面板 -->
    <section class="form-panel" id="formPanel" hidden>
      <div class="fp-head">
        <span class="t">上传照片</span>
        <span class="hint">支持 JPG / PNG / WebP · 单张 ≤ 5MB · 可一次多张</span>
        <button type="button" class="x" id="btnCloseForm" aria-label="关闭">✕</button>
      </div>
      <div class="dropzone" id="dropzone" role="button" tabindex="0" aria-label="选择或拖拽照片">
        <div class="ic">🖼</div>
        <div class="t">点击选择 或 拖拽照片到这里</div>
        <div class="d">支持一次选多张，会按顺序上传</div>
        <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp" multiple>
      </div>
      <div class="file-chips" id="fileChips"></div>
      <div class="fp-grid">
        <div class="fp-field">
          <label>归入行程天（选填）</label>
          <select id="fDay"></select>
        </div>
        <div class="fp-field">
          <label>关联地点（选填）</label>
          <select id="fPlace"></select>
        </div>
        <div class="fp-field">
          <label>说明（选填，多张时统一应用）</label>
          <input type="text" id="fCaption" maxlength="120" placeholder="如：日落时分的沙脊">
        </div>
      </div>
      <div class="fp-actions">
        <span class="cnt" id="fpCount">未选择文件</span>
        <button type="button" class="btn-plain" id="btnCancelForm">取消</button>
        <button type="button" class="btn-primary-sm" id="btnUpload" disabled>开始上传</button>
      </div>
    </section>

    <!-- 分组相册 -->
    <div id="albumArea">
      <p style="padding:44px 0;text-align:center;color:var(--mute);" id="loading">正在加载照片…</p>
    </div>
  </main>
</div>

<!-- Lightbox -->
<div class="lb-mask" id="lbMask" hidden>
  <div class="lb-box">
    <div class="lb-stage"><img id="lbImg" alt="照片大图"></div>
    <div class="lb-side">
      <div class="lb-head">
        <span class="t">照片详情</span>
        <button type="button" class="x" id="lbClose" aria-label="关闭">✕</button>
      </div>
      <div class="lb-meta" id="lbMeta"></div>
      <div>
        <label for="lbCaption">说明</label>
        <textarea id="lbCaption" rows="3" maxlength="200" placeholder="写点什么…"></textarea>
      </div>
      <div>
        <label for="lbDay">归入行程天</label>
        <select id="lbDay"></select>
      </div>
      <div>
        <label for="lbPlace">关联地点</label>
        <select id="lbPlace"></select>
      </div>
      <div class="lb-actions">
        <button type="button" class="save" id="lbSave">保存</button>
        <button type="button" class="cover" id="lbCover">设为封面</button>
        <button type="button" class="del" id="lbDel">删除</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="../assets/js/api.js"></script>
<script src="../assets/js/pet.js"></script>
<script>
  (function () {
    if (!requireLogin('/login/')) return;

    var qs = new URLSearchParams(location.search);
    var tripId = qs.get('trip') || qs.get('id');
    if (!tripId) { location.replace('/trips/'); return; }

    /* ===== 壳 ===== */
    var user = getCurrentUser() || {};
    document.getElementById('who').textContent = user.displayName || user.username || '旅行者';
    document.getElementById('avatar').textContent = (user.displayName || user.username || 'A').charAt(0).toUpperCase();

    var shell = document.querySelector('.shell');
    var railBtn = document.getElementById('railToggle');
    var KEY = 'travel-os-rail-collapsed';
    function applyRail(collapsed) {
      shell.setAttribute('data-collapsed', collapsed ? 'true' : 'false');
      railBtn.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
      railBtn.setAttribute('aria-label', collapsed ? '展开侧边栏' : '折叠侧边栏');
      document.querySelectorAll('.nav a').forEach(function (a) {
        var t = a.querySelector('.txt');
        if (!t) return;
        if (collapsed) a.setAttribute('title', t.textContent); else a.removeAttribute('title');
      });
    }
    var saved = null;
    try { saved = localStorage.getItem(KEY); } catch (e) {}
    applyRail(saved === 'true');
    railBtn.addEventListener('click', function () {
      var next = shell.getAttribute('data-collapsed') !== 'true';
      applyRail(next);
      try { localStorage.setItem(KEY, next ? 'true' : 'false'); } catch (e) {}
    });

    /* ===== Toast ===== */
    var toast = document.getElementById('toast');
    var toastTimer = null;
    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { toast.classList.remove('show'); }, 2400);
    }

    var $ = function (id) { return document.getElementById(id); };
    var WD = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
    var VIEW_KEY = 'travel-os-photos-view';
    var state = { trip: null, photos: [], days: [], places: [], view: 'masonry', editing: null, pending: [] };
    try { state.view = localStorage.getItem(VIEW_KEY) || 'masonry'; } catch (e) {}

    /* ===== 工具 ===== */
    function escapeHtml(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
    function fmtMD(dstr) {
      if (!dstr) return '';
      var d = new Date(dstr);
      return isNaN(d) ? '' : (d.getMonth() + 1) + '/' + d.getDate();
    }
    function fmtHM(iso) {
      if (!iso) return '';
      var d = new Date(iso);
      return isNaN(d) ? '' : ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
    }
    function humanSize(b) {
      if (b < 1024) return b + ' B';
      if (b < 1048576) return (b / 1024).toFixed(1) + ' KB';
      return (b / 1048576).toFixed(1) + ' MB';
    }

    /* ===== 加载 ===== */
    async function load() {
      try {
        var results = await Promise.allSettled([
          apiGet('/trips/' + tripId),
          apiGet('/trips/' + tripId + '/photos'),
          apiGet('/trips/' + tripId + '/days')
        ]);
        if (results[0].status === 'fulfilled') state.trip = results[0].value.trip || null;
        state.photos = results[1].status === 'fulfilled' ? (results[1].value.photos || []) : [];
        state.days = results[2].status === 'fulfilled' ? (results[2].value.days || []) : [];
        var pmap = {};
        state.days.forEach(function (d) {
          (d.places || []).forEach(function (p) { pmap[p.id] = { id: p.id, name: p.name, dayId: d.id, dayIndex: d.dayIndex }; });
        });
        state.places = Object.keys(pmap).map(function (k) { return pmap[k]; });

        document.getElementById('crumbTrip').textContent = state.trip ? (state.trip.title || '行程详情') : '行程详情';
        document.getElementById('crumbTrip').href = '/trip-detail/?id=' + encodeURIComponent(tripId);
        document.title = 'Travel OS · ' + ((state.trip && state.trip.title) || '') + ' · 旅途影像';

        buildSelects();
        render();
      } catch (err) {
        showToast(humanError(err));
        $('loading').textContent = '加载失败，请刷新重试';
      }
    }

    function dayLabel(d) { return 'D' + d.dayIndex + ' · ' + fmtMD(d.date); }

    /* ===== 选择器（上传 / lightbox 共用） ===== */
    function fillSelect(sel, keepPh, selected) {
      var html = '<option value="">' + keepPh + '</option>';
      state.days.forEach(function (d) {
        html += '<option value="' + escapeHtml(d.id) + '">' + escapeHtml(dayLabel(d)) + '</option>';
      });
      sel.innerHTML = html;
      sel.value = selected || '';
    }
    function fillPlaceSelect(sel, keepPh, selected) {
      var html = '<option value="">' + keepPh + '</option>';
      state.places.forEach(function (p) {
        html += '<option value="' + escapeHtml(p.id) + '">D' + p.dayIndex + ' · ' + escapeHtml(p.name) + '</option>';
      });
      sel.innerHTML = html;
      sel.value = selected || '';
    }
    function buildSelects() {
      fillSelect($('fDay'), '不归入具体某天');
      fillPlaceSelect($('fPlace'), '不关联地点');
    }

    /* ===== 渲染 ===== */
    function render() {
      var photos = state.photos;
      var dayIds = {}; var placeIds = {}; var cover = null;
      photos.forEach(function (p) {
        if (p.tripDayId) dayIds[p.tripDayId] = 1;
        if (p.tripPlaceId) placeIds[p.tripPlaceId] = 1;
        if (p.isCover) cover = p;
      });
      $('ovTotal').textContent = photos.length;
      $('ovDays').textContent = Object.keys(dayIds).length;
      $('ovPlaces').textContent = Object.keys(placeIds).length;
      $('ovCover').textContent = cover ? (cover.caption ? cover.caption.slice(0, 8) : fmtHM(cover.shotAt) || '已设') : '–';

      var meta = $('pageMeta');
      meta.innerHTML = '<b>' + escapeHtml((state.trip && state.trip.title) || '') + '</b> · ' + photos.length + ' 张照片'
        + (state.days.length ? ' · 分布在 ' + Object.keys(dayIds).length + ' 天' : '');

      $('viewSeg').querySelectorAll('button').forEach(function (b) {
        b.setAttribute('aria-pressed', b.getAttribute('data-v') === state.view ? 'true' : 'false');
      });

      var area = $('albumArea');
      if (!photos.length) {
        area.innerHTML = ''
          + '<div class="empty-state">'
          +   '<div class="ic">🖼</div>'
          +   '<div class="t">相册还是空的</div>'
          +   '<div class="d">点击右上角 <b>「⤒ 上传照片」</b>，可以一次拖入多张，按行程天自动分组</div>'
          + '</div>';
        return;
      }

      /* 分组：有 tripDayId 的按天（按天序），其余归「未分组」 */
      var groups = [];
      var byDay = {};
      state.days.forEach(function (d) { byDay[d.id] = { day: d, items: [] }; });
      var loose = { day: null, items: [] };
      photos.forEach(function (p) {
        var g = p.tripDayId && byDay[p.tripDayId] ? byDay[p.tripDayId] : loose;
        g.items.push(p);
      });
      state.days.forEach(function (d) { if (byDay[d.id].items.length) groups.push(byDay[d.id]); });
      if (loose.items.length) groups.push(loose);

      var cls = state.view === 'grid' ? 'grid-view' : 'masonry';
      area.innerHTML = groups.map(function (g) {
        var head = g.day
          ? '<div class="day-bar"><span class="dn">D' + g.day.dayIndex + '</span>'
            + '<span class="dd">' + fmtMD(g.day.date) + '</span><span class="dw">' + WD[new Date(g.day.date).getDay()] + '</span>'
            + '<span class="n">' + g.items.length + ' 张</span></div>'
          : '<div class="day-bar"><span class="dn" style="background:linear-gradient(135deg,#B9CFCE,#8FA9A8);">?</span>'
            + '<span class="dd">未归入具体某天</span><span class="n">' + g.items.length + ' 张</span></div>';
        var cards = g.items.map(function (p) {
          return ''
            + '<figure class="ph-card" data-photo="' + escapeHtml(p.id) + '">'
            +   (p.isCover ? '<span class="ph-cover-badge">封面</span>' : '')
            +   '<span class="ph-ops">'
            +     '<button type="button" class="cover" title="设为封面">★</button>'
            +     '<button type="button" class="del" title="删除">×</button>'
            +   '</span>'
            +   '<span class="ph-img" data-zoom="' + escapeHtml(p.id) + '"><img src="' + escapeHtml(p.url) + '" alt="' + escapeHtml(p.caption || '旅途照片') + '" loading="lazy"></span>'
            +   '<figcaption class="ph-cap' + (p.caption ? '' : ' empty') + '">'
            +     '<span class="tx">' + escapeHtml(p.caption || '点击照片补充说明') + '</span>'
            +     '<span class="when">' + (p.shotAt ? fmtHM(p.shotAt) : '') + '</span>'
            +   '</figcaption>'
            + '</figure>';
        }).join('');
        return '<section class="day-sec" data-group="' + escapeHtml((g.day && g.day.id) || 'loose') + '">' + head + '<div class="' + cls + '">' + cards + '</div></section>';
      }).join('');
    }

    /* 视图切换 */
    $('viewSeg').addEventListener('click', function (e) {
      var b = e.target.closest('button');
      if (!b) return;
      state.view = b.getAttribute('data-v');
      try { localStorage.setItem(VIEW_KEY, state.view); } catch (err) {}
      render();
    });

    /* ===== 上传 ===== */
    var dz = $('dropzone'), fi = $('fileInput');
    dz.addEventListener('click', function () { fi.click(); });
    dz.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fi.click(); } });
    ['dragover', 'dragenter'].forEach(function (ev) {
      dz.addEventListener(ev, function (e) { e.preventDefault(); dz.classList.add('drag'); });
    });
    ['dragleave', 'drop'].forEach(function (ev) {
      dz.addEventListener(ev, function (e) { e.preventDefault(); dz.classList.remove('drag'); });
    });
    dz.addEventListener('drop', function (e) {
      var files = e.dataTransfer.files;
      if (files && files.length) acceptFiles(files);
    });
    fi.addEventListener('change', function () {
      if (this.files && this.files.length) acceptFiles(this.files);
    });

    function acceptFiles(list) {
      var arr = Array.prototype.slice.call(list);
      var rejected = 0;
      arr.forEach(function (f) {
        if (!/^image\/(jpeg|png|webp)$/i.test(f.type)) { rejected++; return; }
        if (f.size > 5 * 1048576) { rejected++; return; }
        state.pending.push({ name: f.name, size: f.size, file: f, dataUrl: null, url: null });
      });
      if (rejected) showToast(rejected + ' 个文件被跳过（仅 JPG/PNG/WebP 且 ≤5MB）');
      renderChips();
      /* 读 dataURL */
      state.pending.forEach(function (item) {
        if (item.dataUrl) return;
        var r = new FileReader();
        r.onload = function () { item.dataUrl = r.result; renderChips(); };
        r.readAsDataURL(item.file);
      });
      $('btnUpload').disabled = !state.pending.length;
    }
    function renderChips() {
      $('fileChips').innerHTML = state.pending.map(function (it, i) {
        return '<span class="fchip">'
          + (it.dataUrl ? '<img src="' + it.dataUrl + '" alt="">' : '')
          + '<span class="nm">' + escapeHtml(it.name) + '</span>'
          + '<span style="color:var(--mute);">' + humanSize(it.size) + '</span>'
          + '<button type="button" data-rm="' + i + '" title="移除">✕</button>'
          + '</span>';
      }).join('');
      $('fpCount').textContent = state.pending.length ? '已选择 ' + state.pending.length + ' 张' : '未选择文件';
      dz.style.display = state.pending.length ? 'none' : '';
    }
    $('fileChips').addEventListener('click', function (e) {
      var b = e.target.closest('[data-rm]');
      if (!b) return;
      state.pending.splice(Number(b.getAttribute('data-rm')), 1);
      fi.value = '';
      renderChips();
      $('btnUpload').disabled = !state.pending.length;
    });

    $('btnToggleForm').addEventListener('click', function () {
      $('formPanel').hidden = false;
      buildSelects();
      $('formPanel').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    });
    $('btnCloseForm').addEventListener('click', function () { $('formPanel').hidden = true; });
    $('btnCancelForm').addEventListener('click', function () { $('formPanel').hidden = true; });

    $('btnUpload').addEventListener('click', async function () {
      if (!state.pending.length) return;
      var b = $('btnUpload');
      b.disabled = true;
      var ok = 0, fail = 0;
      for (var i = 0; i < state.pending.length; i++) {
        var it = state.pending[i];
        b.textContent = '上传中 ' + (i + 1) + '/' + state.pending.length + '…';
        if (!it.dataUrl) { /* 等待读取 */ await new Promise(function (r) { setTimeout(r, 120); }); }
        var body = { url: it.dataUrl, caption: $('fCaption').value.trim() || null };
        var dId = $('fDay').value; if (dId) body.tripDayId = dId;
        var pId = $('fPlace').value; if (pId) body.tripPlaceId = pId;
        try { await apiPost('/trips/' + tripId + '/photos', body); ok++; }
        catch (err) { fail++; }
      }
      b.textContent = '开始上传';
      state.pending = [];
      fi.value = '';
      $('fCaption').value = '';
      renderChips();
      b.disabled = !state.pending.length;
      await load();
      showToast('上传完成：成功 ' + ok + ' 张' + (fail ? '，失败 ' + fail + ' 张' : ''));
      if (ok) $('formPanel').hidden = true;
    });

    /* ===== 卡片操作 ===== */
    $('albumArea').addEventListener('click', async function (e) {
      var card = e.target.closest('.ph-card');
      if (!card) return;
      var id = card.getAttribute('data-photo');
      var photo = state.photos.find(function (x) { return x.id === id; });
      if (!photo) return;

      if (e.target.closest('[data-zoom]')) { openLb(photo); return; }

      if (e.target.closest('.ph-ops .cover')) {
        try {
          await apiPatch('/trips/' + tripId + '/photos/' + id, { isCover: true });
          state.photos.forEach(function (x) { x.isCover = (x.id === id); });
          render();
          showToast('已设为行程封面');
        } catch (err) { showToast(humanError(err)); }
        return;
      }

      if (e.target.closest('.ph-ops .del')) {
        if (!confirm('删除这张照片？')) return;
        try {
          await apiDelete('/trips/' + tripId + '/photos/' + id);
          state.photos = state.photos.filter(function (x) { return x.id !== id; });
          render();
          showToast('已删除');
        } catch (err) { showToast(humanError(err)); }
      }
    });

    /* ===== Lightbox ===== */
    function openLb(photo) {
      state.editing = photo;
      $('lbImg').src = photo.url;
      /* 列表接口不一定带嵌套关联对象，用 id 在前端已加载的 days/places 里查更可靠 */
      var d = photo.tripDay || null;
      if (!d && photo.tripDayId) {
        for (var i = 0; i < state.days.length; i++) {
          if (state.days[i].id === photo.tripDayId) { d = state.days[i]; break; }
        }
      }
      var pl = photo.tripPlace || null;
      if (!pl && photo.tripPlaceId) {
        for (var j = 0; j < state.places.length; j++) {
          if (state.places[j].id === photo.tripPlaceId) { pl = state.places[j]; break; }
        }
      }
      $('lbMeta').innerHTML = ''
        + '<div class="row"><span class="k">拍摄时间</span><span class="v">' + (photo.shotAt ? fmtMD(photo.shotAt) + ' ' + fmtHM(photo.shotAt) : '未记录') + '</span></div>'
        + '<div class="row"><span class="k">行程天</span><span class="v">' + (d ? 'D' + d.dayIndex + ' · ' + fmtMD(d.date) : '未归入') + '</span></div>'
        + '<div class="row"><span class="k">地点</span><span class="v">' + (pl ? escapeHtml(pl.name) : '未关联') + '</span></div>'
        + '<div class="row"><span class="k">状态</span><span class="v">' + (photo.isCover ? '★ 行程封面' : '普通照片') + '</span></div>';
      $('lbCaption').value = photo.caption || '';
      fillSelect($('lbDay'), '不归入具体某天', photo.tripDayId || '');
      fillPlaceSelect($('lbPlace'), '不关联地点', photo.tripPlaceId || '');
      $('lbCover').textContent = photo.isCover ? '★ 已是封面' : '设为封面';
      $('lbMask').hidden = false;
    }
    function closeLb() { $('lbMask').hidden = true; state.editing = null; }
    $('lbClose').addEventListener('click', closeLb);
    $('lbMask').addEventListener('click', function (e) { if (e.target === this) closeLb(); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !$('lbMask').hidden) closeLb(); });

    $('lbSave').addEventListener('click', async function () {
      var p = state.editing; if (!p) return;
      try {
        await apiPatch('/trips/' + tripId + '/photos/' + p.id, {
          caption: $('lbCaption').value.trim() || null,
          tripDayId: $('lbDay').value || null,
          tripPlaceId: $('lbPlace').value || null
        });
        closeLb();
        await load();
        showToast('已保存');
      } catch (err) { showToast(humanError(err)); }
    });

    $('lbCover').addEventListener('click', async function () {
      var p = state.editing; if (!p) return;
      try {
        await apiPatch('/trips/' + tripId + '/photos/' + p.id, { isCover: true });
        closeLb();
        await load();
        showToast('已设为行程封面');
      } catch (err) { showToast(humanError(err)); }
    });

    $('lbDel').addEventListener('click', async function () {
      var p = state.editing; if (!p) return;
      if (!confirm('删除这张照片？')) return;
      try {
        await apiDelete('/trips/' + tripId + '/photos/' + p.id);
        closeLb();
        await load();
        showToast('已删除');
      } catch (err) { showToast(humanError(err)); }
    });

    /* ===== 启动 ===== */
    load();
  })();
</script>
</body>
</html>
