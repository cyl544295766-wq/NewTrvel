<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Travel OS · 游记阅读</title>
<link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Space+Grotesk:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/theme.css">
<link rel="stylesheet" href="../assets/css/pet.css">
<style>
  /* ===== 骨架 ===== */
  .shell {
    display: grid;
    grid-template-columns: var(--rail-w, 232px) 1fr;
    min-height: 100vh;
    transition: grid-template-columns 0.24s cubic-bezier(0.4,0,0.2,1);
  }
  .shell[data-collapsed="true"] { --rail-w: 76px; }

  .side {
    position: sticky; top: 0; height: 100vh; /* 吸附视口：内容再长，用户信息/退出也不随页面滚走 */
    background: linear-gradient(180deg, #E8F6F5 0%, #DCF2F0 100%);
    padding: 18px 14px 20px;
    display: flex; flex-direction: column; gap: 6px;
    border-right: 1px solid #C9E8E6; overflow: hidden;
  }
  /* 导航过长时内部滚动，品牌区与底部用户区保持固定可见 */
  .side .nav { flex: 1 1 auto; min-height: 0; overflow-y: auto; scrollbar-width: thin; }
  .side .nav::-webkit-scrollbar { width: 5px; }
  .side .nav::-webkit-scrollbar-thumb { background: #C9E8E6; border-radius: 3px; }
  .rail-toggle {
    align-self: flex-end; width: 34px; height: 34px; margin-bottom: 8px;
    display: grid; place-items: center; border: none; border-radius: 9px;
    background: rgba(255,255,255,0.7); color: var(--brand); font-size: 15px;
    cursor: pointer; flex: none;
    transition: background .16s, transform .24s;
  }
  .rail-toggle:hover { background: #fff; }
  .shell[data-collapsed="true"] .rail-toggle { transform: rotate(180deg); align-self: center; }

  .brand { font-family: var(--slab); font-weight: 700; font-size: 23px; padding: 0 8px 4px; color: var(--brand); white-space: nowrap; }
  .brand small { display: block; font-weight: 500; font-size: 11px; color: var(--mute); letter-spacing: .1em; margin-top: 2px; }
  .brand-mark { display: none; font-family: var(--slab); font-weight: 700; font-size: 20px; color: var(--brand); text-align: center; padding: 4px 0 6px; }

  .nav-label { font-size: 11px; letter-spacing: .15em; color: var(--mute); padding: 20px 10px 6px; white-space: nowrap; }
  .nav a {
    display: flex; align-items: center; gap: 12px; padding: 10px 12px;
    color: var(--ink-2); text-decoration: none; font-size: 14.5px; border-radius: 9px;
    white-space: nowrap;
    transition: background .16s, color .16s;
  }
  .nav a .ico { flex: none; width: 20px; text-align: center; font-size: 15px; }
  .nav a:hover { background: rgba(255,255,255,.85); color: var(--brand); }
  .nav a[aria-current="page"] { background: #fff; color: var(--brand); font-weight: 600; box-shadow: 0 2px 8px rgba(13,110,110,0.10); }
  .nav a[aria-current="page"] .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--stamp); margin-left: auto; }

  .side-foot {
    margin-top: auto; padding: 14px 8px 4px; border-top: 1px dashed #B9DEDC;
    font-size: 13px; color: var(--ink-2); display: flex; align-items: center; gap: 9px; white-space: nowrap;
  }
  .side-foot .avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--brand-soft); color: #fff; display: grid; place-items: center; font-size: 11px; font-weight: 600; flex: none; }
  .side-foot .side-exit {
    margin-left: auto; width: 26px; height: 26px; border: none; border-radius: 8px; flex: none;
    background: rgba(255,255,255,0.7); color: var(--mute); font-size: 13px; line-height: 1;
    cursor: pointer; transition: background .16s, color .16s;
  }
  .side-foot .side-exit:hover { background: #fff; color: #C4643B; }
  .shell[data-collapsed="true"] .side-foot .side-exit { margin-left: 0; }

  .shell[data-collapsed="true"] .nav a { justify-content: center; padding: 11px 0; }
  .shell[data-collapsed="true"] .nav a .txt,
  .shell[data-collapsed="true"] .brand,
  .shell[data-collapsed="true"] .side-foot .who { display: none; }
  .shell[data-collapsed="true"] .brand-mark { display: block; }
  .shell[data-collapsed="true"] .nav-label { padding: 0; margin: 14px 12px 6px; height: 0; border-top: 1px solid #C9E8E6; font-size: 0; overflow: hidden; }
  .shell[data-collapsed="true"] .side-foot { justify-content: center; padding: 14px 0 4px; }

  /* ===== 主区 ===== */
  main { padding: 0 0 60px; }
  .wrap { max-width: 1240px; padding: 30px 44px 0; }

  /* ===== Hero ===== */
  .hero {
    position: relative; border-radius: 18px; overflow: hidden;
    border-top: 4px solid var(--mc);
    background: linear-gradient(135deg, var(--mb) 0%, #fff 62%);
    box-shadow: var(--card-shadow);
    display: grid; grid-template-columns: 1.45fr 1fr; gap: 0;
  }
  .hero::after {
    content: ""; position: absolute; right: 6%; top: -30%;
    width: 420px; height: 420px; border-radius: 50%;
    background: radial-gradient(circle, var(--mc) 0%, transparent 68%);
    opacity: .13; pointer-events: none;
  }
  .hero-l { padding: 32px 36px 30px; position: relative; z-index: 1; }
  .crumb { font-size: 12.5px; color: var(--mute); display: flex; gap: 7px; align-items: center; flex-wrap: wrap; }
  .crumb a { color: var(--mute); text-decoration: none; }
  .crumb a:hover { color: var(--brand); }
  .mood-chip {
    display: inline-flex; align-items: center; gap: 7px; margin-top: 14px;
    font-size: 12.5px; font-weight: 600; color: var(--mc); background: rgba(255,255,255,.8);
    border: 1.5px solid var(--mc); border-radius: 999px; padding: 5px 14px;
  }
  .hero h1 {
    font-family: var(--slab); font-weight: 600; font-size: 42px; line-height: 1.2;
    color: var(--ink); margin: 16px 0 10px; letter-spacing: -.01em;
  }
  .hero .sub {
    font-size: 15px; color: var(--ink-2); line-height: 1.7; max-width: 52ch;
  }
  .hero-meta { margin-top: 20px; display: flex; gap: 20px; flex-wrap: wrap; font-size: 12.5px; color: var(--mute); }
  .hero-meta b { color: var(--ink); font-weight: 600; }
  .ctx-chips { margin-top: 14px; display: flex; gap: 8px; flex-wrap: wrap; }
  .ctx {
    font-size: 12px; color: var(--brand); background: #fff; border: 1.5px solid var(--line);
    border-radius: 999px; padding: 5px 13px; text-decoration: none;
    transition: border-color .14s;
  }
  .ctx:hover { border-color: var(--brand-soft); }
  .hero-actions { margin-top: 22px; display: flex; gap: 10px; flex-wrap: wrap; }
  .hero-actions button, .hero-actions a {
    font-family: var(--grot); font-size: 13px; font-weight: 600; text-decoration: none;
    border-radius: 9px; padding: 9px 16px; cursor: pointer; border: 1.5px solid transparent;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .hero-actions .edit { background: var(--brand); color: #fff; }
  .hero-actions .ghost { background: rgba(255,255,255,.85); color: var(--ink-2); border-color: var(--line); }
  .hero-actions .ghost:hover { color: var(--brand); border-color: var(--brand-soft); }
  .hero-actions .del { background: none; color: #D2543A; border-color: #F3C6BB; }

  .hero-r { position: relative; min-height: 330px; }
  .hero-r svg { width: 100%; height: 100%; display: block; }
  .day-stamp {
    position: absolute; left: 22px; bottom: 22px;
    font-family: var(--grot); font-size: 12px; font-weight: 600; letter-spacing: .06em;
    color: var(--ink); background: rgba(255,255,255,.82); backdrop-filter: blur(6px);
    border: 1.5px solid rgba(255,255,255,.9); border-radius: 11px; padding: 8px 14px;
    box-shadow: 0 6px 18px rgba(13,110,110,.14);
  }

  /* ===== 正文布局 ===== */
  .reading { margin-top: 30px; display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 34px; align-items: start; }

  .article { min-width: 0; }
  .article .prose { max-width: 68ch; }
  .prose p {
    font-family: var(--slab); font-size: 17px; color: #1B4446; line-height: 1.95;
    margin-bottom: 22px;
  }
  .prose p.dropcap::first-letter {
    float: left; font-family: var(--slab); font-weight: 700;
    font-size: 62px; line-height: .82; color: var(--mc);
    margin: 6px 10px 0 0;
  }
  .prose h3 {
    font-family: var(--slab); font-weight: 600; font-size: 21px; color: var(--ink);
    margin: 34px 0 14px; padding-left: 14px; border-left: 4px solid var(--mc);
    scroll-margin-top: 24px;
  }
  .prose .pull {
    margin: 30px 0; padding-left: 22px; border-left: 4px solid var(--mc);
    font-family: var(--slab); font-style: italic; font-size: 23px; line-height: 1.7;
    color: var(--mc);
  }
  .prose strong { color: var(--mc); font-weight: 700; }

  /* 照片带 */
  .photo-band { margin-top: 34px; }
  .photo-band .bt { font-family: var(--slab); font-weight: 600; font-size: 17px; color: var(--ink); margin-bottom: 14px; display: flex; align-items: baseline; gap: 10px; }
  .photo-band .bt small { font-family: var(--grot); font-weight: 400; font-size: 12px; color: var(--mute); }
  .pb-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .pb-item {
    position: relative; border-radius: 12px; overflow: hidden; background: #EDF5F4;
    line-height: 0; box-shadow: var(--card-shadow);
  }
  .pb-item img { width: 100%; aspect-ratio: 4/3; object-fit: cover; display: block; }
  .pb-item .cap {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 22px 12px 10px;
    background: linear-gradient(180deg, transparent, rgba(8,26,28,.72));
    color: #fff; font-size: 12px; line-height: 1.45;
    opacity: 0; transition: opacity .18s;
  }
  .pb-item:hover .cap { opacity: 1; }

  /* 照片顺序调整（PATCH .../photos/reorder） */
  .pb-item .ord {
    position: absolute; top: 8px; right: 8px; display: flex; gap: 4px;
    opacity: 0; transition: opacity .18s;
  }
  .pb-item:hover .ord, .pb-item .ord:focus-within { opacity: 1; }
  .pb-item .ord button {
    width: 26px; height: 26px; border: none; border-radius: 8px; padding: 0;
    background: rgba(255,255,255,.93); color: var(--brand); font-size: 13px;
    line-height: 1; cursor: pointer; display: grid; place-items: center;
    box-shadow: 0 2px 8px rgba(13,110,110,.18);
  }
  .pb-item .ord button:hover { background: #fff; }
  .pb-item .ord button:disabled { opacity: .35; cursor: not-allowed; }
  .pb-item .ord-n {
    position: absolute; top: 8px; left: 8px; min-width: 20px; height: 20px; padding: 0 5px;
    display: grid; place-items: center; border-radius: 6px;
    background: rgba(13,110,110,.66); color: #fff; font-size: 11px; font-weight: 600;
    opacity: 0; transition: opacity .18s;
  }
  .pb-item:hover .ord-n { opacity: 1; }

  /* 上下篇 */
  .pager { margin-top: 34px; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .pager a {
    background: #fff; border-radius: 13px; box-shadow: var(--card-shadow);
    padding: 15px 18px; text-decoration: none; display: flex; gap: 12px; align-items: center;
    transition: transform .16s, box-shadow .16s;
  }
  .pager a:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(13,110,110,.16); }
  .pager .dir { font-size: 18px; color: var(--brand); flex: none; }
  .pager .lbl { font-size: 11px; color: var(--mute); letter-spacing: .1em; }
  .pager .ttl { font-family: var(--slab); font-weight: 600; font-size: 15px; color: var(--ink); margin-top: 3px; }
  .pager .next { text-align: right; }
  .pager .next .dir { margin-left: auto; }

  /* ===== 侧栏卡 ===== */
  .aside { position: sticky; top: 26px; display: flex; flex-direction: column; gap: 14px; }
  .card {
    background: #fff; border-radius: 14px; box-shadow: var(--card-shadow); padding: 18px 20px;
  }
  .card.mood { border-top: 3px solid var(--mc); }
  .card .ct { font-size: 11px; letter-spacing: .16em; color: var(--mute); text-transform: uppercase; margin-bottom: 12px; }
  .mood-big { font-size: 34px; line-height: 1; }
  .mood-nm { font-family: var(--slab); font-weight: 600; font-size: 17px; color: var(--mc); margin-top: 8px; }
  .mood-desc { font-size: 12.5px; color: var(--mute); margin-top: 4px; line-height: 1.6; }

  .ctx-row { display: flex; gap: 10px; font-size: 12.5px; padding: 7px 0; border-bottom: 1px dashed var(--line); }
  .ctx-row:last-child { border-bottom: none; }
  .ctx-row .k { color: var(--mute); width: 62px; flex: none; }
  .ctx-row .v { color: var(--ink); font-weight: 500; }

  .toc a {
    display: block; font-size: 13px; color: var(--ink-2); text-decoration: none;
    padding: 7px 0 7px 12px; border-left: 3px solid transparent;
    transition: all .14s;
  }
  .toc a:hover { color: var(--brand); }
  .toc a.on { color: var(--mc); border-left-color: var(--mc); font-weight: 600; }
  .toc .empty { font-size: 12.5px; color: var(--mute); }

  /* 空/错误态 */
  .state-box {
    margin: 40px 44px; background: #fff; border-radius: 16px; box-shadow: var(--card-shadow);
    padding: 60px 30px; text-align: center;
  }
  .state-box .ic { font-size: 38px; margin-bottom: 10px; }
  .state-box .t { font-family: var(--slab); font-weight: 600; font-size: 18px; color: var(--ink); }
  .state-box .d { font-size: 13px; color: var(--mute); margin-top: 8px; }
  .state-box a { color: var(--brand); }

  /* ===== Toast ===== */
  .toast {
    position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%) translateY(16px);
    background: var(--ink); color: #fff; font-size: 13.5px;
    padding: 11px 20px; border-radius: 999px; opacity: 0; pointer-events: none;
    transition: opacity .22s, transform .22s; z-index: 99;
    box-shadow: 0 12px 32px rgba(18,58,60,.30); max-width: 76vw;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ===== 响应式 ===== */
  @media (max-width: 1024px) {
    .reading { grid-template-columns: 1fr; }
    .aside { position: static; }
    .hero h1 { font-size: 34px; }
  }
  @media (max-width: 980px) {
    .wrap { padding: 24px 24px 0; }
    .hero { grid-template-columns: 1fr; }
    .hero-r { min-height: 190px; order: -1; }
    .hero-l { padding: 24px 26px; }
    .state-box { margin: 24px; }
  }
  @media (max-width: 720px) {
    .shell { grid-template-columns: 1fr !important; }
    .side { position: static; height: auto; flex-direction: row; flex-wrap: wrap; align-items: center; padding: 12px 16px; border-right: none; border-bottom: 1px solid #C9E8E6; }
    .side .nav { flex: none; overflow: visible; }
    .rail-toggle { display: none; }
    .brand { display: block !important; padding: 0; }
    .brand-mark { display: none !important; }
    .nav-label { display: none; }
    .nav { display: flex; gap: 4px; flex-wrap: wrap; }
    .nav a { padding: 8px 10px; }
    .nav a .txt { display: inline !important; }
    .side-foot { margin-top: 0; margin-left: auto; border: none; padding: 0; }
    .side-foot .who { display: inline !important; }
    .wrap { padding: 20px 16px 0; }
    .hero h1 { font-size: 27px; }
    .prose p { font-size: 16px; }
    .prose .pull { font-size: 19px; }
    .pb-grid { grid-template-columns: repeat(2, 1fr); }
    .pager { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="shell">

  <aside class="side">
    <button class="rail-toggle" id="railToggle" aria-label="折叠侧边栏" aria-expanded="true" aria-controls="sideNav" title="折叠 / 展开">&#8249;</button>
    <div class="brand">Travel OS<small>行程驾驶舱</small></div>
    <div class="brand-mark" aria-hidden="true">T</div>
    <nav class="nav" id="sideNav" aria-label="主导航">
      <div class="nav-label">总览</div>
      <a href="/home/"><span class="ico" aria-hidden="true">&#8962;</span><span class="txt">首页</span></a>
      <a href="/trips/"><span class="ico" aria-hidden="true">&#9992;</span><span class="txt">我的旅行</span></a>
      <a href="/friends/"><span class="ico" aria-hidden="true">&#128101;</span><span class="txt">好友</span></a>
      <div class="nav-label">洞察</div>
      <a href="/stats/"><span class="ico" aria-hidden="true">&#9638;</span><span class="txt">旅行统计</span></a>
      <a href="/notifications/"><span class="ico" aria-hidden="true">&#9719;</span><span class="txt">通知中心</span></a>
      <div class="nav-label">行程</div>
      <a href="/map/"><span class="ico" aria-hidden="true">&#9673;</span><span class="txt">地图</span></a>
      <a href="/account/"><span class="ico" aria-hidden="true">&#9684;</span><span class="txt">账户</span></a>
    </nav>
    <div class="side-foot">
      <span class="avatar" id="avatar">A</span>
      <span class="who" id="who">…</span>
<button type="button" class="side-exit" id="sideLogout" title="退出登录" aria-label="退出登录">&#9211;</button>
    </div>
  </aside>

  <main>
    <div id="pageBody">
      <p style="padding:60px 44px;color:var(--mute);" id="loading">正在打开这篇游记…</p>
    </div>
  </main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="../assets/js/api.js"></script>
<script src="../assets/js/pet.js"></script>
<script>
  (function () {
    if (!requireLogin('/login/')) return;

    var qs = new URLSearchParams(location.search);
    var journalId = qs.get('id');
    var tripId = qs.get('trip');
    /* 渲染上下文：照片调序后本地同步并重渲染，不必重新拉数据 */
    var ctx = { j: null, trip: null, journals: null };
    if (!journalId) { location.replace('/trips/'); return; }

    /* ===== 壳 ===== */
    var user = getCurrentUser() || {};
    document.getElementById('who').textContent = user.displayName || user.username || '旅行者';
    document.getElementById('avatar').textContent = (user.displayName || user.username || 'A').charAt(0).toUpperCase();

    var shell = document.querySelector('.shell');
    var railBtn = document.getElementById('railToggle');
    var KEY = 'travel-os-rail-collapsed';
    function applyRail(collapsed) {
      shell.setAttribute('data-collapsed', collapsed ? 'true' : 'false');
      railBtn.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
      railBtn.setAttribute('aria-label', collapsed ? '展开侧边栏' : '折叠侧边栏');
      document.querySelectorAll('.nav a').forEach(function (a) {
        var t = a.querySelector('.txt');
        if (!t) return;
        if (collapsed) a.setAttribute('title', t.textContent); else a.removeAttribute('title');
      });
    }
    var saved = null;
    try { saved = localStorage.getItem(KEY); } catch (e) {}
    applyRail(saved === 'true');
    railBtn.addEventListener('click', function () {
      var next = shell.getAttribute('data-collapsed') !== 'true';
      applyRail(next);
      try { localStorage.setItem(KEY, next ? 'true' : 'false'); } catch (e) {}
    });

    /* ===== Toast ===== */
    var toast = document.getElementById('toast');
    var toastTimer = null;
    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { toast.classList.remove('show'); }, 2400);
    }

    /* ===== 常量 ===== */
    var MOODS = [
      { value: 'happy',   label: '开心', ic: '😄', c: '#FF8A4C', bg: '#FFF1E9', desc: '心情像那天的阳光一样透亮' },
      { value: 'excited', label: '兴奋', ic: '🤩', c: '#B8830F', bg: '#FDF5E2', desc: '肾上腺素到现在还没有退' },
      { value: 'tired',   label: '疲惫', ic: '😮‍💨', c: '#6B4FC0', bg: '#EFEAFB', desc: '身体在抗议，但心里觉得值得' },
      { value: 'sad',     label: '低落', ic: '🌧', c: '#5B6B7C', bg: '#EEF2F5', desc: '有些说不出口的失落' },
      { value: 'relaxed', label: '放松', ic: '😌', c: '#0D6E6E', bg: '#DCF2F0', desc: '整个人都是松的，什么都不急' }
    ];
    function moodOf(v) {
      for (var i = 0; i < MOODS.length; i++) if (MOODS[i].value === v) return MOODS[i];
      return { value: null, label: '记录', ic: '📖', c: '#0D6E6E', bg: '#DCF2F0', desc: '这一天的记录' };
    }
    var WD = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
    var $ = function (id) { return document.getElementById(id); };

    /* ===== 工具 ===== */
    function escapeHtml(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
    function wordCount(s) { return (s || '').replace(/\s/g, '').length; }
    function fmtDate(iso, withYear) {
      if (!iso) return '';
      var d = new Date(iso);
      if (isNaN(d)) return '';
      return (withYear ? d.getFullYear() + '年' : '') + (d.getMonth() + 1) + '月' + d.getDate() + '日';
    }
    function fmtHM(iso) {
      if (!iso) return '';
      var d = new Date(iso);
      return isNaN(d) ? '' : ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
    }

    /* 正文解析：短行且不以句读收尾 → 小标题；≥3 段时第 2 段做拉引句 */
    function parseContent(text) {
      var paras = String(text || '').split(/\n+/).map(function (s) { return s.trim(); }).filter(Boolean);
      var blocks = [];
      paras.forEach(function (p, i) {
        var isHeading = i > 0 && p.length <= 26 && !/[。！？；，、]$/.test(p);
        blocks.push({ type: isHeading ? 'h' : 'p', text: p });
      });
      var pIdx = blocks.map(function (b, i) { return b.type === 'p' ? i : -1; }).filter(function (i) { return i >= 0; });
      if (pIdx.length >= 3) blocks[pIdx[1]].pull = true;
      if (pIdx.length) blocks[pIdx[0]].dropcap = true;
      return blocks;
    }

    /* ===== 加载 ===== */
    async function load() {
      try {
        var listUrl = tripId ? ('/trips/' + tripId + '/journals') : null;
        var results = await Promise.allSettled([
          listUrl ? apiGet(listUrl) : Promise.resolve(null),
          tripId ? apiGet('/trips/' + tripId) : Promise.resolve(null)
        ]);
        var journals = (results[0].status === 'fulfilled' && results[0].value) ? (results[0].value.journals || []) : [];
        var trip = (results[1].status === 'fulfilled' && results[1].value) ? results[1].value.trip : null;

        /* 列表里没有 tripId 时，反查一次：先取全量 trips 找含此篇的行程 */
        if (!tripId) {
          var all = await apiGet('/trips');
          var trips = (all && all.trips) || [];
          for (var i = 0; i < trips.length; i++) {
            try {
              var ls = await apiGet('/trips/' + trips[i].id + '/journals');
              var found = (ls.journals || []).some(function (j) { return j.id === journalId; });
              if (found) { tripId = trips[i].id; journals = ls.journals || []; trip = trips[i]; break; }
            } catch (e) { /* 继续找 */ }
          }
        }

        /* 单篇详情（含照片） */
        var detail = await apiGet('/trips/' + tripId + '/journals/' + journalId);
        var j = detail && detail.journal;
        if (!j) throw new Error('not found');

        render(j, trip, journals);
      } catch (err) {
        $('pageBody').innerHTML = ''
          + '<div class="state-box">'
          +   '<div class="ic">🚫</div>'
          +   '<div class="t">找不到这篇游记</div>'
          +   '<div class="d">它可能已被删除，或你没有访问权限 · <a href="/trips/">回到我的旅行</a></div>'
          + '</div>';
      }
    }

    /* ===== 渲染 ===== */
    function ctxRow(k, v) {
      return '<div class="ctx-row"><span class="k">' + k + '</span><span class="v">' + v + '</span></div>';
    }

    function render(j, trip, journals) {
      var m = moodOf(j.mood);
      var photos = j.photos || [];
      var blocks = parseContent(j.content);
      var heads = blocks.filter(function (b) { return b.type === 'h'; });
      ctx.j = j; ctx.trip = trip; ctx.journals = journals;

      /* 上下篇（列表按创建时间倒序，取相邻） */
      var sorted = (journals || []).slice().sort(function (a, b) {
        return new Date(a.createdAt || 0) - new Date(b.createdAt || 0);
      });
      var idx = -1;
      for (var i = 0; i < sorted.length; i++) if (sorted[i].id === j.id) { idx = i; break; }
      var prev = idx > 0 ? sorted[idx - 1] : null;
      var next = idx >= 0 && idx < sorted.length - 1 ? sorted[idx + 1] : null;
      var listHref = tripId ? '/journals/?trip=' + encodeURIComponent(tripId) : '/journals/';

      var title = j.title || '无题';
      document.title = 'Travel OS · ' + title;

      /* 正文 HTML */
      var headingSeq = 0;
      var proseHtml = blocks.map(function (b) {
        if (b.type === 'h') {
          headingSeq++;
          return '<h3 id="sec-' + headingSeq + '">' + escapeHtml(b.text) + '</h3>';
        }
        var cls = b.pull ? 'pull' : (b.dropcap ? 'dropcap' : '');
        var tag = b.pull ? 'blockquote' : 'p';
        return '<' + tag + (cls ? ' class="' + cls + '"' : '') + '>' + escapeHtml(b.text) + '</' + tag + '>';
      }).join('');

      var photoBand = photos.length
        ? '<section class="photo-band">'
          +   '<div class="bt">这一天的影像 <small>· ' + photos.length + ' 张'
          +     (photos.length > 1 ? ' · 悬停可调整顺序' : '') + '</small></div>'
          +   '<div class="pb-grid">' + photos.map(function (p, i) {
                return '<figure class="pb-item" data-pid="' + escapeHtml(p.id) + '">'
                  + '<img src="' + escapeHtml(p.url) + '" alt="' + escapeHtml(p.caption || '') + '" loading="lazy">'
                  + '<span class="ord-n">' + (i + 1) + '</span>'
                  + '<div class="ord">'
                  +   '<button type="button" data-mv="-1" data-pid="' + escapeHtml(p.id) + '"'
                  +     ' aria-label="这张往前移"' + (i === 0 ? ' disabled' : '') + '>&#8592;</button>'
                  +   '<button type="button" data-mv="1" data-pid="' + escapeHtml(p.id) + '"'
                  +     ' aria-label="这张往后移"' + (i === photos.length - 1 ? ' disabled' : '') + '>&#8594;</button>'
                  + '</div>'
                  + (p.caption ? '<figcaption class="cap">' + escapeHtml(p.caption) + '</figcaption>' : '')
                  + '</figure>';
              }).join('') + '</div>'
          + '</section>'
        : '';

      var pager = (prev || next)
        ? '<nav class="pager">'
          + (prev
              ? '<a href="/journal-detail/?id=' + encodeURIComponent(prev.id) + (tripId ? '&trip=' + encodeURIComponent(tripId) : '') + '">'
                + '<span class="dir">←</span><span><span class="lbl">上一篇</span><span class="ttl">' + escapeHtml(prev.title || '无题') + '</span></span></a>'
              : '<span></span>')
          + (next
              ? '<a href="/journal-detail/?id=' + encodeURIComponent(next.id) + (tripId ? '&trip=' + encodeURIComponent(tripId) : '') + '" class="next-link">'
                + '<span class="next" style="flex:1"><span class="lbl">下一篇</span><span class="ttl">' + escapeHtml(next.title || '无题') + '</span></span><span class="dir">→</span></a>'
              : '<span></span>')
          + '</nav>'
        : '';

      var dayCtx = j.tripDay ? ('D' + j.tripDay.dayIndex + ' · ' + fmtDate(j.tripDay.date)) : null;
      var placeCtx = j.tripPlace ? j.tripPlace.name : null;

      var tocHtml = heads.length
        ? '<div class="card"><div class="ct">本篇目录</div><nav class="toc" id="toc">'
            + heads.map(function (h, i) {
                return '<a href="#sec-' + (i + 1) + '">' + escapeHtml(h.text) + '</a>';
              }).join('')
          + '</nav></div>'
        : '';

      $('pageBody').innerHTML = ''
        + '<div class="wrap">'
        +   '<section class="hero" id="hero">'
        +     '<div class="hero-l">'
        +       '<nav class="crumb">'
        +         '<a href="/trips/">我的旅行</a><span>/</span>'
        +         (trip ? '<a href="/trip-detail/?id=' + encodeURIComponent(tripId) + '">' + escapeHtml(trip.title || '行程') + '</a><span>/</span>' : '')
        +         '<a href="' + listHref + '">旅行游记</a><span>/</span><b>阅读</b>'
        +       '</nav>'
        +       '<span class="mood-chip">' + m.ic + ' ' + m.label + '</span>'
        +       '<h1>' + escapeHtml(title) + '</h1>'
        +       '<p class="sub">' + escapeHtml((j.content || '').replace(/\n+/g, ' ').slice(0, 90)) + (wordCount(j.content) > 90 ? '…' : '') + '</p>'
        +       '<div class="hero-meta">'
        +         '<span>📅 <b>' + fmtDate(j.createdAt, true) + '</b></span>'
        +         '<span>✎ <b>' + wordCount(j.content).toLocaleString('zh-CN') + '</b> 字</span>'
        +         (photos.length ? '<span>🖼 <b>' + photos.length + '</b> 张照片</span>' : '')
        +         '<span>' + WD[new Date(j.createdAt).getDay()] + '</span>'
        +         (j.isDraft ? '<span style="color:#B8830F;font-weight:600;">草稿 · 未发布</span>' : '')
        +       '</div>'
        +       ((dayCtx || placeCtx)
            ? '<div class="ctx-chips">'
              + (dayCtx ? '<a class="ctx" href="/itinerary/?trip=' + encodeURIComponent(tripId) + '">📅 ' + dayCtx + '</a>' : '')
              + (placeCtx ? '<a class="ctx" href="/itinerary/?trip=' + encodeURIComponent(tripId) + '">◉ ' + escapeHtml(placeCtx) + '</a>' : '')
              + '</div>'
            : '')
        +       '<div class="hero-actions">'
        +         '<a class="edit" href="' + listHref + '&edit=' + encodeURIComponent(j.id) + '">✎ 编辑这篇</a>'
        +         '<a class="ghost" href="' + listHref + '">← 返回列表</a>'
        +         '<button type="button" class="del" id="btnDel">删除</button>'
        +       '</div>'
        +     '</div>'
        +     '<div class="hero-r">'
        +       '<svg viewBox="0 0 420 380" preserveAspectRatio="xMidYMid slice" aria-hidden="true">'
        +         '<defs>'
        +           '<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">'
        +             '<stop offset="0%" stop-color="' + m.bg + '"/><stop offset="100%" stop-color="#FFFFFF"/></linearGradient>'
        +         '</defs>'
        +         '<rect width="420" height="380" fill="url(#sky)"/>'
        +         '<circle cx="312" cy="112" r="46" fill="' + m.c + '" opacity=".26"/>'
        +         '<path d="M0 268 Q84 214 168 250 T420 228 L420 380 L0 380Z" fill="' + m.c + '" opacity=".16"/>'
        +         '<path d="M0 310 Q120 268 226 296 T420 276 L420 380 L0 380Z" fill="' + m.c + '" opacity=".26"/>'
        +         '<path d="M52 186 q15 -22 30 0 q15 -22 30 0" stroke="' + m.c + '" stroke-width="2.5" fill="none" opacity=".45"/>'
        +         '<path d="M198 150 q12 -18 24 0 q12 -18 24 0" stroke="' + m.c + '" stroke-width="2" fill="none" opacity=".32"/>'
        +       '</svg>'
        +       '<span class="day-stamp">' + (dayCtx ? dayCtx + ' · ' : '') + fmtHM(j.createdAt) + '</span>'
        +     '</div>'
        +   '</section>'

        +   '<div class="reading">'
        +     '<article class="article" style="--mc:' + m.c + ';--mb:' + m.bg + ';">'
        +       '<div class="prose">' + proseHtml + '</div>'
        +       photoBand
        +       pager
        +     '</article>'
        +     '<aside class="aside" style="--mc:' + m.c + ';--mb:' + m.bg + ';">'
        +       '<div class="card mood">'
        +         '<div class="ct">当日心情</div>'
        +         '<div class="mood-big">' + m.ic + '</div>'
        +         '<div class="mood-nm">' + m.label + '</div>'
        +         '<div class="mood-desc">' + m.desc + '</div>'
        +       '</div>'
        +       '<div class="card">'
        +         '<div class="ct">行程上下文</div>'
        +         (trip ? ctxRow('旅行', escapeHtml(trip.title || '—')) : '')
        +         ctxRow('日期', fmtDate(j.createdAt, true) + ' · ' + WD[new Date(j.createdAt).getDay()])
        +         ctxRow('行程天', dayCtx ? escapeHtml(dayCtx) : '—')
        +         ctxRow('地点', placeCtx ? escapeHtml(placeCtx) : '—')
        +         ctxRow('字数', wordCount(j.content).toLocaleString('zh-CN') + ' 字')
        +         ctxRow('照片', photos.length + ' 张')
        +       '</div>'
        +       tocHtml
        +     '</aside>'
        +   '</div>'
        + '</div>';

      /* 目录高亮 */
      var toc = $('toc');
      if (toc) {
        var links = Array.prototype.slice.call(toc.querySelectorAll('a'));
        function onScroll() {
          var best = null;
          links.forEach(function (a) {
            var el = document.getElementById(a.getAttribute('href').slice(1));
            if (!el) return;
            if (el.getBoundingClientRect().top <= 120) best = a;
          });
          links.forEach(function (a) { a.classList.toggle('on', a === best); });
        }
        window.addEventListener('scroll', onScroll, { passive: true });
        onScroll();
      }

      /* 删除 */
      var delBtn = $('btnDel');
      if (delBtn) {
        delBtn.addEventListener('click', async function () {
          if (!confirm('删除游记「' + title + '」？')) return;
          try {
            await apiDelete('/trips/' + tripId + '/journals/' + j.id);
            showToast('已删除，正在返回列表…');
            setTimeout(function () { location.href = listHref; }, 700);
          } catch (err) { showToast(humanError(err)); }
        });
      }
    }

    /* ===== 照片调序（PATCH /trips/{id}/journals/{jid}/photos/reorder） ===== */
    document.addEventListener('click', async function (e) {
      var btn = e.target.closest('button[data-mv]');
      if (!btn || btn.disabled) return;
      var j = ctx.j;
      if (!j || !j.photos || j.photos.length < 2) return;

      var pid = btn.getAttribute('data-pid');
      var delta = Number(btn.getAttribute('data-mv'));
      var i = j.photos.findIndex(function (p) { return p.id === pid; });
      var k = i + delta;
      if (i < 0 || k < 0 || k >= j.photos.length) return;

      var ids = j.photos.map(function (p) { return p.id; });
      var next = ids.slice();
      next[i] = ids[k];
      next[k] = ids[i];

      btn.disabled = true;
      try {
        await apiPatch('/trips/' + tripId + '/journals/' + j.id + '/photos/reorder', { photoIds: next });
        var tmp = j.photos[i];
        j.photos[i] = j.photos[k];
        j.photos[k] = tmp;
        render(j, ctx.trip, ctx.journals);
        showToast('已调整照片顺序');
      } catch (err) {
        btn.disabled = false;
        showToast(humanError(err));
      }
    });

    /* ===== 启动 ===== */
    load();
  })();
</script>
</body>
</html>
