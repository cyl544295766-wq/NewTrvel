<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Travel OS · 管理后台</title>
<link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Space+Grotesk:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/theme.css">
<link rel="stylesheet" href="../assets/css/pet.css">
<style>
  /* ===== 骨架（与全站一致） ===== */
  .shell {
    display: grid;
    grid-template-columns: var(--rail-w, 232px) 1fr;
    min-height: 100vh;
    transition: grid-template-columns 0.24s cubic-bezier(0.4,0,0.2,1);
  }
  .shell[data-collapsed="true"] { --rail-w: 76px; }
  .side {
    position: sticky; top: 0; height: 100vh;
    background: linear-gradient(180deg, var(--side-a) 0%, #DCF2F0 100%);
    padding: 18px 14px 20px;
    display: flex; flex-direction: column; gap: 6px;
    border-right: 1px solid rgba(255,255,255,.1); overflow: hidden;
  }
  .side .nav { flex: 1 1 auto; min-height: 0; overflow-y: auto; scrollbar-width: thin; }
  .side .nav::-webkit-scrollbar { width: 5px; }
  .side .nav::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 3px; }
  .rail-toggle {
    align-self: flex-end; width: 34px; height: 34px; margin-bottom: 8px;
    display: grid; place-items: center; border: none; border-radius: 9px;
    background: rgba(255,255,255,0.7); color: #7FD8D4; font-size: 15px;
    cursor: pointer; flex: none; transition: background .16s, transform .24s;
  }
  .rail-toggle:hover { background: rgba(255,255,255,.07); }
  .shell[data-collapsed="true"] .rail-toggle { transform: rotate(180deg); align-self: center; }
  .brand { font-family: var(--slab); font-weight: 700; font-size: 23px; padding: 0 8px 4px; color: #7FD8D4; white-space: nowrap; }
  .brand small { display: block; font-weight: 500; font-size: 11px; color: rgba(255,255,255,.45); letter-spacing: .1em; margin-top: 2px; }
  .brand-mark { display: none; font-family: var(--slab); font-weight: 700; font-size: 20px; color: #7FD8D4; text-align: center; padding: 4px 0 6px; }
  .nav-label { font-size: 11px; letter-spacing: .15em; color: rgba(255,255,255,.45); padding: 20px 10px 6px; white-space: nowrap; }
  .nav a {
    display: flex; align-items: center; gap: 12px; padding: 10px 12px;
    color: rgba(255,255,255,.7); text-decoration: none; font-size: 14.5px; border-radius: 9px;
    white-space: nowrap; transition: background .16s, color .16s;
  }
  .nav a .ico { flex: none; width: 20px; text-align: center; font-size: 15px; }
  .nav a:hover { background: rgba(22,26,35,.8); color: #7FD8D4; }
  .nav a[aria-current="page"] { background: #161A23; color: #7FD8D4; font-weight: 600; box-shadow: 0 2px 8px rgba(13,110,110,0.10); }
  .nav a[aria-current="page"] .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--stamp); margin-left: auto; }
  .side-foot {
    margin-top: auto; padding: 14px 8px 4px; border-top: 1px dashed rgba(255,255,255,.14);
    font-size: 13px; color: rgba(255,255,255,.7); display: flex; align-items: center; gap: 9px; white-space: nowrap;
  }
  .side-foot .avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--brand-soft); color: #fff; display: grid; place-items: center; font-size: 11px; font-weight: 600; flex: none; }
  .side-foot .side-exit {
    margin-left: auto; width: 26px; height: 26px; border: none; border-radius: 8px; flex: none;
    background: rgba(255,255,255,0.7); color: rgba(255,255,255,.45); font-size: 13px; line-height: 1;
    cursor: pointer; transition: background .16s, color .16s;
  }
  .side-foot .side-exit:hover { background: #161A23; color: var(--danger-deep); }
  .shell[data-collapsed="true"] .side-foot .side-exit { margin-left: 0; }
  .shell[data-collapsed="true"] .nav a { justify-content: center; padding: 11px 0; }
  .shell[data-collapsed="true"] .nav a .txt,
  .shell[data-collapsed="true"] .brand,
  .shell[data-collapsed="true"] .side-foot .who { display: none; }
  .shell[data-collapsed="true"] .brand-mark { display: block; }
  .shell[data-collapsed="true"] .nav-label { padding: 0; margin: 14px 12px 6px; height: 0; border-top: 1px solid rgba(255,255,255,.1); font-size: 0; overflow: hidden; }
  .shell[data-collapsed="true"] .side-foot { justify-content: center; padding: 14px 0 4px; }
  .side-foot .who { overflow: hidden; text-overflow: ellipsis; }

  /* ===== 主区 ===== */
  main { padding: 36px 44px 60px; max-width: 1560px; width: 100%; margin: 0 auto; }
  h1 { font-family: var(--slab); font-weight: 600; font-size: 32px; line-height: 1.15; color: #7FD8D4; }
  h1 .en { display: block; font-size: 12px; font-family: var(--grot); font-weight: 500; letter-spacing: .24em; color: rgba(255,255,255,.45); text-transform: uppercase; margin-top: 8px; }
  .page-sub { font-size: 13.5px; color: rgba(255,255,255,.45); margin-top: 8px; }

  .stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px; margin-top: 22px; }
  .stat {
    background: #161A23; border-radius: 13px; padding: 16px 18px;
    box-shadow: 0 14px 44px rgba(0,0,0,.3), 0 2px 6px rgba(0,0,0,.18);
  }
  .stat b { display: block; font-family: var(--slab); font-weight: 700; font-size: 26px; color: #7FD8D4; line-height: 1.1; }
  .stat span { display: block; font-size: 11.5px; color: rgba(255,255,255,.45); margin-top: 4px; }

  .card {
    background: #161A23; border-radius: 14px; margin-top: 22px;
    box-shadow: 0 14px 44px rgba(0,0,0,.3), 0 2px 6px rgba(0,0,0,.18);
    padding: 20px 22px;
  }
  .card .ct { font-family: var(--slab); font-weight: 600; font-size: 17px; color: rgba(255,255,255,.82); }
  .card .ct small { font-family: var(--grot); font-weight: 500; font-size: 11.5px; color: rgba(255,255,255,.45); }

  table { width: 100%; border-collapse: collapse; margin-top: 14px; font-size: 13px; }
  th { text-align: left; font-family: var(--grot); font-size: 11px; letter-spacing: .08em; color: rgba(255,255,255,.45); padding: 8px 10px; border-bottom: 1.5px solid rgba(255,255,255,.08); white-space: nowrap; }
  td { padding: 10px; border-bottom: 1px dashed rgba(255,255,255,.08); color: rgba(255,255,255,.7); vertical-align: top; }
  tr:hover td { background: rgba(255,255,255,.06); }
  td .msg { display: block; max-width: 480px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  td .mono { font-family: var(--grot); font-size: 11.5px; color: rgba(255,255,255,.45); }
  td a { color: #7FD8D4; text-decoration: none; border-bottom: 1px dashed var(--brand-soft); }

  /* 窄屏横向滚动：包装在 .tbl-scroll 内，保证表格不挤压溢出 */
  table.tbl-ci { min-width: 720px; }
  table.tbl-users { min-width: 560px; }

  .badge { display: inline-flex; align-items: center; gap: 4px; font-family: var(--grot); font-size: 10.5px; font-weight: 600; border-radius: 999px; padding: 2px 9px; white-space: nowrap; }
  .badge.success { color: var(--ok); background: rgba(85,190,124,.12); }
  .badge.failure { color: var(--danger); background: var(--danger-bg); }
  .badge.cancelled, .badge.skipped { color: #8A9BA5; background: rgba(255,255,255,.06); }
  .badge.super { color: #6B4FC0; background: rgba(138,122,224,.14); }
  .badge.user { color: rgba(255,255,255,.7); background: rgba(255,255,255,.06); }
  .badge.active { color: var(--ok); background: rgba(85,190,124,.12); }
  .badge.disabled { color: var(--danger); background: var(--danger-bg); }
  .badge.deleted { color: #8A9BA5; background: rgba(255,255,255,.06); }

  .btn-plain {
    font-family: var(--grot); font-size: 12px; color: rgba(255,255,255,.7); background: var(--mist, #F2FAF9);
    border: none; border-radius: 8px; padding: 6px 12px; cursor: pointer; transition: background .16s, color .16s;
  }
  .btn-plain:hover { background: rgba(91,197,192,.14); color: #7FD8D4; }
  .btn-plain.danger { color: var(--danger); }
  .btn-plain.danger:hover { background: var(--danger-bg); }
  .actions { display: flex; gap: 6px; flex-wrap: wrap; }

  .search-row { display: flex; gap: 9px; margin-top: 14px; }
  .search-row input {
    flex: 1; min-width: 0; font-family: var(--grot); font-size: 13px; color: rgba(255,255,255,.82);
    background: rgba(255,255,255,.06); border: 1.5px solid rgba(255,255,255,.08); border-radius: 9px; padding: 9px 12px; outline: none;
  }
  .search-row input:focus { border-color: var(--brand-soft); box-shadow: 0 0 0 3px rgba(91,197,192,.18); }
  .btn-primary-sm {
    font-family: var(--grot); font-size: 13px; font-weight: 600; color: #fff;
    background: var(--brand); border: none; border-radius: 9px; padding: 9px 18px; cursor: pointer;
  }
  .state-box { text-align: center; padding: 80px 20px; }
  .state-box .ic { font-size: 44px; }
  .state-box .t { font-family: var(--slab); font-weight: 600; font-size: 20px; color: rgba(255,255,255,.82); margin-top: 12px; }
  .state-box .d { font-size: 13px; color: rgba(255,255,255,.45); margin-top: 8px; }
  .state-box a { color: #7FD8D4; }

  .toast {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(12px);
    background: var(--ink, #123A3C); color: #fff; font-size: 13px; font-family: var(--grot);
    padding: 11px 20px; border-radius: 10px; z-index: 99;
    opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 980px) {
    main { padding: 28px 24px 50px; }
  }
  @media (max-width: 720px) {
    .shell { grid-template-columns: 1fr; }
    .side {
      position: static; height: auto; flex-direction: row; flex-wrap: wrap; align-items: center;
      padding: 12px 16px; border-right: none; border-bottom: 1px solid rgba(255,255,255,.1);
    }
    .side .nav { flex: none; overflow: visible; }
    .rail-toggle { display: none; }
    .brand { font-size: 19px; padding: 0 2px; }
    .brand small, .brand-mark { display: none; }
    .nav-label { display: none; }
    .nav { display: flex; gap: 3px; flex-wrap: wrap; }
    .nav a { padding: 7px 9px; font-size: 13px; }
    .side-foot { margin-top: 0; margin-left: auto; border-top: none; padding: 0; }
    main { padding: 22px 16px 40px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

  /* ===== 顶部横版菜单（全站统一，暗色顶栏） ===== */
  /* 覆盖 theme.css 的 html,body{height:100%}：body 盒高被锁死会限制 sticky 吸顶范围 */
  html, body { height: auto; min-height: 100%; }
  .topbar {
    position: sticky; top: 0; z-index: 60;
    background: rgba(10,11,14,.94);
    -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
    border-bottom: 1px solid rgba(255,255,255,.08);
  }
  .tb-inner {
    max-width: 1280px; margin: 0 auto; padding: 0 44px;
    height: 66px; display: flex; align-items: center; gap: 20px;
  }
  .tb-brand {
    flex: none; text-decoration: none; line-height: 1.05;
    font-family: var(--slab); font-weight: 700; font-size: 21px; color: #fff;
  }
  .tb-brand small {
    display: block; font-family: var(--grot); font-weight: 500; font-size: 9px;
    letter-spacing: .26em; color: rgba(255,255,255,.42); margin-top: 2px;
  }
  .tb-nav {
    display: flex; align-items: center; gap: 2px; flex: 1 1 auto; min-width: 0;
    overflow-x: auto; scrollbar-width: none;
  }
  .tb-nav::-webkit-scrollbar { display: none; }
  .tb-nav a {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 8px 11px; border-radius: 10px;
    color: rgba(255,255,255,.72); text-decoration: none;
    font-family: var(--grot); font-size: 13px; white-space: nowrap;
    transition: background .16s, color .16s;
  }
  .tb-nav a .ico { flex: none; width: 22px; height: 22px; display: grid; place-items: center; }
  .tb-nav a .ico svg { width: 21px; height: 21px; display: block; filter: drop-shadow(0 1.5px 3px rgba(0,0,0,.35)); }
  .tb-nav a:hover { background: rgba(255,255,255,.09); color: #fff; }
  .tb-nav a[aria-current="page"] { background: rgba(255,255,255,.13); color: #fff; font-weight: 600; }
  .tb-nav a[aria-current="page"] .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--stamp); margin-left: 3px; }
  .tb-nav a .badge {
    margin-left: 3px; min-width: 17px; height: 17px; padding: 0 5px;
    display: inline-grid; place-items: center;
    font-family: var(--grot); font-size: 10px; font-weight: 600;
    color: #fff; background: var(--stamp); border-radius: 999px;
  }
  .tb-nav a .badge[hidden] { display: none; }
  .tb-user { flex: none; display: flex; align-items: center; gap: 9px; margin-left: auto; }
  .tb-user .avatar {
    width: 30px; height: 30px; border-radius: 50%;
    background: var(--brand-soft); color: #fff;
    display: grid; place-items: center; font-family: var(--grot);
    font-size: 11px; font-weight: 600; flex: none;
  }
  .tb-user .who {
    max-width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-family: var(--grot); font-size: 13px; color: rgba(255,255,255,.8);
  }
  .tb-user .side-exit {
    width: 28px; height: 28px; border: none; border-radius: 9px; flex: none;
    background: rgba(255,255,255,.08); color: rgba(255,255,255,.66);
    font-size: 13px; line-height: 1; cursor: pointer;
    transition: background .16s, color .16s;
  }
  .tb-user .side-exit:hover { background: rgba(255,255,255,.18); color: #fff; }
  @media (max-width: 720px) {
    .tb-inner { height: auto; flex-wrap: wrap; padding: 10px 16px 8px; gap: 10px; }
    .tb-brand { font-size: 18px; }
    .tb-user { margin-left: auto; }
    .tb-user .who { display: none; }
    .tb-nav { order: 3; flex: 1 1 100%; padding-bottom: 4px; }
    .tb-nav a { padding: 7px 10px; }
    .tb-nav a .ico { width: 19px; height: 19px; }
    .tb-nav a .ico svg { width: 18px; height: 18px; }
  }

  /* ===== 暗色线条图标（#ln-*）：配色与线宽 ===== */
  .ln { fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; }
  .tb-nav a .ico svg.ln { color: #8FE0DB; stroke-width: 2.1; }
</style>
</head>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="../assets/js/api.js"></script><script>try{if(((window.getCurrentUser?getCurrentUser():null)||{}).role!=="super_admin"){document.documentElement.setAttribute("data-hide-admin","1")}}catch(e){}</script>
<script src="../assets/js/pet.js"></script>
<script>
  (async function () {
    if (!requireLogin('/login/')) return;
    var user = getCurrentUser() || {};
    document.getElementById('who').textContent = user.displayName || user.username || '旅行者';
    document.getElementById('avatar').textContent = (user.displayName || user.username || 'A').charAt(0).toUpperCase();

    /* 权限门禁（P2-4）：以服务端 /auth/me 返回的 role 为准，避免本地缓存角色过期；
       服务端不可达时退回本地缓存判断 */
    var effectiveRole = user.role;
    try {
      var me = await apiGet('/auth/me');
      if (me && me.user && me.user.role) effectiveRole = me.user.role;
    } catch (err) { /* fallback to cached role */ }
    if (effectiveRole !== 'super_admin') {
      document.getElementById('pageBody').innerHTML =
        '<div class="state-box"><div class="ic">🔒</div><div class="t">需要超级管理员权限</div>'
        + '<div class="d">当前账户是普通用户，无法访问管理后台 · <a href="/home/">返回首页</a></div></div>';
      return;
    }

    var $ = function (id) { return document.getElementById(id); };
    var toastTimer = null;
    function showToast(msg) {
      var toast = $('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { toast.classList.remove('show'); }, 2600);
    }
    function escapeHtml(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
    function fmtTime(iso) {
      if (!iso) return '—';
      var d = new Date(iso);
      if (isNaN(d)) return iso;
      return (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
    }
    function fmtDuration(sec) {
      if (sec == null) return '—';
      if (sec < 60) return sec + ' 秒';
      return Math.floor(sec / 60) + ' 分 ' + (sec % 60) + ' 秒';
    }

    /* 折叠侧栏 */
    var shell = document.querySelector('.shell') || { setAttribute: function () {}, getAttribute: function () { return null; } };
    var railBtn = document.getElementById('railToggle') || { setAttribute: function () {}, addEventListener: function () {} };
    var KEY = 'travel-os-rail-collapsed';
    function applyRail(collapsed) {
      shell.setAttribute('data-collapsed', collapsed ? 'true' : 'false');
      railBtn.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
      document.querySelectorAll('.nav a').forEach(function (a) {
        var t = a.querySelector('.txt');
        if (!t) return;
        if (collapsed) a.setAttribute('title', t.textContent); else a.removeAttribute('title');
      });
    }
    var saved = null;
    try { saved = localStorage.getItem(KEY); } catch (e) {}
    applyRail(saved === 'true');
    railBtn.addEventListener('click', function () {
      var next = shell.getAttribute('data-collapsed') !== 'true';
      applyRail(next);
      try { localStorage.setItem(KEY, next ? 'true' : 'false'); } catch (e) {}
    });

    /* ===== 概览 ===== */
    async function loadOverview() {
      try {
        var d = await apiGet('/admin/overview');
        var last = d.ciLastRun || {};
        var lastDeployTime = last.finished_at ? fmtTime(last.finished_at) : '暂无部署';
        $('ovStats').innerHTML =
          '<div class="stat"><b>' + (d.users ?? 0) + '</b><span>注册用户总数（活跃 ' + (d.activeUsers ?? 0) + '）</span></div>'
          + '<div class="stat"><b>' + (d.trips ?? 0) + '</b><span>行程总数（所有用户）</span></div>'
          + '<div class="stat"><b>' + (d.journals ?? 0) + '</b><span>攻略总数</span></div>'
          + '<div class="stat"><b>' + (d.aiRequestsToday ?? 0) + '</b><span>今日 AI 请求次数</span></div>'
          + '<div class="stat"><b>' + (d.ciTotalRuns ?? 0) + '</b><span>CI 运行总次数</span></div>'
          + '<div class="stat"><b style="font-size:17px;">' + escapeHtml(lastDeployTime) + '</b>'
          + '<span>最近一次部署时间' + (last.run_number ? '（#' + escapeHtml(String(last.run_number)) + '）' : '') + '</span></div>';
      } catch (err) {
        showToast(humanError(err));
      }
    }

    /* ===== CI 运行记录 ===== */
    function conclusionBadge(c) {
      var map = { success: '✅ 成功', failure: '❌ 失败', cancelled: '⏹ 取消', skipped: '⏭ 跳过' };
      return '<span class="badge ' + escapeHtml(c || '') + '">' + (map[c] || c || '—') + '</span>';
    }
    async function loadCi() {
      try {
        var d = await apiGet('/admin/ci/runs');
        var runs = d.runs || [];
        $('ciBody').innerHTML = runs.map(function (r) {
          var firstLine = String(r.message || '').split('\n')[0];
          return '<tr>'
            + '<td><span class="mono">#' + escapeHtml(String(r.run_number)) + '</span></td>'
            + '<td>' + conclusionBadge(r.conclusion) + '</td>'
            + '<td><span class="msg" title="' + escapeHtml(firstLine) + '">' + escapeHtml(firstLine) + '</span>'
            +   '<span class="mono">' + escapeHtml(String(r.commit || '').slice(0, 7)) + '</span></td>'
            + '<td>' + escapeHtml(r.branch || '—') + '</td>'
            + '<td>' + escapeHtml(r.actor || '—') + ' / ' + escapeHtml(r.event || '—') + '</td>'
            + '<td>' + fmtDuration(r.duration_sec) + '</td>'
            + '<td>' + fmtTime(r.finished_at) + '</td>'
            + '<td><a href="' + escapeHtml(r.url || '#') + '" target="_blank" rel="noopener">Actions ↗</a></td>'
            + '</tr>';
        }).join('');
      } catch (err) {
        $('ciBody').innerHTML = '<tr><td colspan="8">' + escapeHtml(humanError(err)) + '</td></tr>';
      }
    }

    /* ===== 用户管理 ===== */
    var ROLE_TAG = { super_admin: '超级管理员', user: '普通用户' };
    var STATUS_TAG = { active: '正常', disabled: '已禁用', deleted: '已注销' };
    async function loadUsers(kw) {
      try {
        var url = '/admin/users' + (kw ? '?keyword=' + encodeURIComponent(kw) : '');
        var d = await apiGet(url);
        var users = d.users || [];
        $('userBody').innerHTML = users.map(function (u) {
          var isSelf = u.id === user.id;
          var acts = '';
          if (!isSelf && u.role !== 'super_admin') {
            acts += u.status === 'active'
              ? '<button type="button" class="btn-plain danger" data-act="disable" data-uid="' + escapeHtml(u.id) + '">禁用</button>'
              : '<button type="button" class="btn-plain" data-act="enable" data-uid="' + escapeHtml(u.id) + '">启用</button>';

          }
          return '<tr>'
            + '<td><b>' + escapeHtml(u.displayName || u.username) + '</b> <span class="mono">@' + escapeHtml(u.username) + '</span>'
            +   '<span class="mono" style="display:block;">ID ' + escapeHtml(u.id) + '</span></td>'
            + '<td><span class="badge ' + escapeHtml(u.role) + '">' + (ROLE_TAG[u.role] || u.role) + '</span></td>'
            + '<td><span class="badge ' + escapeHtml(u.status) + '">' + (STATUS_TAG[u.status] || u.status) + '</span></td>'
            + '<td>' + fmtTime(u.lastLoginAt) + '</td>'
            + '<td>' + fmtTime(u.createdAt) + '</td>'
            + '<td><div class="actions">' + (isSelf ? '<span class="mono">当前账户</span>' : acts) + '</div></td>'
            + '</tr>';
        }).join('');
      } catch (err) {
        $('userBody').innerHTML = '<tr><td colspan="6">' + escapeHtml(humanError(err)) + '</td></tr>';
      }
    }

    async function userAction(act, uid) {
      try {
        var d;
        if (act === 'disable') {
          if (!confirm('禁用该账户？禁用后 TA 将立即无法登录。')) return;
          d = await apiPatch('/admin/users/' + encodeURIComponent(uid) + '/status', { status: 'disabled' });
        } else if (act === 'enable') {
          d = await apiPatch('/admin/users/' + encodeURIComponent(uid) + '/status', { status: 'active' });
        }

        showToast((d && d.message) || '操作成功');
        await Promise.all([loadUsers($('userKw').value.trim()), loadOverview()]);
      } catch (err) {
        showToast(humanError(err));
      }
    }

    $('btnUserSearch').addEventListener('click', function () { loadUsers($('userKw').value.trim()); });
    $('userKw').addEventListener('keydown', function (e) { if (e.key === 'Enter') loadUsers($('userKw').value.trim()); });
    $('userBody').addEventListener('click', function (e) {
      var b = e.target.closest('button[data-act]');
      if (b) userAction(b.getAttribute('data-act'), b.getAttribute('data-uid'));
    });

    loadOverview();
    loadCi();
    loadUsers();
  })();
</script>
</body>
</html>
