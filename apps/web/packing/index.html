<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Travel OS · 打包清单</title>
<link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Space+Grotesk:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/theme.css">
<link rel="stylesheet" href="../assets/css/pet.css">
<style>
  /* ===== 骨架（与全站统一：侧栏 + 主区） ===== */
  .shell {
    display: grid;
    grid-template-columns: var(--rail-w, 232px) 1fr;
    min-height: 100vh;
    transition: grid-template-columns 0.24s cubic-bezier(0.4,0,0.2,1);
  }
  .shell[data-collapsed="true"] { --rail-w: 76px; }

  .side {
    position: sticky; top: 0; height: 100vh; /* 吸附视口：内容再长，用户信息/退出也不随页面滚走 */
    background: linear-gradient(180deg, #E8F6F5 0%, #DCF2F0 100%);
    padding: 18px 14px 20px;
    display: flex; flex-direction: column; gap: 6px;
    border-right: 1px solid #C9E8E6; overflow: hidden;
  }
  /* 导航过长时内部滚动，品牌区与底部用户区保持固定可见 */
  .side .nav { flex: 1 1 auto; min-height: 0; overflow-y: auto; scrollbar-width: thin; }
  .side .nav::-webkit-scrollbar { width: 5px; }
  .side .nav::-webkit-scrollbar-thumb { background: #C9E8E6; border-radius: 3px; }
  .rail-toggle {
    align-self: flex-end; width: 34px; height: 34px; margin-bottom: 8px;
    display: grid; place-items: center; border: none; border-radius: 9px;
    background: rgba(255,255,255,0.7); color: var(--brand); font-size: 15px;
    cursor: pointer; flex: none;
    transition: background .16s, transform .24s;
  }
  .rail-toggle:hover { background: #fff; }
  .shell[data-collapsed="true"] .rail-toggle { transform: rotate(180deg); align-self: center; }

  .brand { font-family: var(--slab); font-weight: 700; font-size: 23px; padding: 0 8px 4px; color: var(--brand); white-space: nowrap; }
  .brand small { display: block; font-weight: 500; font-size: 11px; color: var(--mute); letter-spacing: .1em; margin-top: 2px; }
  .brand-mark { display: none; font-family: var(--slab); font-weight: 700; font-size: 20px; color: var(--brand); text-align: center; padding: 4px 0 6px; }

  .nav-label { font-size: 11px; letter-spacing: .15em; color: var(--mute); padding: 20px 10px 6px; white-space: nowrap; }
  .nav a {
    display: flex; align-items: center; gap: 12px; padding: 10px 12px;
    color: var(--ink-2); text-decoration: none; font-size: 14.5px; border-radius: 9px;
    white-space: nowrap;
    transition: background .16s, color .16s;
  }
  .nav a .ico { flex: none; width: 20px; text-align: center; font-size: 15px; }
  .nav a:hover { background: rgba(255,255,255,.85); color: var(--brand); }
  .nav a[aria-current="page"] { background: #fff; color: var(--brand); font-weight: 600; box-shadow: 0 2px 8px rgba(13,110,110,0.10); }
  .nav a[aria-current="page"] .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--stamp); margin-left: auto; }

  .side-foot {
    margin-top: auto; padding: 14px 8px 4px; border-top: 1px dashed #B9DEDC;
    font-size: 13px; color: var(--ink-2); display: flex; align-items: center; gap: 9px; white-space: nowrap;
  }
  .side-foot .avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--brand-soft); color: #fff; display: grid; place-items: center; font-size: 11px; font-weight: 600; flex: none; }
  .side-foot .side-exit {
    margin-left: auto; width: 26px; height: 26px; border: none; border-radius: 8px; flex: none;
    background: rgba(255,255,255,0.7); color: var(--mute); font-size: 13px; line-height: 1;
    cursor: pointer; transition: background .16s, color .16s;
  }
  .side-foot .side-exit:hover { background: #fff; color: #C4643B; }
  .shell[data-collapsed="true"] .side-foot .side-exit { margin-left: 0; }

  .shell[data-collapsed="true"] .nav a { justify-content: center; padding: 11px 0; }
  .shell[data-collapsed="true"] .nav a .txt,
  .shell[data-collapsed="true"] .brand,
  .shell[data-collapsed="true"] .side-foot .who { display: none; }
  .shell[data-collapsed="true"] .brand-mark { display: block; }
  .shell[data-collapsed="true"] .nav-label { padding: 0; margin: 14px 12px 6px; height: 0; border-top: 1px solid #C9E8E6; font-size: 0; overflow: hidden; }
  .shell[data-collapsed="true"] .side-foot { justify-content: center; padding: 14px 0 4px; }

  /* ===== 主区 ===== */
  main { padding: 36px 44px 60px; max-width: 1760px; width: 100%; margin: 0 auto; }

  .crumb { font-size: 13px; color: var(--mute); display: flex; gap: 7px; align-items: center; }
  .crumb a { color: var(--mute); text-decoration: none; }
  .crumb a:hover { color: var(--brand); }
  .crumb b { color: var(--brand); font-weight: 600; }

  .page-head { margin-top: 14px; display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; flex-wrap: wrap; }
  h1 { font-family: var(--slab); font-weight: 600; font-size: 34px; line-height: 1.15; color: var(--brand); }
  h1 .en {
    display: block; font-size: 12px; font-family: var(--grot); font-weight: 500;
    letter-spacing: .24em; color: var(--mute); text-transform: uppercase; margin-top: 8px;
  }
  .meta { font-size: 14px; color: var(--mute); margin-top: 10px; }
  .meta b { color: var(--brand); font-weight: 600; }

  /* ===== 总览条 ===== */
  .overview {
    margin-top: 24px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px;
  }
  .ov {
    background: #fff; border-radius: var(--r-card, 14px); box-shadow: var(--card-shadow);
    padding: 18px 22px; display: flex; align-items: center; gap: 16px;
  }
  .ov .v { font-family: var(--grot); font-weight: 600; font-size: 24px; color: var(--ink); line-height: 1.2; }
  .ov .k { font-size: 12px; color: var(--mute); margin-top: 2px; }
  .ov .ring { position: relative; width: 64px; height: 64px; flex: none; }
  .ov .ring svg { transform: rotate(-90deg); display: block; }
  .ov .ring .num { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--grot); font-weight: 600; font-size: 13px; color: var(--brand); }
  .ov .ic { flex: none; width: 46px; height: 46px; border-radius: 13px; display: grid; place-items: center; font-size: 20px; background: #FDF5E2; color: #B8830F; }
  .ov .ic.teal { background: var(--mist); color: var(--brand); }
  .ov .ic.coral { background: var(--stamp-bg); color: var(--stamp-deep); }

  /* ===== 新建条 ===== */
  .new-row {
    margin-top: 22px; background: #fff; border-radius: 13px; box-shadow: var(--card-shadow);
    padding: 12px 16px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
  }
  .new-row select, .new-row input[type="text"] {
    font-family: var(--grot); font-size: 13.5px; color: var(--ink);
    background: var(--cloud); border: 1.5px solid var(--line); border-radius: 10px;
    padding: 10px 13px; outline: none; transition: border-color .16s, box-shadow .16s;
  }
  .new-row input[type="text"] { flex: 1; min-width: 200px; }
  .new-row select { cursor: pointer; }
  .new-row select:focus, .new-row input:focus { border-color: var(--brand-soft); background: #fff; box-shadow: 0 0 0 3px rgba(91,197,192,.16); }
  .new-row input::placeholder { color: var(--mute); }
  .btn-new {
    font-family: var(--grot); font-weight: 600; font-size: 13.5px; color: #fff;
    background: var(--stamp); border: none; border-radius: 10px; padding: 10px 20px;
    cursor: pointer; box-shadow: 0 4px 12px rgba(255,138,76,.28); transition: transform .14s;
  }
  .btn-new:hover { transform: translateY(-1px); }
  .btn-new:disabled { opacity: .55; cursor: not-allowed; transform: none; }

  /* ===== 清单卡（票根 + 主区） ===== */
  .boards { margin-top: 22px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; align-items: start; }

  .list-card {
    background: #fff; border-radius: 16px; box-shadow: var(--card-shadow);
    display: grid; grid-template-columns: 104px 1fr; overflow: hidden;
    position: relative;
  }

  /* 左票根 */
  .l-stub {
    background: linear-gradient(180deg, var(--lc-soft) 0%, #fff 130%);
    border-right: 2px dashed var(--lc-line, #C9E8E6); position: relative;
    padding: 18px 10px 14px; text-align: center;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
  }
  .l-stub .cat-ic {
    width: 40px; height: 40px; border-radius: 12px; background: var(--lc);
    color: #fff; display: grid; place-items: center; font-size: 18px;
  }
  .l-stub .cat-nm { font-size: 11px; font-weight: 600; color: var(--lc); letter-spacing: .1em; margin-top: 4px; }
  .l-stub .ring { margin-top: 8px; position: relative; width: 56px; height: 56px; }
  .l-stub .ring svg { transform: rotate(-90deg); display: block; }
  .l-stub .ring .num { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--grot); font-weight: 600; font-size: 12px; color: var(--ink-2); }
  .l-stub .rk { font-size: 10px; color: var(--mute); letter-spacing: .1em; }
  .ready-stamp {
    position: absolute; right: 6px; bottom: 10px; transform: rotate(-12deg);
    font-family: var(--slab); font-weight: 700; font-size: 13px; letter-spacing: .12em;
    color: #2A8055; border: 2.5px solid #2A8055; border-radius: 8px;
    padding: 3px 9px; background: rgba(255,255,255,.75);
    animation: stampIn .4s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes stampIn { from { transform: rotate(-12deg) scale(1.8); opacity: 0; } to { transform: rotate(-12deg) scale(1); opacity: 1; } }

  /* 右主区 */
  .l-main { padding: 16px 20px 18px; min-width: 0; }
  .l-head { display: flex; align-items: center; gap: 10px; }
  .l-title {
    font-family: var(--slab); font-weight: 600; font-size: 17px; color: var(--ink);
    border: none; border-bottom: 1.5px dashed transparent; background: none;
    padding: 0 2px 2px; min-width: 80px; max-width: 55%; outline: none;
    transition: border-color .16s;
  }
  .l-title::placeholder { color: var(--mute); }
  .l-title:hover { border-bottom-color: #C9E8E6; }
  .l-title:focus { border-bottom-color: var(--lc); }
  .l-cnt { margin-left: auto; font-size: 12px; color: var(--mute); white-space: nowrap; }
  .l-bar { margin-top: 10px; height: 7px; border-radius: 999px; background: #EDF5F4; overflow: hidden; }
  .l-bar i { display: block; height: 100%; background: var(--lc); border-radius: 999px; transition: width .4s cubic-bezier(.4,0,.2,1); }

  .items { margin-top: 12px; }
  .it-row {
    display: flex; align-items: center; gap: 10px; padding: 7px 4px;
    border-bottom: 1px dashed #EAF3F2; border-radius: 8px;
    transition: background .14s;
  }
  .it-row:hover { background: #F7FBFA; }
  .it-row:last-child { border-bottom: none; }
  .chk {
    flex: none; width: 20px; height: 20px; border-radius: 6px;
    border: 1.5px solid #C7DBDA; background: #fff; cursor: pointer;
    display: grid; place-items: center; color: #fff; font-size: 11px;
    transition: all .16s;
  }
  .chk:hover { border-color: var(--lc); }
  .chk.on { background: var(--lc); border-color: var(--lc); }
  .chk.on::after { content: "✓"; font-weight: 700; }
  .it-nm { font-size: 13.5px; font-weight: 500; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .it-row.done .it-nm { text-decoration: line-through; color: var(--mute); font-weight: 400; }
  .it-row.done .qty { opacity: .5; }
  .qty { font-size: 11.5px; color: var(--lc); font-weight: 600; background: color-mix(in srgb, var(--lc) 10%, white); border-radius: 6px; padding: 1px 7px; flex: none; }
  .it-notes { font-size: 11px; color: var(--mute); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .it-ops { margin-left: auto; display: flex; gap: 2px; opacity: 0; transition: opacity .16s; flex: none; }
  .it-row:hover .it-ops { opacity: 1; }
  .it-ops button {
    width: 24px; height: 24px; border: none; border-radius: 7px; background: none;
    color: var(--mute); font-size: 12px; cursor: pointer;
  }
  .it-ops button:hover { background: #fff; color: var(--brand); }
  .it-ops button.del:hover { color: #D2543A; background: #FFF3F0; }

  .add-item {
    margin-top: 10px; display: flex; gap: 8px;
  }
  .add-item input[type="text"] {
    flex: 1; min-width: 0; font-family: var(--grot); font-size: 13px; color: var(--ink);
    background: var(--cloud); border: 1.5px solid var(--line); border-radius: 9px;
    padding: 8px 12px; outline: none;
  }
  .add-item input:focus { border-color: var(--lc); background: #fff; }
  .add-item input::placeholder { color: var(--mute); }
  .add-item input.q { flex: none; width: 54px; text-align: center; }
  .add-item button {
    flex: none; font-family: var(--grot); font-weight: 600; font-size: 12.5px; color: var(--lc);
    background: color-mix(in srgb, var(--lc) 12%, white); border: none; border-radius: 9px;
    padding: 0 14px; cursor: pointer; transition: filter .14s;
  }
  .add-item button:hover { filter: brightness(.96); }

  .l-ops { display: flex; gap: 6px; margin-top: 12px; padding-top: 12px; border-top: 1.5px dashed #EAF3F2; }
  .l-ops button {
    font-family: var(--grot); font-size: 12px; color: var(--mute);
    background: none; border: none; padding: 4px 10px; border-radius: 7px; cursor: pointer;
    transition: background .14s, color .14s;
  }
  .l-ops button:hover { background: var(--cloud); color: var(--brand); }
  .l-ops button.del:hover { color: #D2543A; background: #FFF3F0; }

  /* 空态 */
  .empty-state {
    margin-top: 22px; background: #fff; border-radius: 16px; box-shadow: var(--card-shadow);
    padding: 54px 30px; text-align: center;
  }
  .empty-state .ic { font-size: 38px; margin-bottom: 10px; }
  .empty-state .t { font-family: var(--slab); font-weight: 600; font-size: 18px; color: var(--ink); }
  .empty-state .d { font-size: 13px; color: var(--mute); margin-top: 6px; }
  .empty-state .d b { color: var(--stamp); font-weight: 500; }

  /* 提示卡 */
  .tip-card {
    margin-top: 22px; display: flex; align-items: center; gap: 14px;
    background: linear-gradient(120deg, #FFF4EC, #FDE7D8);
    border: 1.5px solid #F8D3C2; border-radius: 14px; padding: 16px 22px;
  }
  .tip-card .ic { font-size: 24px; flex: none; }
  .tip-card .tx { font-size: 13px; color: var(--stamp-deep); line-height: 1.6; }
  .tip-card .tx b { font-weight: 700; }

  /* ===== Toast ===== */
  .toast {
    position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%) translateY(16px);
    background: var(--ink); color: #fff; font-size: 13.5px;
    padding: 11px 20px; border-radius: 999px; opacity: 0; pointer-events: none;
    transition: opacity .22s, transform .22s; z-index: 99;
    box-shadow: 0 12px 32px rgba(18,58,60,.30); max-width: 76vw;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ===== 响应式 ===== */
  @media (max-width: 1100px) { .boards { grid-template-columns: 1fr; } }
  @media (max-width: 980px) { main { padding: 28px 24px 50px; } .overview { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 720px) {
    .shell { grid-template-columns: 1fr !important; }
    .side { position: static; height: auto; flex-direction: row; flex-wrap: wrap; align-items: center; padding: 12px 16px; border-right: none; border-bottom: 1px solid #C9E8E6; }
    .side .nav { flex: none; overflow: visible; }
    .rail-toggle { display: none; }
    .brand { display: block !important; padding: 0; }
    .brand-mark { display: none !important; }
    .nav-label { display: none; }
    .nav { display: flex; gap: 4px; flex-wrap: wrap; }
    .nav a { padding: 8px 10px; }
    .nav a .txt { display: inline !important; }
    .side-foot { margin-top: 0; margin-left: auto; border: none; padding: 0; }
    .side-foot .who { display: inline !important; }
    main { padding: 22px 16px 50px; }
    h1 { font-size: 27px; }
    .overview { grid-template-columns: 1fr; }
    .list-card { grid-template-columns: 84px 1fr; }
    .l-title { max-width: 100%; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div class="shell">

  <aside class="side">
    <button class="rail-toggle" id="railToggle" aria-label="折叠侧边栏" aria-expanded="true" aria-controls="sideNav" title="折叠 / 展开">&#8249;</button>
    <div class="brand">Travel OS<small>行程驾驶舱</small></div>
    <div class="brand-mark" aria-hidden="true">T</div>
    <nav class="nav" id="sideNav" aria-label="主导航">
      <div class="nav-label">总览</div>
      <a href="/home/"><span class="ico" aria-hidden="true">&#8962;</span><span class="txt">首页</span></a>
      <a href="/trips/"><span class="ico" aria-hidden="true">&#9992;</span><span class="txt">我的旅行</span></a>
      <a href="/square/"><span class="ico" aria-hidden="true">&#127758;</span><span class="txt">攻略广场</span></a>
      <a href="/friends/"><span class="ico" aria-hidden="true">&#128101;</span><span class="txt">好友</span></a>
      <div class="nav-label">洞察</div>
      <a href="/stats/"><span class="ico" aria-hidden="true">&#9638;</span><span class="txt">旅行统计</span></a>
      <a href="/notifications/"><span class="ico" aria-hidden="true">&#9719;</span><span class="txt">通知中心</span></a>
      <div class="nav-label">行程</div>
      <a href="/map/"><span class="ico" aria-hidden="true">&#9673;</span><span class="txt">地图</span></a>
      <a href="/account/"><span class="ico" aria-hidden="true">&#9684;</span><span class="txt">账户</span></a>
      <a href="/admin/"><span class="ico" aria-hidden="true">&#9881;</span><span class="txt">管理后台</span></a>
    </nav>
    <div class="side-foot">
      <span class="avatar" id="avatar">A</span>
      <span class="who" id="who">…</span>
<button type="button" class="side-exit" id="sideLogout" title="退出登录" aria-label="退出登录">&#9211;</button>
    </div>
  </aside>

  <main>
    <p class="crumb"><a href="/trips/">我的旅行</a><span>/</span><a href="#" id="crumbTrip">行程详情</a><span>/</span><b>打包清单</b></p>
    <div class="page-head">
      <div>
        <h1>打包清单<span class="en">Packing Lists</span></h1>
        <p class="meta" id="pageMeta">正在加载…</p>
      </div>
    </div>

    <!-- 总览 -->
    <section class="overview" id="overview" hidden>
      <div class="ov">
        <span class="ic teal">🧳</span>
        <div><div class="v" id="ovLists">0</div><div class="k">张清单</div></div>
      </div>
      <div class="ov">
        <div class="ring" id="ovRing"></div>
        <div><div class="v" id="ovItems">0 / 0</div><div class="k">物品已打包</div></div>
      </div>
      <div class="ov">
        <span class="ic coral" id="ovCdIc">⏱</span>
        <div><div class="v" id="ovCd">–</div><div class="k" id="ovCdK">距出发</div></div>
      </div>
    </section>

    <!-- 新建清单 -->
    <div class="new-row" id="newRow">
      <select id="newCat" aria-label="清单类别"></select>
      <input type="text" id="newName" maxlength="100" placeholder="给清单起个名字，如：贴身衣物（选填，默认用类别名）">
      <button type="button" class="btn-new" id="btnNewList">＋ 新建清单</button>
    </div>

    <!-- 清单区 -->
    <section class="boards" id="boards" aria-label="打包清单列表">
      <p style="grid-column:1/-1;padding:40px 0;text-align:center;color:var(--mute);" id="loading">正在加载清单…</p>
    </section>
  </main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="../assets/js/api.js"></script><script>try{if(((window.getCurrentUser?getCurrentUser():null)||{}).role!=="super_admin"){document.documentElement.setAttribute("data-hide-admin","1")}}catch(e){}</script>
<script src="../assets/js/pet.js"></script>
<script>
  (function () {
    if (!requireLogin('/login/')) return;

    var qs = new URLSearchParams(location.search);
    var tripId = qs.get('trip') || qs.get('id');
    if (!tripId) { location.replace('/trips/'); return; }

    /* ===== 壳：用户 + 侧栏 ===== */
    var user = getCurrentUser() || {};
    document.getElementById('who').textContent = user.displayName || user.username || '旅行者';
    document.getElementById('avatar').textContent = (user.displayName || user.username || 'A').charAt(0).toUpperCase();

    var shell = document.querySelector('.shell');
    var btn = document.getElementById('railToggle');
    var KEY = 'travel-os-rail-collapsed';
    function applyRail(collapsed) {
      shell.setAttribute('data-collapsed', collapsed ? 'true' : 'false');
      btn.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
      btn.setAttribute('aria-label', collapsed ? '展开侧边栏' : '折叠侧边栏');
      document.querySelectorAll('.nav a').forEach(function (a) {
        var t = a.querySelector('.txt');
        if (!t) return;
        if (collapsed) a.setAttribute('title', t.textContent); else a.removeAttribute('title');
      });
    }
    var saved = null;
    try { saved = localStorage.getItem(KEY); } catch (e) {}
    applyRail(saved === 'true');
    btn.addEventListener('click', function () {
      var next = shell.getAttribute('data-collapsed') !== 'true';
      applyRail(next);
      try { localStorage.setItem(KEY, next ? 'true' : 'false'); } catch (e) {}
    });

    /* ===== Toast ===== */
    var toast = document.getElementById('toast');
    var toastTimer = null;
    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { toast.classList.remove('show'); }, 2400);
    }

    /* ===== 常量 ===== */
    var CATS = [
      { value: 'clothing',    label: '衣物', ic: '👕', c: '#3D8B64' },
      { value: 'toiletries',  label: '洗漱', ic: '🧴', c: '#2A8055' },
      { value: 'electronics', label: '电子', ic: '🔌', c: '#6B4FC0' },
      { value: 'medicine',    label: '药品', ic: '💊', c: '#C2566C' },
      { value: 'documents',   label: '证件', ic: '🛂', c: '#B8830F' },
      { value: 'other',       label: '其他', ic: '◆',  c: '#2F6FB5' }
    ];
    function catOf(v) {
      for (var i = 0; i < CATS.length; i++) if (CATS[i].value === v) return CATS[i];
      return CATS[5];
    }
    var $ = function (id) { return document.getElementById(id); };
    var state = { trip: null, lists: [] };

    /* ===== 工具 ===== */
    function escapeHtml(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
    function hexSoft(hex) {
      /* 主色 12% 混白 → 票根浅底 */
      var n = parseInt(hex.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255;
      function mix(ch) { return Math.round(ch * 0.14 + 255 * 0.86); }
      return 'rgb(' + mix(r) + ',' + mix(g) + ',' + mix(b) + ')';
    }
    function hexLine(hex) {
      var n = parseInt(hex.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255;
      function mix(ch) { return Math.round(ch * 0.3 + 255 * 0.7); }
      return 'rgb(' + mix(r) + ',' + mix(g) + ',' + mix(b) + ')';
    }
    function ringSvg(size, stroke, pct, color) {
      var r = (size - stroke) / 2, c = 2 * Math.PI * r;
      var v = Math.max(0, Math.min(100, pct)) / 100 * c;
      return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '">'
        + '<circle cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '" fill="none" stroke="#DCEEEC" stroke-width="' + stroke + '"/>'
        + '<circle cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '" fill="none" stroke="' + color + '" stroke-width="' + stroke + '" stroke-linecap="round" stroke-dasharray="' + v.toFixed(1) + ' ' + c.toFixed(1) + '"/>'
        + '</svg>';
    }

    /* ===== 加载 ===== */
    async function load() {
      try {
        var results = await Promise.allSettled([
          apiGet('/trips/' + tripId),
          apiGet('/trips/' + tripId + '/packing-lists')
        ]);
        if (results[0].status === 'fulfilled') state.trip = results[0].value.trip || null;
        state.lists = results[1].status === 'fulfilled' ? (results[1].value.packingLists || []) : [];

        document.getElementById('crumbTrip').textContent = state.trip ? (state.trip.title || '行程详情') : '行程详情';
        document.getElementById('crumbTrip').href = '/trip-detail/?id=' + encodeURIComponent(tripId);
        document.title = 'Travel OS · ' + ((state.trip && state.trip.title) || '') + ' · 打包清单';
        render();
      } catch (err) {
        showToast(humanError(err));
        document.getElementById('loading').textContent = '加载失败，请刷新重试';
      }
    }

    /* ===== 总览 ===== */
    function renderOverview() {
      var lists = state.lists;
      var items = 0, packed = 0;
      lists.forEach(function (l) { items += l.itemCount || 0; packed += l.packedCount || 0; });
      $('overview').hidden = false;
      $('ovLists').textContent = lists.length;
      $('ovItems').textContent = packed + ' / ' + items;
      var pct = items ? Math.round(packed / items * 100) : 0;
      $('ovRing').innerHTML = ringSvg(64, 7, pct, 'var(--brand)') + '<span class="num">' + pct + '%</span>';

      /* 倒计时 */
      if (state.trip && state.trip.startDate) {
        var start = new Date(state.trip.startDate);
        var days = Math.ceil((start - new Date()) / 86400000);
        if (days > 0) { $('ovCd').textContent = days + ' 天'; $('ovCdK').textContent = '距出发 · ' + (start.getMonth() + 1) + '月' + start.getDate() + '日'; }
        else if (days === 0) { $('ovCd').textContent = '今天'; $('ovCdK').textContent = '出发日'; }
        else { $('ovCd').textContent = '已在路上'; $('ovCdK').textContent = (start.getMonth() + 1) + '月' + start.getDate() + '日出发'; }
      } else {
        $('ovCd').textContent = '–'; $('ovCdK').textContent = '日期待定';
      }

      var meta = $('pageMeta');
      meta.innerHTML = lists.length
        ? '<b>' + escapeHtml((state.trip && state.trip.title) || '') + '</b> · ' + lists.length + ' 张清单 · ' + packed + '/' + items + ' 已打包'
        : '<b>' + escapeHtml((state.trip && state.trip.title) || '') + '</b>';
    }

    /* ===== 渲染清单卡 ===== */
    function listCardHtml(l) {
      var c = catOf(l.category);
      var total = l.itemCount || 0, packed = l.packedCount || 0;
      var pct = total ? Math.round(packed / total * 100) : 0;
      var soft = hexSoft(c.c), line = hexLine(c.c);

      var rows = (l.items || []).map(function (it) {
        return ''
          + '<div class="it-row' + (it.isPacked ? ' done' : '') + '" data-item="' + escapeHtml(it.id) + '">'
          +   '<button type="button" class="chk' + (it.isPacked ? ' on' : '') + '" aria-pressed="' + (it.isPacked ? 'true' : 'false') + '" title="标记' + (it.isPacked ? '未打包' : '已打包') + '"></button>'
          +   '<span class="it-nm">' + escapeHtml(it.name) + '</span>'
          +   (it.quantity && it.quantity > 1 ? '<span class="qty">×' + it.quantity + '</span>' : '')
          +   (it.notes ? '<span class="it-notes">' + escapeHtml(it.notes) + '</span>' : '<span class="it-notes"></span>')
          +   '<span class="it-ops">'
          +     '<button type="button" class="del" title="删除">×</button>'
          +   '</span>'
          + '</div>';
      }).join('');

      return ''
        + '<article class="list-card" data-list="' + escapeHtml(l.id) + '" style="--lc:' + c.c + ';--lc-soft:' + soft + ';--lc-line:' + line + ';">'
        +   '<div class="l-stub">'
        +     '<span class="cat-ic">' + c.ic + '</span>'
        +     '<span class="cat-nm">' + c.label + '</span>'
        +     '<div class="ring">' + ringSvg(56, 6, pct, c.c) + '<span class="num">' + pct + '%</span></div>'
        +     '<span class="rk">' + packed + ' / ' + total + '</span>'
        +     (total > 0 && pct === 100 ? '<span class="ready-stamp">READY</span>' : '')
        +   '</div>'
        +   '<div class="l-main">'
        +     '<div class="l-head">'
        +       '<input type="text" class="l-title" data-ltitle="' + escapeHtml(l.id) + '" value="' + escapeHtml(l.name || '') + '" placeholder="清单名称" maxlength="100">'
        +       '<span class="l-cnt">' + total + ' 件物品 · ' + packed + ' 已打包</span>'
        +     '</div>'
        +     '<div class="l-bar"><i style="width:' + pct + '%"></i></div>'
        +     '<div class="items">' + (rows || '<div style="padding:14px 0;text-align:center;font-size:12.5px;color:var(--mute);">清单还是空的 · 在下方添加第一件物品</div>') + '</div>'
        +     '<div class="add-item">'
        +       '<input type="text" placeholder="添加物品…" aria-label="物品名称">'
        +       '<input type="text" class="q" placeholder="×1" aria-label="数量" inputmode="numeric">'
        +       '<button type="button">添加</button>'
        +     '</div>'
        +     '<div class="l-ops">'
        +       '<button type="button" class="dup">⧉ 复制清单</button>'
        +       '<button type="button" class="del">🗑 删除清单</button>'
        +     '</div>'
        +   '</div>'
        + '</article>';
    }

    function render() {
      renderOverview();
      var boards = $('boards');
      if (!state.lists.length) {
        boards.innerHTML = ''
          + '<div class="empty-state" style="grid-column:1/-1;">'
          +   '<div class="ic">🧳</div>'
          +   '<div class="t">还没有打包清单</div>'
          +   '<div class="d">在上方选一个类别新建——<b>衣物 / 洗漱 / 电子 / 药品 / 证件</b> 会自动带入常用物品模板</div>'
          + '</div>';
        return;
      }
      boards.innerHTML = state.lists.map(listCardHtml).join('');
    }

    /* ===== 新建清单（后端自动填模板物品） ===== */
    $('newCat').innerHTML = CATS.map(function (c) {
      return '<option value="' + c.value + '">' + c.ic + ' ' + c.label + '</option>';
    }).join('');

    $('btnNewList').addEventListener('click', async function () {
      var b = $('btnNewList');
      var cat = $('newCat').value;
      var name = $('newName').value.trim() || catOf(cat).label;
      b.disabled = true;
      try {
        var data = await apiPost('/trips/' + tripId + '/packing-lists', { category: cat, name: name });
        var nl = data && (data.packingList || data.list);
        if (nl) state.lists.push(nl); else await load();
        $('newName').value = '';
        render();
        showToast('已创建「' + name + '」，模板物品已就位');
      } catch (err) { showToast(humanError(err)); }
      b.disabled = false;
    });
    $('newName').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('btnNewList').click(); });

    /* ===== 卡片交互 ===== */
    $('boards').addEventListener('click', async function (e) {
      var card = e.target.closest('.list-card');
      if (!card) return;
      var listId = card.getAttribute('data-list');
      var list = state.lists.find(function (x) { return x.id === listId; });
      if (!list) return;

      /* 物品勾选 */
      var chk = e.target.closest('.chk');
      if (chk) {
        var row = chk.closest('.it-row');
        var itemId = row.getAttribute('data-item');
        var it = (list.items || []).find(function (x) { return x.id === itemId; });
        var next = !(it && it.isPacked);
        try {
          await apiPatch('/trips/' + tripId + '/packing-lists/' + listId + '/items/' + itemId, { isPacked: next });
          if (it) it.isPacked = next;
          list.packedCount = (list.items || []).filter(function (x) { return x.isPacked; }).length;
          render();
        } catch (err) { showToast(humanError(err)); }
        return;
      }

      /* 物品删除 */
      var delBtn = e.target.closest('.it-ops .del');
      if (delBtn) {
        var row2 = delBtn.closest('.it-row');
        var itemId2 = row2.getAttribute('data-item');
        var it2 = (list.items || []).find(function (x) { return x.id === itemId2; });
        if (!confirm('删除物品「' + ((it2 && it2.name) || '') + '」？')) return;
        try {
          await apiDelete('/trips/' + tripId + '/packing-lists/' + listId + '/items/' + itemId2);
          list.items = (list.items || []).filter(function (x) { return x.id !== itemId2; });
          list.itemCount = list.items.length;
          list.packedCount = list.items.filter(function (x) { return x.isPacked; }).length;
          render();
          showToast('已删除');
        } catch (err) { showToast(humanError(err)); }
        return;
      }

      /* 物品添加 */
      if (e.target.closest('.add-item button')) {
        var addBox = e.target.closest('.add-item');
        var nmInput = addBox.querySelector('input[type="text"]');
        var qInput = addBox.querySelector('.q');
        var name = nmInput.value.trim();
        if (!name) { nmInput.focus(); showToast('请先输入物品名称'); return; }
        var body = { name: name };
        var q = parseInt(qInput.value, 10);
        if (q > 0) body.quantity = q;
        body.orderIndex = (list.items || []).length;
        try {
          var data2 = await apiPost('/trips/' + tripId + '/packing-lists/' + listId + '/items', body);
          var ni = data2 && (data2.item || data2.packingItem);
          if (ni) { (list.items = list.items || []).push(ni); list.itemCount = list.items.length; }
          else await load();
          render();
          showToast('已添加「' + name + '」');
        } catch (err) { showToast(humanError(err)); }
        return;
      }

      /* 复制清单 */
      if (e.target.closest('.l-ops .dup')) {
        try {
          await apiPost('/trips/' + tripId + '/packing-lists/' + listId + '/duplicate', {});
          await load();
          showToast('清单已复制');
        } catch (err) { showToast(humanError(err)); }
        return;
      }

      /* 删除清单 */
      if (e.target.closest('.l-ops .del')) {
        if (!confirm('删除清单「' + (list.name || '') + '」及其全部物品？')) return;
        try {
          await apiDelete('/trips/' + tripId + '/packing-lists/' + listId);
          state.lists = state.lists.filter(function (x) { return x.id !== listId; });
          render();
          showToast('清单已删除');
        } catch (err) { showToast(humanError(err)); }
      }
    });

    /* ===== 清单改名（Enter / change） ===== */
    $('boards').addEventListener('change', async function (e) {
      var inp = e.target.closest('[data-ltitle]');
      if (!inp) return;
      var listId = inp.getAttribute('data-ltitle');
      var list = state.lists.find(function (x) { return x.id === listId; });
      if (!list) return;
      var v = inp.value.trim();
      if (!v) { inp.value = list.name || ''; return; }
      if ((list.name || '') === v) return;
      try {
        await apiPatch('/trips/' + tripId + '/packing-lists/' + listId, { name: v });
        list.name = v;
        showToast('已重命名');
      } catch (err) { showToast(humanError(err)); }
    });
    $('boards').addEventListener('keydown', function (e) {
      var inp = e.target.closest('[data-ltitle]');
      if (inp && e.key === 'Enter') inp.blur();
    });

    /* ===== 启动 ===== */
    load();
  })();
</script>
</body>
</html>
