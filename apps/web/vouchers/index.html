<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Travel OS · 凭证速查</title>
<link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Space+Grotesk:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/theme.css">
<link rel="stylesheet" href="../assets/css/pet.css">
<style>
  /* ===== 骨架 ===== */
  .shell {
    display: grid;
    grid-template-columns: var(--rail-w, 232px) 1fr;
    min-height: 100vh;
    transition: grid-template-columns 0.24s cubic-bezier(0.4,0,0.2,1);
  }
  .shell[data-collapsed="true"] { --rail-w: 76px; }
  .side {
    position: sticky; top: 0; height: 100vh; /* 吸附视口：内容再长，用户信息/退出也不随页面滚走 */
    background: linear-gradient(180deg, var(--side-a) 0%, #DCF2F0 100%);
    padding: 18px 14px 20px;
    display: flex; flex-direction: column; gap: 6px;
    border-right: 1px solid var(--line-2); overflow: hidden;
  }
  /* 导航过长时内部滚动，品牌区与底部用户区保持固定可见 */
  .side .nav { flex: 1 1 auto; min-height: 0; overflow-y: auto; scrollbar-width: thin; }
  .side .nav::-webkit-scrollbar { width: 5px; }
  .side .nav::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 3px; }
  .rail-toggle {
    align-self: flex-end; width: 34px; height: 34px; margin-bottom: 8px;
    display: grid; place-items: center; border: none; border-radius: 9px;
    background: rgba(255,255,255,0.7); color: var(--brand); font-size: 15px;
    cursor: pointer; flex: none;
    transition: background .16s, transform .24s;
  }
  .rail-toggle:hover { background: #fff; }
  .shell[data-collapsed="true"] .rail-toggle { transform: rotate(180deg); align-self: center; }
  .brand { font-family: var(--slab); font-weight: 700; font-size: 23px; padding: 0 8px 4px; color: var(--brand); white-space: nowrap; }
  .brand small { display: block; font-weight: 500; font-size: 11px; color: var(--mute); letter-spacing: .1em; margin-top: 2px; }
  .brand-mark { display: none; font-family: var(--slab); font-weight: 700; font-size: 20px; color: var(--brand); text-align: center; padding: 4px 0 6px; }
  .nav-label { font-size: 11px; letter-spacing: .15em; color: var(--mute); padding: 20px 10px 6px; white-space: nowrap; }
  .nav a {
    display: flex; align-items: center; gap: 12px; padding: 10px 12px;
    color: var(--ink-2); text-decoration: none; font-size: 14.5px; border-radius: 9px;
    white-space: nowrap; transition: background .16s, color .16s;
  }
  .nav a .ico { flex: none; width: 20px; text-align: center; font-size: 15px; }
  .nav a:hover { background: rgba(255,255,255,.85); color: var(--brand); }
  .nav a[aria-current="page"] { background: #fff; color: var(--brand); font-weight: 600; box-shadow: 0 2px 8px rgba(13,110,110,0.10); }
  .nav a[aria-current="page"] .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--stamp); margin-left: auto; }
  .side-foot {
    margin-top: auto; padding: 14px 8px 4px; border-top: 1px dashed var(--line-3);
    font-size: 13px; color: var(--ink-2); display: flex; align-items: center; gap: 9px; white-space: nowrap;
  }
  .side-foot .avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--brand-soft); color: #fff; display: grid; place-items: center; font-size: 11px; font-weight: 600; flex: none; }
  .side-foot .side-exit {
    margin-left: auto; width: 26px; height: 26px; border: none; border-radius: 8px; flex: none;
    background: rgba(255,255,255,0.7); color: var(--mute); font-size: 13px; line-height: 1;
    cursor: pointer; transition: background .16s, color .16s;
  }
  .side-foot .side-exit:hover { background: #fff; color: var(--danger-deep); }
  .shell[data-collapsed="true"] .side-foot .side-exit { margin-left: 0; }
  .shell[data-collapsed="true"] .nav a { justify-content: center; padding: 11px 0; }
  .shell[data-collapsed="true"] .nav a .txt,
  .shell[data-collapsed="true"] .brand,
  .shell[data-collapsed="true"] .side-foot .who { display: none; }
  .shell[data-collapsed="true"] .brand-mark { display: block; }
  .shell[data-collapsed="true"] .nav-label { padding: 0; margin: 14px 12px 6px; height: 0; border-top: 1px solid var(--line-2); font-size: 0; overflow: hidden; }
  .shell[data-collapsed="true"] .side-foot { justify-content: center; padding: 14px 0 4px; }

  /* ===== 主区 ===== */
  main { padding: 36px 44px 60px; max-width: 1760px; width: 100%; margin: 0 auto; }
  .crumb { font-size: 13px; color: var(--mute); display: flex; gap: 7px; align-items: center; flex-wrap: wrap; }
  .crumb a { color: var(--mute); text-decoration: none; }
  .crumb a:hover { color: var(--brand); }
  .crumb b { color: var(--brand); font-weight: 600; }
  .page-head { margin-top: 14px; display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; flex-wrap: wrap; }
  h1 { font-family: var(--slab); font-weight: 600; font-size: 34px; line-height: 1.15; color: var(--brand); }
  h1 .en { display: block; font-size: 12px; font-family: var(--grot); font-weight: 500; letter-spacing: .24em; color: var(--mute); text-transform: uppercase; margin-top: 8px; }
  .meta { font-size: 14px; color: var(--mute); margin-top: 10px; }
  .meta b { color: var(--brand); font-weight: 600; }
  .head-actions { display: flex; gap: 10px; flex-wrap: wrap; }
  .btn-ghost {
    font-family: var(--grot); font-size: 13.5px; color: var(--ink-2);
    background: #fff; border: 1.5px solid var(--line); border-radius: 10px;
    padding: 12px 20px; cursor: pointer; box-shadow: var(--card-shadow);
    transition: all .15s;
  }
  .btn-ghost:hover { border-color: var(--brand-soft); color: var(--brand); transform: translateY(-1px); }

  /* ===== banner + 总览 ===== */
  .banner {
    margin-top: 22px; display: flex; align-items: center; gap: 14px;
    background: linear-gradient(120deg, #E9F7F6, #D6EFF7);
    border: 1.5px solid #C7E5EA; border-radius: 14px; padding: 16px 22px;
  }
  .banner .ic { font-size: 22px; flex: none; }
  .banner .tx { font-size: 13.5px; color: #16595C; line-height: 1.6; }
  .banner .tx b { font-weight: 700; }
  .banner.warn { background: linear-gradient(120deg, #FFF4EC, #FDE7D8); border-color: #F8D3C2; }
  .banner.warn .tx { color: var(--stamp-deep); }

  .overview { margin-top: 16px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .ov {
    background: #fff; border-radius: var(--r-card, 14px); box-shadow: var(--card-shadow);
    padding: 16px 20px; display: flex; align-items: center; gap: 14px;
  }
  .ov .ic { flex: none; width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; font-size: 18px; }
  .ov .v { font-family: var(--grot); font-weight: 600; font-size: 22px; color: var(--ink); line-height: 1.2; }
  .ov .k { font-size: 12px; color: var(--mute); margin-top: 2px; }

  /* ===== 时间轴 ===== */
  .tl { margin-top: 26px; }
  .v-row { display: grid; grid-template-columns: 96px 30px 1fr; gap: 0 14px; }
  .v-row + .v-row { margin-top: 4px; }

  .v-time { text-align: right; padding-top: 20px; }
  .v-time .d { font-family: var(--slab); font-weight: 700; font-size: 26px; color: var(--vc); line-height: 1; }
  .v-time .m { font-size: 11.5px; color: var(--mute); margin-top: 3px; letter-spacing: .06em; }
  .v-time .t { font-family: var(--grot); font-weight: 600; font-size: 12.5px; color: var(--ink); margin-top: 5px; }

  .v-axis { position: relative; display: flex; justify-content: center; }
  .v-axis::before {
    content: ""; position: absolute; top: 0; bottom: 0; width: 2px;
    background: #BFE7E4;
  }
  .v-row:first-child .v-axis::before { top: 26px; }
  .v-row:last-child .v-axis::before { bottom: auto; height: 26px; }
  .v-dot {
    position: relative; z-index: 1; margin-top: 20px;
    width: 14px; height: 14px; border-radius: 50%;
    background: #fff; border: 4px solid var(--vc);
    box-shadow: 0 0 0 3px rgba(255,255,255,.9);
  }

  /* 凭证票 */
  .v-ticket {
    background: #fff; border-radius: 15px; box-shadow: var(--card-shadow);
    display: grid; grid-template-columns: 1fr 236px; overflow: hidden;
    margin-bottom: 20px;
  }
  .v-main { padding: 18px 22px 18px; min-width: 0; }
  .v-top { display: flex; align-items: center; gap: 9px; }
  .v-ic { width: 30px; height: 30px; border-radius: 9px; background: var(--tb); color: var(--vc); display: grid; place-items: center; font-size: 14px; flex: none; }
  .v-type { font-size: 11.5px; font-weight: 600; color: var(--vc); letter-spacing: .08em; }
  .v-when { margin-left: auto; font-size: 12px; color: var(--mute); white-space: nowrap; }
  .v-title { font-family: var(--slab); font-weight: 600; font-size: 19px; color: var(--ink); margin-top: 10px; line-height: 1.35; }

  /* 现场速查信息（大字） */
  .onsite { margin-top: 14px; display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px 18px; }
  .os .k { font-size: 10px; letter-spacing: .16em; color: var(--mute); text-transform: uppercase; }
  .os .v { font-family: var(--grot); font-weight: 600; font-size: 16px; color: var(--ink); margin-top: 3px; word-break: break-word; }
  .os .v.code { font-size: 18px; letter-spacing: .04em; color: var(--vc); }
  .os .v.warn { color: #C1704A; }
  .v-note { margin-top: 12px; font-size: 12.5px; color: var(--warn-deep); background: var(--warn-bg); border-radius: 8px; padding: 8px 12px; }

  /* 票根 */
  .v-stub {
    border-left: 2px dashed color-mix(in srgb, var(--vc) 30%, white);
    background: linear-gradient(180deg, var(--tb) 0%, #fff 105%);
    padding: 16px 16px 14px; display: flex; flex-direction: column; align-items: center; gap: 10px;
  }
  .qr { background: #fff; border-radius: 10px; padding: 8px; box-shadow: 0 2px 10px rgba(13,110,110,.10); line-height: 0; }
  .qr-orig img { width: 92px; height: 92px; object-fit: cover; border-radius: 6px; display: block; }
  .stub-cap { font-size: 10.5px; color: var(--mute); letter-spacing: .06em; text-align: center; }
  .stub-actions { margin-top: auto; display: flex; flex-direction: column; gap: 6px; width: 100%; }
  .stub-actions button {
    font-family: var(--grot); font-size: 12px; font-weight: 600; color: var(--vc);
    background: rgba(255,255,255,.92); border: 1.5px solid color-mix(in srgb, var(--vc) 28%, white);
    border-radius: 9px; padding: 8px 10px; cursor: pointer; transition: all .14s;
  }
  .stub-actions button:hover { background: #fff; border-color: var(--vc); }
  .stub-actions button:disabled { opacity: .5; cursor: not-allowed; }

  /* 空态 */
  .empty-state {
    margin-top: 22px; background: #fff; border-radius: 16px; box-shadow: var(--card-shadow);
    padding: 58px 30px; text-align: center;
  }
  .empty-state .ic { font-size: 40px; margin-bottom: 10px; }
  .empty-state .t { font-family: var(--slab); font-weight: 600; font-size: 18px; color: var(--ink); }
  .empty-state .d { font-size: 13px; color: var(--mute); margin-top: 6px; }
  .empty-state .d a { color: var(--brand); }

  /* Toast */
  .toast {
    position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%) translateY(16px);
    background: var(--ink); color: #fff; font-size: 13.5px;
    padding: 11px 20px; border-radius: 999px; opacity: 0; pointer-events: none;
    transition: opacity .22s, transform .22s; z-index: 99; max-width: 76vw;
    box-shadow: 0 12px 32px rgba(18,58,60,.30);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* 打印 */
  @media print {
    .side, .rail-toggle, .head-actions, .stub-actions, .crumb { display: none !important; }
    .shell { grid-template-columns: 1fr !important; }
    main { padding: 0; max-width: none; }
    .v-ticket { box-shadow: none; border: 1px solid #DDD; break-inside: avoid; }
    /* 保证票根浅底渐变在打印时输出，避免白纸上看不出票根分区 */
    .v-stub { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }

  /* 响应式 */
  @media (max-width: 980px) {
    main { padding: 28px 24px 50px; }
    .overview { grid-template-columns: 1fr 1fr; }
    .v-ticket { grid-template-columns: 1fr; }
    .v-stub { border-left: none; border-top: 2px dashed color-mix(in srgb, var(--vc) 30%, white); flex-direction: row; flex-wrap: wrap; justify-content: space-between; }
    .stub-actions { width: auto; flex-direction: row; margin-top: 0; }
  }
  @media (max-width: 720px) {
    .shell { grid-template-columns: 1fr !important; }
    .side { position: static; height: auto; flex-direction: row; flex-wrap: wrap; align-items: center; padding: 12px 16px; border-right: none; border-bottom: 1px solid var(--line-2); }
    .side .nav { flex: none; overflow: visible; }
    .rail-toggle { display: none; }
    .brand { display: block !important; padding: 0; }
    .brand-mark { display: none !important; }
    .nav-label { display: none; }
    .nav { display: flex; gap: 4px; flex-wrap: wrap; }
    .nav a { padding: 8px 10px; }
    .nav a .txt { display: inline !important; }
    .side-foot { margin-top: 0; margin-left: auto; border: none; padding: 0; }
    .side-foot .who { display: inline !important; }
    main { padding: 22px 16px 50px; }
    h1 { font-size: 27px; }
    .overview { grid-template-columns: 1fr; }
    .v-row { grid-template-columns: 66px 22px 1fr; gap: 0 10px; }
    .v-time .d { font-size: 20px; }
    .onsite { grid-template-columns: repeat(2, 1fr); }
  }
  /* 小屏兜底：380 以下现场速查信息降为单列 */
  @media (max-width: 380px) {
    .onsite { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>

<script>
  (function () {
    if (!requireLogin('/login/')) return;

    var qs = new URLSearchParams(location.search);
    var tripId = qs.get('trip') || qs.get('id');
    if (!tripId) { location.replace('/trips/'); return; }

    var user = getCurrentUser() || {};
    document.getElementById('who').textContent = user.displayName || user.username || '旅行者';
    document.getElementById('avatar').textContent = (user.displayName || user.username || 'A').charAt(0).toUpperCase();

    var shell = document.querySelector('.shell');
    var railBtn = document.getElementById('railToggle');
    var KEY = 'travel-os-rail-collapsed';
    function applyRail(collapsed) {
      shell.setAttribute('data-collapsed', collapsed ? 'true' : 'false');
      railBtn.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
      railBtn.setAttribute('aria-label', collapsed ? '展开侧边栏' : '折叠侧边栏');
      document.querySelectorAll('.nav a').forEach(function (a) {
        var t = a.querySelector('.txt');
        if (!t) return;
        if (collapsed) a.setAttribute('title', t.textContent); else a.removeAttribute('title');
      });
    }
    var saved = null;
    try { saved = localStorage.getItem(KEY); } catch (e) {}
    applyRail(saved === 'true');
    railBtn.addEventListener('click', function () {
      var next = shell.getAttribute('data-collapsed') !== 'true';
      applyRail(next);
      try { localStorage.setItem(KEY, next ? 'true' : 'false'); } catch (e) {}
    });

    var toast = document.getElementById('toast');
    var toastTimer = null;
    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { toast.classList.remove('show'); }, 2400);
    }

    /* ===== 常量 ===== */
    var TYPES = [
      { value: 'flight', label: '机票', ic: '✈', c: '#2F6FB5', bg: '#E9F2FD' },
      { value: 'hotel',  label: '酒店', ic: '⌂', c: '#B8830F', bg: '#FDF5E2' },
      { value: 'train',  label: '火车', ic: '🚄', c: '#0D6E6E', bg: '#DCF2F0' },
      { value: 'ticket', label: '门票', ic: '▣', c: '#C2566C', bg: '#FDEFF2' },
      { value: 'other',  label: '其他', ic: '◆', c: '#8A6A3A', bg: '#F6F1E8' }
    ];
    function typeOf(v) {
      for (var i = 0; i < TYPES.length; i++) if (TYPES[i].value === v) return TYPES[i];
      return TYPES[4];
    }
    var WD = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
    var $ = function (id) { return document.getElementById(id); };
    var state = { trip: null, vouchers: [] };

    /* ===== 工具 ===== */
    function escapeHtml(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
    function fmtHM(iso) {
      if (!iso) return '—';
      var d = new Date(iso);
      return isNaN(d) ? '—' : ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
    }
    function fmtDT(iso) {
      if (!iso) return '—';
      var d = new Date(iso);
      if (isNaN(d)) return '—';
      return (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + fmtHM(iso);
    }
    function daysUntil(iso) {
      if (!iso) return null;
      var d = new Date(iso); if (isNaN(d)) return null;
      var a = new Date(); a.setHours(0, 0, 0, 0); d.setHours(0, 0, 0, 0);
      return Math.round((d - a) / 86400000);
    }
    function routeSplit(raw) {
      var parts = String(raw || '').split(/→|->|—|–|to/).map(function (s) { return s.trim(); }).filter(Boolean);
      return { from: parts[0] || '', to: parts[1] || '' };
    }

    /* 凭证二维码（P1-3）：有上传原图直接展示；无附件时编码真实凭据信息（确认码/订单号），
       并如实标注"不可用于官方核验"——不再展示无核验价值的祝福语码 */
    function qrSvg(text) {
      return TravelOSQR.svg(text, 92, '#0F2E30');
    }
    function qrPayload(v) {
      var lines = [v.title || typeOf(v.type).label];
      if (v.confirmCode) lines.push('确认码 ' + v.confirmCode);
      if (v.orderNo) lines.push('订单号 ' + v.orderNo);
      return lines.join('\n');
    }

    /* ===== 现场速查信息（按类型取大字信息） ===== */
    function onsiteOf(v) {
      var ex = v.extra || {};
      var out = [];
      if (v.type === 'flight') {
        out.push({ k: 'FLIGHT · 航班', v: ex.flightNo || '—' });
        var ap = routeSplit(ex.airports);
        if (ap.from || ap.to) out.push({ k: 'ROUTE · 起降', v: (ap.from || '?') + ' → ' + (ap.to || '?') });
        out.push({ k: 'CABIN · 舱位', v: ex.cabin || '—' });
        out.push({ k: 'DEPART · 起飞', v: fmtDT(v.startTime) });
      } else if (v.type === 'train') {
        out.push({ k: 'TRAIN · 车次', v: ex.trainNo || '—' });
        var st = routeSplit(ex.stations);
        if (st.from || st.to) out.push({ k: 'ROUTE · 发到', v: (st.from || '?') + ' → ' + (st.to || '?') });
        out.push({ k: 'SEAT · 座位', v: ex.seat || '—' });
        out.push({ k: 'DEPART · 发车', v: fmtDT(v.startTime) });
      } else if (v.type === 'hotel') {
        out.push({ k: 'CHECK-IN · 入住', v: fmtDT(v.startTime) });
        out.push({ k: 'CHECK-OUT · 退房', v: fmtDT(v.endTime) });
        out.push({ k: 'ROOM · 房型', v: ex.roomType || ex.hotelName || '—' });
        if (ex.freeCancelDeadline) out.push({ k: 'CANCEL BY · 免费取消截止', v: fmtDT(ex.freeCancelDeadline), warn: true });
      } else if (v.type === 'ticket') {
        out.push({ k: 'ENTRY · 项目', v: ex.itemName || v.title || '—' });
        out.push({ k: 'SESSION · 场次', v: ex.session || '—' });
        out.push({ k: 'VALID · 使用时间', v: fmtDT(v.startTime) });
      } else {
        out.push({ k: 'PICK-UP · 取还', v: ex.pickup || v.title || '—' });
        out.push({ k: 'FROM · 开始', v: fmtDT(v.startTime) });
        out.push({ k: 'TO · 结束', v: fmtDT(v.endTime) });
      }
      if (v.confirmCode) out.push({ k: 'CODE · 确认码', v: v.confirmCode, code: true });
      if (v.orderNo) out.push({ k: 'ORDER · 订单号', v: v.orderNo });
      return out;
    }

    /* ===== 加载 ===== */
    async function load() {
      try {
        var results = await Promise.allSettled([
          apiGet('/trips/' + tripId),
          apiGet('/trips/' + tripId + '/bookings/vouchers')
        ]);
        if (results[0].status === 'fulfilled') state.trip = results[0].value.trip || null;
        state.vouchers = results[1].status === 'fulfilled' ? (results[1].value.vouchers || []) : [];

        document.getElementById('crumbTrip').textContent = state.trip ? (state.trip.title || '行程详情') : '行程详情';
        document.getElementById('crumbTrip').href = '/trip-detail/?id=' + encodeURIComponent(tripId);
        document.title = 'Travel OS · ' + ((state.trip && state.trip.title) || '') + ' · 凭证速查';

        render();
      } catch (err) {
        showToast(humanError(err));
        $('loading').textContent = '加载失败，请刷新重试';
      }
    }

    /* ===== 渲染 ===== */
    function render() {
      var list = state.vouchers.slice().sort(function (a, b) {
        return new Date(a.startTime || 0) - new Date(b.startTime || 0);
      });

      var attach = list.filter(function (v) { return v.attachmentUrl; }).length;
      $('ovCount').textContent = list.length;
      $('ovAttach').textContent = attach;
      $('overview').hidden = list.length === 0;

      var meta = $('pageMeta');
      meta.innerHTML = '<b>' + escapeHtml((state.trip && state.trip.title) || '') + '</b> · ' + list.length + ' 张凭证';

      /* banner */
      var bannerBox = $('bannerBox');
      if (!list.length) {
        bannerBox.innerHTML = '';
      } else {
        var first = list[0];
        var d = daysUntil(first.startTime);
        if (d == null) {
          bannerBox.innerHTML = '<div class="banner"><span class="ic">🎫</span><div class="tx">共 <b>' + list.length + '</b> 张凭证待使用 · 出发现场可直接出示本页</div></div>';
          $('ovDays').textContent = '—';
        } else if (d > 0) {
          bannerBox.innerHTML = '<div class="banner' + (d <= 3 ? ' warn' : '') + '"><span class="ic">' + (d <= 3 ? '⚠' : '🎫') + '</span><div class="tx">距首张凭证使用还有 <b>' + d + ' 天</b>'
            + (d <= 3 ? ' · 建议提前截图或打印，离线也能出示' : ' · 出行前记得下载或截图备份') + '</div></div>';
          $('ovDays').textContent = d + ' 天';
        } else if (d === 0) {
          bannerBox.innerHTML = '<div class="banner warn"><span class="ic">🔔</span><div class="tx">首张凭证 <b>今天</b> 就要用了（' + escapeHtml(first.title || '') + '） · 确认码已就位</div></div>';
          $('ovDays').textContent = '今天';
        } else {
          bannerBox.innerHTML = '<div class="banner"><span class="ic">✓</span><div class="tx">本次行程的凭证均已在有效期内涵盖 · 可随时回看</div></div>';
          $('ovDays').textContent = '已开始';
        }
      }

      var tl = $('tl');
      if (!list.length) {
        tl.innerHTML = ''
          + '<div class="empty-state">'
          +   '<div class="ic">🎫</div>'
          +   '<div class="t">还没有可速查的凭证</div>'
          +   '<div class="d">先去 <a href="/bookings/?trip=' + encodeURIComponent(tripId) + '">预订管理</a> 登记机票 / 酒店 / 火车 / 门票，凭证会自动汇总到这里</div>'
          + '</div>';
        return;
      }

      tl.innerHTML = list.map(function (v) {
        var t = typeOf(v.type);
        var d = v.startTime ? new Date(v.startTime) : null;
        var dayNum = d && !isNaN(d) ? d.getDate() : '–';
        var monWd = d && !isNaN(d) ? ((d.getMonth() + 1) + '月 · ' + WD[d.getDay()]) : '日期待定';
        var onsite = onsiteOf(v);
        return ''
          + '<div class="v-row" data-vid="' + escapeHtml(v.id) + '" style="--vc:' + t.c + ';--tb:' + t.bg + ';">'
          +   '<div class="v-time">'
          +     '<div class="d">' + dayNum + '</div>'
          +     '<div class="m">' + monWd + '</div>'
          +     '<div class="t">' + fmtHM(v.startTime) + '</div>'
          +   '</div>'
          +   '<div class="v-axis"><span class="v-dot"></span></div>'
          +   '<article class="v-ticket">'
          +     '<div class="v-main">'
          +       '<div class="v-top">'
          +         '<span class="v-ic">' + t.ic + '</span>'
          +         '<span class="v-type">' + t.label + '</span>'
          +         '<span class="v-when">' + (v.startTime ? fmtDT(v.startTime) : '时间待定') + (v.endTime ? ' → ' + fmtDT(v.endTime) : '') + '</span>'
          +       '</div>'
          +       '<div class="v-title">' + escapeHtml(v.title || t.label) + '</div>'
          +       '<div class="onsite">' + onsite.map(function (o) {
                    return '<div class="os"><div class="k">' + o.k + '</div>'
                      + '<div class="v' + (o.code ? ' code' : '') + (o.warn ? ' warn' : '') + '">' + escapeHtml(o.v) + '</div></div>';
                  }).join('') + '</div>'
          +       (v.type === 'hotel' && v.extra && v.extra.cancelPolicy ? '<div class="v-note">' + escapeHtml(v.extra.cancelPolicy) + '</div>' : '')
          +     '</div>'
          +     '<div class="v-stub">'
          +       (v.attachmentUrl
                ? '<span class="qr qr-orig"><img src="' + escapeHtml(v.attachmentUrl) + '" alt="凭证原图（含官方二维码）"></span>'
                  + '<span class="stub-cap">现场出示 · 以上传原图为准</span>'
                : '<span class="qr">' + qrSvg(qrPayload(v)) + '</span>'
                  + '<span class="stub-cap">凭据码 · 不可用于官方核验</span>')
          +       '<div class="stub-actions">'
          +         '<button type="button" class="view" ' + (v.attachmentUrl ? '' : 'disabled') + '>'
          +           (v.attachmentUrl ? '📎 查看原图' : '无附件') + '</button>'
          +         '<button type="button" class="copy" data-copy="' + escapeHtml(v.confirmCode || v.orderNo || '') + '" '
          +           ((v.confirmCode || v.orderNo) ? '' : 'disabled') + '>⧉ 复制确认码</button>'
          +       '</div>'
          +     '</div>'
          +   '</article>'
          + '</div>';
      }).join('');
    }

    /* ===== 交互 ===== */
    $('tl').addEventListener('click', async function (e) {
      var row = e.target.closest('.v-row');
      if (!row) return;
      var v = state.vouchers.find(function (x) { return x.id === row.getAttribute('data-vid'); });
      if (!v) return;

      if (e.target.closest('.view')) {
        if (!v.attachmentUrl) return;
        window.open(v.attachmentUrl, '_blank', 'noopener');
        return;
      }
      if (e.target.closest('.copy')) {
        var text = v.confirmCode || v.orderNo;
        if (!text) return;
        try {
          await navigator.clipboard.writeText(text);
          showToast('已复制：' + text);
        } catch (err) {
          showToast('复制失败，请手动长按选择');
        }
      }
    });

    $('btnPrint').addEventListener('click', function () {
      if (!state.vouchers.length) { showToast('还没有可打印的凭证'); return; }
      window.print();
    });

    $('btnShare').addEventListener('click', async function () {
      var url = location.href;
      try {
        await navigator.clipboard.writeText(url);
        showToast('行程链接已复制，发给同行伙伴即可');
      } catch (err) {
        showToast('复制失败：' + url);
      }
    });

    load();
  })();
</script>
</body>
</html>
