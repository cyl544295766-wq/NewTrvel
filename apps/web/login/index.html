<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Travel OS · 登录</title>
<link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Space+Grotesk:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/theme.css">
<link rel="stylesheet" href="../assets/css/pet.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: auto; min-height: 100%; }
  body {
    font-family: var(--grot); background: #0A0B0E; color: #fff;
    min-height: 100vh; overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ===== 雪山 3D 场景（三层视差，JS 写入 --px-x/--px-y） ===== */
  .scene { position: fixed; inset: 0; overflow: hidden; z-index: 0; background: #0A0B0E; }
  .px {
    position: absolute; inset: -60px;
    transform: translate(var(--px-x, 0), var(--px-y, 0));
    will-change: transform;
  }
  .px-bg {
    background:
      linear-gradient(180deg, rgba(8,9,12,.52) 0%, rgba(8,9,12,.16) 38%, rgba(8,9,12,.72) 100%),
      linear-gradient(90deg, rgba(8,9,12,.80) 0%, rgba(8,9,12,.26) 55%, rgba(8,9,12,.62) 100%),
      url("../assets/img/login-bg.jpg") center 36% / cover no-repeat;
  }
  .glow { position: absolute; border-radius: 50%; pointer-events: none; }
  .g1 { right: -12%; top: -20%; width: 46vw; height: 46vw;
    background: radial-gradient(circle, rgba(60,180,175,.22), transparent 65%); }
  .g2 { left: -14%; bottom: -24%; width: 44vw; height: 44vw;
    background: radial-gradient(circle, rgba(255,138,76,.16), transparent 65%); }
  .spark {
    position: absolute; border-radius: 50%; background: #fff;
    animation: twinkle 3.4s ease-in-out infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: .14; transform: scale(.8); }
    50%      { opacity: .95; transform: scale(1.15); }
  }

  /* 漂浮 3D 图标（深景/近景两层） */
  .fx {
    position: absolute; display: block;
    filter: drop-shadow(0 18px 30px rgba(0,0,0,.5));
    animation: floaty 8s ease-in-out infinite;
  }
  .fx svg { width: 100%; height: 100%; display: block; }
  @keyframes floaty {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-16px); }
  }
  .f1 { width: 56px; height: 56px; left: 7%;  top: 17%; animation-delay: -1.2s; }
  .f2 { width: 68px; height: 68px; left: 14%; bottom: 20%; animation-delay: -3.4s; }
  .f3 { width: 48px; height: 48px; left: 37%; top: 11%; animation-delay: -2.2s; }
  .f4 { width: 82px; height: 82px; right: 8%;  top: 15%; animation-delay: -4.0s; }
  .f5 { width: 54px; height: 54px; right: 19%; bottom: 16%; animation-delay: -2.8s; }
  .f6 { width: 44px; height: 44px; right: 35%; top: 23%; animation-delay: -5.2s; }

  .scene-vig {
    position: absolute; inset: 0;
    background: radial-gradient(125% 95% at 50% 42%, transparent 52%, rgba(6,7,10,.68) 100%);
  }

  /* ===== 内容：左品牌大字 + 右玻璃登录卡 ===== */
  .page {
    position: relative; z-index: 2; min-height: 100vh;
    display: grid; grid-template-columns: 1fr min(460px, 92vw);
    align-items: center; gap: 48px;
    padding: 48px clamp(24px, 6vw, 88px);
  }
  .brand { max-width: 620px; }
  .mark { display: inline-flex; margin-bottom: 18px; filter: drop-shadow(0 8px 18px rgba(0,0,0,.4)); }
  .mark svg { width: 46px; height: 46px; display: block; }
  .b-name {
    font-family: var(--slab); font-weight: 700; font-size: 27px; color: #fff; line-height: 1.1;
    text-shadow: 0 2px 18px rgba(0,0,0,.45);
  }
  .b-name small {
    display: block; font-family: var(--grot); font-weight: 500; font-size: 10.5px;
    letter-spacing: .3em; color: rgba(255,255,255,.48); margin-top: 7px; text-transform: uppercase;
  }
  .slogan {
    margin-top: 28px;
    font-family: var(--grot); font-weight: 700;
    font-size: clamp(30px, 4.4vw, 52px); line-height: 1.14; letter-spacing: -.015em;
    color: #fff; text-shadow: 0 2px 24px rgba(0,0,0,.5);
  }
  .slogan em { font-style: normal; color: #FFB27E; }
  .feat { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 34px; }
  .feat span {
    padding: 9px 18px; border-radius: 999px;
    background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.14);
    color: rgba(255,255,255,.78); font-family: var(--grot); font-size: 13.5px;
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  }

  /* ===== 玻璃登录卡（JS 写入 --card-rotate-x/y） ===== */
  .card {
    position: relative; width: 100%;
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.13);
    border-radius: 26px; padding: 38px 36px 32px;
    -webkit-backdrop-filter: blur(22px); backdrop-filter: blur(22px);
    box-shadow: 0 32px 80px rgba(0,0,0,.5), 0 2px 8px rgba(0,0,0,.3);
    transform: perspective(1100px) rotateX(var(--card-rotate-x, 0deg)) rotateY(var(--card-rotate-y, 0deg));
    transition: transform .28s ease;
  }
  .card.shake { animation: shake .5s ease; }
  @keyframes shake {
    0%, 100% { margin-left: 0; }
    20%, 60% { margin-left: -9px; }
    40%, 80% { margin-left: 9px; }
  }
  .card h1 {
    font-family: var(--grot); font-weight: 700; font-size: 27px;
    color: #fff; letter-spacing: -.01em;
  }
  .card .subtitle { margin-top: 8px; font-size: 14px; color: rgba(255,255,255,.55); }

  /* 登录 / 注册切换 */
  .mode-tabs {
    position: relative; display: grid; grid-template-columns: 1fr 1fr;
    background: rgba(255,255,255,.07); border-radius: 999px;
    padding: 5px; margin: 24px 0 22px;
  }
  .tab-pill {
    position: absolute; left: 0; top: 5px; bottom: 5px;
    background: rgba(255,255,255,.16); border-radius: 999px;
    transition: transform .28s cubic-bezier(.4,0,.2,1), width .28s cubic-bezier(.4,0,.2,1);
  }
  .mode-tabs button {
    position: relative; z-index: 1;
    background: none; border: none; cursor: pointer;
    font-family: var(--grot); font-weight: 600; font-size: 14px;
    color: rgba(255,255,255,.58); padding: 11px 0; border-radius: 999px;
    transition: color .18s;
  }
  .mode-tabs button[aria-selected="true"] { color: #fff; }

  /* 表单 */
  .field { margin-bottom: 18px; }
  .field label {
    display: block; margin-bottom: 8px;
    font-family: var(--grot); font-size: 12.5px; font-weight: 500;
    letter-spacing: .04em; color: rgba(255,255,255,.55);
  }
  .input-wrap {
    display: flex; align-items: center; gap: 10px;
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.13);
    border-radius: 14px; padding: 0 14px; height: 52px;
    transition: border-color .18s, box-shadow .18s;
  }
  .input-wrap:focus-within {
    border-color: rgba(91,197,192,.65);
    box-shadow: 0 0 0 3px rgba(91,197,192,.22);
  }
  .input-wrap .ico { display: grid; place-items: center; flex: none; }
  .input-wrap .ico svg { width: 23px; height: 23px; display: block; filter: drop-shadow(0 2px 5px rgba(0,0,0,.28)); }
  .input-wrap input {
    flex: 1 1 auto; min-width: 0;
    background: none; border: none; outline: none;
    color: #fff; font-family: var(--grot); font-size: 15px;
  }
  .input-wrap input::placeholder { color: rgba(255,255,255,.32); }
  .toggle-pw {
    background: none; border: none; cursor: pointer;
    padding: 4px; display: grid; place-items: center;
    transition: transform .16s ease;
  }
  .toggle-pw:hover { transform: scale(1.1); }
  .toggle-pw svg { width: 23px; height: 23px; display: block; filter: drop-shadow(0 2px 5px rgba(0,0,0,.28)); }
  .hint { display: block; margin-top: 8px; font-size: 12px; color: rgba(255,255,255,.42); }
  .link {
    background: none; border: none; cursor: pointer; padding: 0;
    color: #7FD8D4; font-family: inherit; font-size: inherit;
    transition: color .16s;
  }
  .link:hover { color: #A5E8E5; }

  .row-between {
    display: flex; align-items: center; justify-content: space-between;
    margin: 4px 0 6px;
  }
  .check {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 13px; color: rgba(255,255,255,.68); cursor: pointer;
  }
  .check input { accent-color: var(--stamp); width: 15px; height: 15px; }

  /* 主按钮（橙色 CTA，与首页一致） */
  .btn-stamp {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; height: 54px; margin-top: 22px;
    background: var(--stamp); color: #fff; border: none; border-radius: 999px;
    font-family: var(--grot); font-weight: 600; font-size: 16px; cursor: pointer;
    box-shadow: 0 12px 32px rgba(255,138,76,.4);
    transition: transform .16s ease, box-shadow .16s ease, opacity .16s;
  }
  .btn-stamp:hover { transform: translateY(-2px); box-shadow: 0 18px 40px rgba(255,138,76,.48); }
  .btn-stamp:active { transform: translateY(0); }
  .btn-stamp.is-loading { opacity: .7; cursor: wait; transform: none; }
  .arr { font-size: 18px; transition: transform .18s; }
  .btn-stamp:hover .arr { transform: translateX(3px); }

  .alt-note { margin-top: 18px; text-align: center; font-size: 13.5px; color: rgba(255,255,255,.55); }

  /* 错误提示 */
  .alert {
    display: flex; align-items: flex-start; gap: 8px;
    background: rgba(255,90,90,.13); border: 1px solid rgba(255,110,110,.35);
    color: #FF9C9C; border-radius: 12px; padding: 11px 14px;
    font-size: 13px; line-height: 1.55; margin-bottom: 18px;
  }
  .alert .ic { flex: none; }
  .alert .ic svg { width: 19px; height: 19px; display: block; margin-top: 1px; filter: drop-shadow(0 2px 5px rgba(0,0,0,.3)); }

  /* 模式切换的字段显隐 */
  body[data-mode="login"] .register-only { display: none; }
  body[data-mode="register"] .login-only { display: none; }

  /* 焦点可达性 */
  a:focus-visible, button:focus-visible, input:focus-visible {
    outline: 2px solid var(--stamp); outline-offset: 3px;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
    .card { transform: none !important; }
    .px { transform: none !important; }
  }

  /* ===== 响应式 ===== */
  @media (max-width: 980px) {
    .page {
      grid-template-columns: 1fr; gap: 30px;
      padding: 44px 22px 56px; align-content: center;
    }
    .brand { max-width: 560px; margin: 0 auto; text-align: center; }
    .mark { margin-left: auto; margin-right: auto; }
    .feat { justify-content: center; }
    .card { max-width: 480px; margin: 0 auto; }
    .f3, .f6 { display: none; }
  }
  @media (max-width: 560px) {
    .slogan { font-size: 27px; }
    .card { padding: 30px 22px 26px; border-radius: 20px; }
    .feat span { padding: 7px 14px; font-size: 12px; }
    .f1, .f5 { display: none; }
  }

  /* ===== 暗色线条图标（#ln-*）：配色与线宽 ===== */
  .ln { fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; }
  .scene .fx svg.ln {
    color: #8FE0DB; stroke-width: 1.35;
    filter: drop-shadow(0 0 12px rgba(143,224,219,.55));
  }
  .scene .fx.acc svg.ln {
    color: #FFC08F;
    filter: drop-shadow(0 0 12px rgba(255,192,143,.55));
  }
  .input-wrap .ico svg.ln { color: #8FE0DB; stroke-width: 2.1; }
  .toggle-pw svg.ln { color: #8FE0DB; stroke-width: 2; }
  .alert .ic svg.ln { color: #FFC08F; stroke-width: 2; }
</style>
</head>
<body data-mode="login">

<script src="../assets/js/icons-line.js"></script>
<!-- 装饰场景：雪山照片 + 双色柔光 + 星屑 + 漂浮 3D 图标（三层视差） -->
<div class="scene" aria-hidden="true">
  <div class="px px-bg" data-depth="6"></div>
  <div class="px" data-depth="12">
    <span class="glow g1"></span>
    <span class="glow g2"></span>
    <div id="sparkles"></div>
  </div>
  <div class="px" data-depth="24">
    <span class="fx f1"><svg class="ln" viewBox="0 0 24 24"><use href="#ln-plane"></use></svg></span>
    <span class="fx f2 acc"><svg class="ln" viewBox="0 0 24 24"><use href="#ln-luggage"></use></svg></span>
    <span class="fx f3"><svg class="ln" viewBox="0 0 24 24"><use href="#ln-globe"></use></svg></span>
  </div>
  <div class="px" data-depth="40">
    <span class="fx f4"><svg class="ln" viewBox="0 0 24 24"><use href="#ln-mountain"></use></svg></span>
    <span class="fx f5"><svg class="ln" viewBox="0 0 24 24"><use href="#ln-book"></use></svg></span>
    <span class="fx f6 acc"><svg class="ln" viewBox="0 0 24 24"><use href="#ln-spark"></use></svg></span>
  </div>
  <div class="scene-vig"></div>
</div>

<main class="page">

  <!-- 顶部品牌区：Logo + Slogan -->
  <header class="brand">
    <span class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" role="img" aria-label="Travel OS 山形标志">
        <defs>
          <linearGradient id="mk" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#1BA49A"/><stop offset="1" stop-color="#54C9BE"/>
          </linearGradient>
        </defs>
        <path d="M2.5 18 L9 8.2 L12.6 13 L15.4 9.4 L21.5 18 Z" fill="url(#mk)"/>
        <circle cx="17.6" cy="5.6" r="2.1" fill="#FFC77E"/>
      </svg>
    </span>
    <div class="b-name">Travel OS<small>行程驾驶舱</small></div>
    <p class="slogan">把每一次出发，都收进<em>同一本行程簿</em></p>
    <div class="feat"><span>行程规划</span><span>多人协作</span><span>费用结算</span><span>AI 助手</span></div>
  </header>

  <!-- 玻璃拟态登录卡 -->
  <section class="card" id="card">
    <h1 id="authTitle">欢迎回来</h1>
    <p class="subtitle" id="authSubtitle">登录你的 Travel OS 账户</p>

    <div class="mode-tabs" role="tablist" aria-label="登录或注册">
      <span class="tab-pill" id="tabPill" aria-hidden="true"></span>
      <button role="tab" id="tabLogin" aria-selected="true" aria-controls="form">登录</button>
      <button role="tab" id="tabRegister" aria-selected="false" aria-controls="form">注册</button>
    </div>

    <form class="form" id="form" novalidate>

      <div class="alert" id="alert" role="alert" hidden>
        <span class="ic" aria-hidden="true"><svg class="ln" viewBox="0 0 24 24"><use href="#ln-alert"></use></svg></span>
        <span id="alertText">用户名或密码不正确，请重新输入</span>
      </div>

      <div class="field">
        <label for="username">用户名</label>
        <span class="input-wrap">
          <span class="ico" aria-hidden="true"><svg class="ln" viewBox="0 0 24 24"><use href="#ln-account"></use></svg></span>
          <input id="username" name="username" type="text" autocomplete="username"
            placeholder="3–20 位字母、数字或下划线" required>
        </span>
      </div>

      <div class="field">
        <label for="password">密码</label>
        <span class="input-wrap">
          <span class="ico" aria-hidden="true"><svg class="ln" viewBox="0 0 24 24"><use href="#ln-lock"></use></svg></span>
          <input id="password" name="password" type="password" autocomplete="current-password"
            placeholder="登录：任意 / 注册：8 位以上且含字母与数字" required>
          <button class="toggle-pw" type="button" id="togglePw" aria-label="显示密码"><svg class="ln" viewBox="0 0 24 24" aria-hidden="true"><use href="#ln-eye"></use></svg></button>
        </span>
        <span class="hint login-only">忘记密码？<button class="link" type="button" id="forgotLink">联系管理员重置</button></span>
      </div>

      <div class="field register-only">
        <label for="confirm">确认密码</label>
        <span class="input-wrap">
          <span class="ico" aria-hidden="true"><svg class="ln" viewBox="0 0 24 24"><use href="#ln-lock"></use></svg></span>
          <input id="confirm" name="confirm" type="password" autocomplete="new-password"
            placeholder="再输一次密码">
        </span>
        <span class="hint">两次输入需要一致</span>
      </div>

      <div class="row-between login-only">
        <label class="check"><input type="checkbox" id="remember" checked> 记住我</label>
        <button class="link" type="button" id="forgotBtn">忘记密码？</button>
      </div>

      <button class="btn-stamp" type="submit" id="submitBtn">
        <span id="submitText">进入我的行程</span>
        <span class="arr" aria-hidden="true">→</span>
      </button>

      <p class="alt-note">
        <span id="altText">还没有账户？</span>
        <button class="link" type="button" id="altLink">立即注册</button>
      </p>

    </form>
  </section>

</main>

<script src="../assets/js/api.js"></script>
<script src="../assets/js/pet.js"></script>
<script>
  (function () {
    var body = document.body;
    var tabLogin = document.getElementById('tabLogin');
    var tabRegister = document.getElementById('tabRegister');
    var title = document.getElementById('authTitle');
    var subtitle = document.getElementById('authSubtitle');
    var submitText = document.getElementById('submitText');
    var altText = document.getElementById('altText');
    var altLink = document.getElementById('altLink');
    var alertBox = document.getElementById('alert');
    var alertText = document.getElementById('alertText');
    var form = document.getElementById('form');
    var submitBtn = document.getElementById('submitBtn');
    var pwInput = document.getElementById('password');
    var togglePw = document.getElementById('togglePw');
    var usernameInput = document.getElementById('username');
    var confirmInput = document.getElementById('confirm');
    var forgotBtn = document.getElementById('forgotBtn');
    var forgotLink = document.getElementById('forgotLink');
    var card = document.getElementById('card');
    var pill = document.getElementById('tabPill');
    var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    // 已登录则直接跳走（避免重复登录）
    if (isLoggedIn()) {
      var here = consumeRedirect('/home/');
      location.replace(here);
      return;
    }

    /* ===== 场景装饰：星屑 + 鼠标视差（尊重 reduced-motion） ===== */
    (function decorateScene() {
      var box = document.getElementById('sparkles');
      if (box && !reduceMotion) {
        for (var i = 0; i < 16; i++) {
          var dot = document.createElement('span');
          dot.className = 'spark';
          var size = 2 + Math.random() * 3;
          dot.style.width = size + 'px';
          dot.style.height = size + 'px';
          dot.style.left = (4 + Math.random() * 92) + '%';
          dot.style.top = (4 + Math.random() * 42) + '%';
          dot.style.animationDelay = (-Math.random() * 4).toFixed(2) + 's';
          box.appendChild(dot);
        }
      }
      if (reduceMotion) return;
      var layers = document.querySelectorAll('.scene .px');
      window.addEventListener('pointermove', function (e) {
        if (e.pointerType !== 'mouse') return;
        var dx = e.clientX / window.innerWidth - 0.5;
        var dy = e.clientY / window.innerHeight - 0.5;
        layers.forEach(function (el) {
          var depth = parseFloat(el.getAttribute('data-depth') || '0');
          el.style.setProperty('--px-x', (-dx * depth).toFixed(1) + 'px');
          el.style.setProperty('--px-y', (-dy * depth).toFixed(1) + 'px');
        });
        if (card && card.matches(':hover')) {
          var rect = card.getBoundingClientRect();
          var localX = (e.clientX - rect.left) / rect.width - 0.5;
          var localY = (e.clientY - rect.top) / rect.height - 0.5;
          card.style.setProperty('--card-rotate-x', (-localY * 3.2).toFixed(2) + 'deg');
          card.style.setProperty('--card-rotate-y', (localX * 3.2).toFixed(2) + 'deg');
        }
      });
      if (card) {
        card.addEventListener('pointerleave', function () {
          card.style.setProperty('--card-rotate-x', '0deg');
          card.style.setProperty('--card-rotate-y', '0deg');
        });
      }
    })();

    /* ===== 登录/注册切换：滑动指示条 ===== */
    function movePill() {
      var active = document.querySelector('.mode-tabs button[aria-selected="true"]');
      if (!active || !pill) return;
      pill.style.width = active.offsetWidth + 'px';
      pill.style.transform = 'translateX(' + active.offsetLeft + 'px)';
    }
    window.addEventListener('resize', movePill);
    window.addEventListener('load', movePill);

    // 从 ?mode=register 解析初始模式
    var initialMode = (new URLSearchParams(location.search)).get('mode') === 'register' ? 'register' : 'login';
    setMode(initialMode);

    function setMode(mode) {
      body.setAttribute('data-mode', mode);
      var isLogin = mode === 'login';
      tabLogin.setAttribute('aria-selected', isLogin ? 'true' : 'false');
      tabRegister.setAttribute('aria-selected', isLogin ? 'false' : 'true');
      title.textContent = isLogin ? '欢迎回来' : '开启你的旅程';
      subtitle.textContent = isLogin ? '登录你的 Travel OS 账户' : '只需用户名和密码，立即出发';
      submitText.textContent = isLogin ? '进入我的行程' : '创建账户并出发';
      altText.textContent = isLogin ? '还没有账户？' : '已经有账户了？';
      altLink.textContent = isLogin ? '立即注册' : '直接登录';
      alertBox.hidden = true;
      movePill();
    }

    tabLogin.addEventListener('click', function () { setMode('login'); });
    tabRegister.addEventListener('click', function () { setMode('register'); });
    altLink.addEventListener('click', function () {
      setMode(body.getAttribute('data-mode') === 'login' ? 'register' : 'login');
    });

    // 忘记密码：给出指引（账户由行程管理员重置）
    function forgotHint() {
      fail('请把用户名发给行程管理员，由管理员在后台重置密码。');
    }
    forgotBtn.addEventListener('click', forgotHint);
    forgotLink.addEventListener('click', forgotHint);

    // 密码可见切换
    togglePw.addEventListener('click', function () {
      var show = pwInput.type === 'password';
      pwInput.type = show ? 'text' : 'password';
      togglePw.setAttribute('aria-label', show ? '隐藏密码' : '显示密码');
      togglePw.innerHTML = '<svg class="ln" viewBox="0 0 24 24" aria-hidden="true"><use href="#ln-'
        + (show ? 'eye-off' : 'eye') + '"></use></svg>';
    });

    // 输入时收起错误提示
    form.addEventListener('input', function () { alertBox.hidden = true; });

    function fail(msg) {
      alertText.textContent = msg;
      alertBox.hidden = false;
      /* 出错时卡片轻晃，把视线引到错误提示 */
      if (!reduceMotion) {
        card.classList.remove('shake');
        void card.offsetWidth;
        card.classList.add('shake');
      }
    }

    function setLoading(loading) {
      submitBtn.disabled = !!loading;
      submitBtn.classList.toggle('is-loading', !!loading);
      submitText.textContent = loading
        ? (body.getAttribute('data-mode') === 'register' ? '注册中…' : '正在进入…')
        : (body.getAttribute('data-mode') === 'register' ? '创建账户并出发' : '进入我的行程');
    }

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      var u = usernameInput.value.trim();
      var p = pwInput.value;
      var isRegister = body.getAttribute('data-mode') === 'register';

      if (!u || !p) return fail('请填写用户名和密码');
      if (u.length < 3 || u.length > 20) return fail('用户名需要 3–20 位');
      if (isRegister) {
        if (p.length < 8) return fail('注册密码至少 8 位');
        if (!(/[A-Za-z]/.test(p) && /\d/.test(p))) return fail('注册密码须同时包含字母和数字');
        if (confirmInput.value !== p) return fail('两次输入的密码不一致');
      }

      setLoading(true);
      try {
        var data;
        if (isRegister) {
          data = await apiPost('/auth/register', { username: u, password: p });
        } else {
          data = await apiPost('/auth/login', { username: u, password: p });
        }
        // 登录/注册成功：body 里直接拿到 token + user（见 AuthController 已返回 token）
        var token = data && data.token;
        var user  = data && (data.user || (data.data && data.data.user));
        if (!token) {
          // 后端没返回 token 时回退到 cookie-only 模式（标记已登录，跳转后由 /auth/me 校验）
          setAuth('cookie', user || { username: u });
        } else {
          setAuth(token, user || { username: u });
        }
        var target = consumeRedirect('/home/');
        location.replace(target);
      } catch (err) {
        fail(humanError(err));
        setLoading(false);
      }
    });
  })();
</script>
</body>
</html>
