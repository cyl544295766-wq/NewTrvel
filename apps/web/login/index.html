<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>织途 · 登录</title>
<link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Space+Grotesk:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<script src="../assets/js/theme-mode.js"></script>
<link rel="stylesheet" href="../assets/css/theme.css?v=appearance">
<link rel="stylesheet" href="../assets/css/pet.css?v=appearance">
<style>
  :root {
    color-scheme: dark;
    --login-bg: #0A0B0E;
    --login-text: #fff;
    --login-muted: #C2CFD0;
    --login-placeholder: #9BACAE;
    --login-panel: rgba(255,255,255,.06);
    --login-surface: rgba(255,255,255,.07);
    --login-line: rgba(255,255,255,.18);
    --login-active: rgba(255,255,255,.16);
    --login-link: #7FD8D4;
    --login-link-hover: #A5E8E5;
    --login-brand-accent: #FFB27E;
    --login-shadow: 0 32px 80px rgba(0,0,0,.5), 0 2px 8px rgba(0,0,0,.3);
    --login-text-shadow: 0 2px 24px rgba(0,0,0,.5);
    --login-alert-bg: rgba(255,90,90,.13);
    --login-alert-line: rgba(255,110,110,.35);
    --login-alert-text: #FF9C9C;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --login-bg: #f4f7f3;
    --login-text: #123A3C;
    --login-muted: #405F61;
    --login-placeholder: #577174;
    --login-panel: #fff;
    --login-surface: #f2f6f3;
    --login-line: #bed2cc;
    --login-active: #dcece5;
    --login-link: #0D6E6E;
    --login-link-hover: #0A5555;
    --login-brand-accent: #9C3E1F;
    --login-shadow: 0 20px 54px rgba(37,63,55,.11), 0 2px 6px rgba(37,63,55,.06);
    --login-text-shadow: none;
    --login-alert-bg: #FFF0EB;
    --login-alert-line: #E9B0A2;
    --login-alert-text: #932F22;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: auto; min-height: 100%; }
  body {
    font-family: var(--grot); background: var(--login-bg); color: var(--login-text);
    min-height: 100vh; overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ===== 雪山 3D 场景（三层视差，JS 写入 --px-x/--px-y） ===== */
  .scene { position: fixed; inset: 0; overflow: hidden; z-index: 0; background: var(--login-bg); }
  .px {
    position: absolute; inset: -60px;
    transform: translate(var(--px-x, 0), var(--px-y, 0));
    will-change: transform;
  }
  .px-bg {
    background:
      linear-gradient(180deg, rgba(8,9,12,.52) 0%, rgba(8,9,12,.16) 38%, rgba(8,9,12,.72) 100%),
      linear-gradient(90deg, rgba(8,9,12,.80) 0%, rgba(8,9,12,.26) 55%, rgba(8,9,12,.62) 100%),
      url("../assets/img/login-bg.jpg") center 36% / cover no-repeat;
  }
  [data-theme="light"] .px-bg {
    background:
      linear-gradient(0deg, #f4f7f3, transparent 32%, rgba(244,247,243,.68) 52%, rgba(244,247,243,.86) 100%),
      linear-gradient(90deg, rgba(244,247,243,.62) 10%, rgba(244,247,243,.80) 42%, #f4f7f3 70%),
      url("../assets/img/login-bg.jpg") left center / cover no-repeat;
  }
  [data-theme="light"] .scene :is(.scene-vig, #sparkles, .glow, .fx) { display: none; }
  .glow { position: absolute; border-radius: 50%; pointer-events: none; }
  .g1 { right: -12%; top: -20%; width: 46vw; height: 46vw;
    background: radial-gradient(circle, rgba(60,180,175,.22), transparent 65%); }
  .g2 { left: -14%; bottom: -24%; width: 44vw; height: 44vw;
    background: radial-gradient(circle, rgba(255,138,76,.16), transparent 65%); }
  .spark {
    position: absolute; border-radius: 50%; background: #fff;
    animation: twinkle 3.4s ease-in-out infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: .14; transform: scale(.8); }
    50%      { opacity: .95; transform: scale(1.15); }
  }

  /* 漂浮 3D 图标（深景/近景两层） */
  .fx {
    position: absolute; display: block;
    filter: drop-shadow(0 18px 30px rgba(0,0,0,.5));
    animation: floaty 8s ease-in-out infinite;
  }
  .fx svg { width: 100%; height: 100%; display: block; }
  @keyframes floaty {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-16px); }
  }
  .f1 { width: 56px; height: 56px; left: 7%;  top: 17%; animation-delay: -1.2s; }
  .f2 { width: 68px; height: 68px; left: 14%; bottom: 20%; animation-delay: -3.4s; }
  .f3 { width: 48px; height: 48px; left: 37%; top: 11%; animation-delay: -2.2s; }
  .f4 { width: 82px; height: 82px; right: 8%;  top: 15%; animation-delay: -4.0s; }
  .f5 { width: 54px; height: 54px; right: 19%; bottom: 16%; animation-delay: -2.8s; }
  .f6 { width: 44px; height: 44px; right: 35%; top: 23%; animation-delay: -5.2s; }

  .scene-vig {
    position: absolute; inset: 0;
    background: radial-gradient(125% 95% at 50% 42%, transparent 52%, rgba(6,7,10,.68) 100%);
  }

  /* ===== 内容：左品牌大字 + 右玻璃登录卡 ===== */
  .page {
    position: relative; z-index: 2; min-height: 100vh;
    display: grid; grid-template-columns: 1fr min(460px, 92vw);
    grid-template-areas: "brand auth";
    align-items: center; align-content: center; gap: 48px;
    padding: 48px clamp(24px, 6vw, 88px);
  }
  .brand { grid-area: brand; max-width: 620px; }
  .auth-area { grid-area: auth; min-width: 0; }
  .mark { display: inline-flex; margin-bottom: 18px; filter: drop-shadow(0 8px 18px rgba(0,0,0,.4)); }
  .mark svg { width: 46px; height: 46px; display: block; }
  .b-name {
    font-family: var(--slab); font-weight: 700; font-size: 27px; color: var(--login-text); line-height: 1.1;
    text-shadow: var(--login-text-shadow);
  }
  .b-name small {
    display: block; font-family: var(--grot); font-weight: 500; font-size: 10.5px;
    letter-spacing: .3em; color: var(--login-muted); margin-top: 7px; text-transform: uppercase;
  }
  .slogan {
    margin-top: 28px;
    font-family: var(--grot); font-weight: 700;
    font-size: clamp(30px, 4.4vw, 52px); line-height: 1.14; letter-spacing: -.015em;
    color: var(--login-text); text-shadow: var(--login-text-shadow);
  }
  .slogan em { font-style: normal; color: var(--login-brand-accent); }
  [data-theme="light"] .slogan span { display: block; }
  [data-theme="light"] .slogan em { white-space: nowrap; }
  .feat { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 34px; }
  .feat span {
    padding: 9px 18px; border-radius: 999px;
    background: var(--login-surface); border: 1px solid var(--login-line);
    color: var(--login-muted); font-family: var(--grot); font-size: 13.5px;
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  }

  /* ===== 玻璃登录卡（JS 写入 --card-rotate-x/y） ===== */
  .card {
    position: relative; width: 100%;
    background: var(--login-panel);
    border: 1px solid var(--login-line);
    border-radius: 26px; padding: 38px 36px 32px;
    -webkit-backdrop-filter: blur(22px); backdrop-filter: blur(22px);
    box-shadow: var(--login-shadow);
    transform: perspective(1100px) rotateX(var(--card-rotate-x, 0deg)) rotateY(var(--card-rotate-y, 0deg));
    transition: transform .28s ease;
  }
  .card.shake { animation: shake .5s ease; }
  [data-theme="light"] .card {
    -webkit-backdrop-filter: none; backdrop-filter: none;
    transform: none;
  }
  @keyframes shake {
    0%, 100% { margin-left: 0; }
    20%, 60% { margin-left: -9px; }
    40%, 80% { margin-left: 9px; }
  }
  .card h1 {
    font-family: var(--grot); font-weight: 700; font-size: 27px;
    color: var(--login-text); letter-spacing: -.01em;
  }
  .card-head { padding-right: 84px; }
  .card .subtitle { margin-top: 8px; font-size: 14px; color: var(--login-muted); }

  /* 登录 / 注册切换 */
  .mode-tabs {
    position: relative; display: grid; grid-template-columns: 1fr 1fr;
    background: var(--login-surface); border-radius: 999px;
    padding: 5px; margin: 24px 0 22px;
  }
  .tab-pill {
    position: absolute; left: 0; top: 5px; bottom: 5px;
    background: var(--login-active); border-radius: 999px;
    transition: transform .28s cubic-bezier(.4,0,.2,1), width .28s cubic-bezier(.4,0,.2,1);
  }
  .mode-tabs button {
    position: relative; z-index: 1;
    background: none; border: none; cursor: pointer;
    font-family: var(--grot); font-weight: 600; font-size: 14px;
    color: var(--login-muted); padding: 11px 0; border-radius: 999px;
    transition: color .18s;
  }
  .mode-tabs button[aria-selected="true"] { color: var(--login-text); }
  [data-theme="light"] .tab-pill {
    background: #fff;
    box-shadow: 0 1px 4px rgba(22,56,58,.12);
  }

  /* 表单 */
  .field { margin-bottom: 18px; }
  .field label {
    display: block; margin-bottom: 8px;
    font-family: var(--grot); font-size: 12.5px; font-weight: 500;
    letter-spacing: .04em; color: var(--login-muted);
  }
  .input-wrap {
    display: flex; align-items: center; gap: 10px;
    background: var(--login-surface); border: 1px solid var(--login-line);
    border-radius: 14px; padding: 0 14px; height: 52px;
    transition: border-color .18s, box-shadow .18s;
  }
  .input-wrap:focus-within {
    border-color: rgba(91,197,192,.65);
    box-shadow: 0 0 0 3px rgba(91,197,192,.22);
  }
  .input-wrap:has(input[aria-invalid="true"]) { border-color: var(--login-alert-text); }
  .input-wrap .ico { display: grid; place-items: center; flex: none; }
  .input-wrap .ico svg { width: 23px; height: 23px; display: block; filter: drop-shadow(0 2px 5px rgba(0,0,0,.28)); }
  .input-wrap input {
    flex: 1 1 auto; min-width: 0;
    background: none; border: none; outline: none;
    color: var(--login-text); font-family: var(--grot); font-size: 15px;
  }
  .input-wrap input::placeholder { color: var(--login-placeholder); }
  .toggle-pw {
    background: none; border: none; cursor: pointer;
    padding: 4px; display: grid; place-items: center;
    transition: transform .16s ease;
  }
  .toggle-pw:hover { transform: scale(1.1); }
  .toggle-pw svg { width: 23px; height: 23px; display: block; filter: drop-shadow(0 2px 5px rgba(0,0,0,.28)); }
  .hint, .field-error, .reset-help { margin-top: 6px; font-size: 12px; line-height: 1.5; }
  .hint, .reset-help { color: var(--login-muted); }
  .field-error { color: var(--login-alert-text); }
  .link {
    background: none; border: none; cursor: pointer; padding: 0;
    color: var(--login-link); font-family: inherit; font-size: inherit;
    transition: color .16s;
  }
  .link:hover { color: var(--login-link-hover); }

  .row-between {
    display: flex; align-items: center; justify-content: space-between;
    margin: 4px 0 6px;
  }
  .check {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 13px; color: var(--login-muted); cursor: pointer;
  }
  .check input { accent-color: var(--stamp); width: 15px; height: 15px; }

  .form-actions {
    margin-top: 18px;
  }
  .theme-toggle {
    grid-area: auth; align-self: start; justify-self: end; z-index: 1;
    margin: 34px 36px 0 0; min-width: 72px; min-height: 44px; padding: 0 12px;
    border: 1px solid var(--login-line); border-radius: 999px;
    background: var(--login-surface); color: var(--login-text);
    font: 600 13px var(--grot); white-space: nowrap; cursor: pointer;
  }
  .theme-toggle:hover { background: var(--login-active); }

  .login-assistant { display: flex; justify-content: flex-end; margin-top: 10px; }
  .login-assistant .pet-host { position: static; }
  .login-assistant .pet {
    position: relative; width: auto; min-height: 44px; height: auto;
    display: inline-flex; align-items: center; gap: 7px; padding: 4px 12px 4px 6px;
    background: var(--login-panel); color: var(--login-text);
    border: 1px solid var(--login-line); border-radius: 999px;
    font: 600 13px var(--grot); cursor: pointer; touch-action: manipulation;
  }
  .login-assistant .pet:hover { background: var(--login-active); }
  .login-assistant .pet .body-wrap {
    position: static; width: 27px; height: 32px; animation: none;
  }

  /* 主按钮（橙色 CTA，与首页一致） */
  .btn-stamp {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; min-height: 54px; padding: 6px 8px; margin-top: 0;
    background: var(--stamp); color: #392014; border: none; border-radius: 999px;
    font-family: var(--grot); font-weight: 600; font-size: 16px; cursor: pointer;
    box-shadow: 0 12px 32px rgba(255,138,76,.4);
    transition: transform .16s ease, box-shadow .16s ease, opacity .16s;
  }
  .btn-stamp:hover { transform: translateY(-2px); box-shadow: 0 18px 40px rgba(255,138,76,.48); }
  .btn-stamp:active { transform: translateY(0); }
  .btn-stamp.is-loading { opacity: .7; cursor: wait; transform: none; }
  .arr { font-size: 18px; transition: transform .18s; }
  .btn-stamp:hover .arr { transform: translateX(3px); }

  .alt-note { margin-top: 18px; text-align: center; font-size: 13.5px; color: var(--login-muted); }

  /* 华为账号登录（与 App 共用同一账号体系） */
  .hw-login { margin-top: 16px; }
  .hw-divider { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .hw-divider::before, .hw-divider::after {
    content: ""; flex: 1; height: 1px; background: var(--login-line);
  }
  .hw-divider em { font-style: normal; font-size: 12px; color: var(--login-muted); }
  .hw-btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    height: 46px; border-radius: 12px; text-decoration: none;
    background: transparent; color: var(--login-text); font-size: 14.5px; font-weight: 600;
    border: 1px solid var(--login-line); transition: transform .16s, box-shadow .16s;
  }
  .hw-btn:hover { transform: translateY(-1px); box-shadow: 0 8px 22px rgba(0,0,0,.18); }
  .hw-btn:active { transform: translateY(0); }
  /* 华为官方花瓣标识，尺寸与文字基线对齐 */
  .hw-logo { display: block; width: 18px; height: 18px; flex: none; }
  .hw-note { margin: 8px 0 0; text-align: center; font-size: 12px; color: var(--login-muted); }

  /* 错误提示 */
  .alert {
    display: flex; align-items: flex-start; gap: 8px;
    background: var(--login-alert-bg); border: 1px solid var(--login-alert-line);
    color: var(--login-alert-text); border-radius: 12px; padding: 11px 14px;
    font-size: 13px; line-height: 1.55; margin-bottom: 18px;
  }
  .alert .ic { flex: none; }
  .alert .ic svg { width: 19px; height: 19px; display: block; margin-top: 1px; filter: drop-shadow(0 2px 5px rgba(0,0,0,.3)); }
  .alert[hidden] { display: none; }

  /* 模式切换的字段显隐 */
  body[data-mode="login"] .register-only { display: none; }
  body[data-mode="register"] .login-only { display: none; }

  /* 焦点可达性 */
  a:focus-visible, button:focus-visible, input:focus-visible {
    outline: 2px solid var(--stamp); outline-offset: 3px;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
    .card { transform: none !important; }
    .px { transform: none !important; }
  }

  /* ===== 响应式 ===== */
  @media (max-width: 980px) {
    .page {
      min-height: 100dvh; max-width: 528px; margin: 0 auto;
      grid-template-columns: minmax(0, 1fr) auto;
      grid-template-areas: "brand theme" "auth auth";
      gap: 16px 12px; padding: 18px 20px 28px; align-content: start;
    }
    .scene { position: absolute; height: 170px; inset: 0 0 auto; }
    .scene .px { inset: 0; transform: none; }
    .scene :is(.scene-vig, #sparkles, .glow, .fx) { display: none; }
    .px-bg {
      background: linear-gradient(180deg, rgba(10,11,14,.45), var(--login-bg)),
        url("../assets/img/login-bg.jpg") center 44% / cover no-repeat;
    }
    [data-theme="light"] .px-bg {
      background: linear-gradient(180deg, rgba(244,247,243,.40), var(--login-bg)),
        url("../assets/img/login-bg.jpg") center 44% / cover no-repeat;
    }
    .brand { display: flex; align-items: center; gap: 8px; }
    .mark { margin: 0; }
    .mark svg { width: 34px; height: 34px; }
    .b-name { font-size: 23px; }
    .b-name small, .slogan, .feat { display: none; }
    .theme-toggle { grid-area: theme; margin: 0; }
    .card { transform: none; }
    .card-head { padding-right: 0; }
  }
  @media (max-width: 560px) {
    .page { padding-inline: 14px; }
    .card { padding: 20px 20px 16px; border-radius: 20px; }
    .card h1 { font-size: 24px; line-height: 1.3; }
    .card .subtitle { margin-top: 4px; }
    .mode-tabs { margin: 14px 0 12px; }
    .field { margin-bottom: 12px; }
    .field label { margin-bottom: 5px; }
    .input-wrap input { font-size: 16px; }
    .toggle-pw { min-width: 44px; min-height: 44px; margin-right: -8px; }
    .row-between > * { min-height: 44px; }
    .form-actions { margin-top: 8px; }
    .hw-login { margin-top: 14px; }
    .hw-divider { margin-bottom: 8px; }
    .hw-note { margin-top: 6px; }
    .alt-note { margin-top: 12px; }
  }

  /* ===== 暗色线条图标（#ln-*）：配色与线宽 ===== */
  .ln { fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; }
  .scene .fx svg.ln {
    color: #8FE0DB; stroke-width: 1.35;
    filter: drop-shadow(0 0 12px rgba(143,224,219,.55));
  }
  .scene .fx.acc svg.ln {
    color: #FFC08F;
    filter: drop-shadow(0 0 12px rgba(255,192,143,.55));
  }
  .input-wrap .ico svg.ln { color: var(--login-link); stroke-width: 2.1; }
  .toggle-pw svg.ln { color: var(--login-link); stroke-width: 2; }
  .alert .ic svg.ln { color: var(--login-brand-accent); stroke-width: 2; }
</style>
</head>
<body data-mode="login">

<script src="../assets/js/icons-line.js"></script>
<!-- 装饰场景：雪山照片 + 双色柔光 + 星屑 + 漂浮 3D 图标（三层视差） -->
<div class="scene" aria-hidden="true">
  <div class="px px-bg" data-depth="6"></div>
  <div class="px" data-depth="12">
    <span class="glow g1"></span>
    <span class="glow g2"></span>
    <div id="sparkles"></div>
  </div>
  <div class="px" data-depth="24">
    <span class="fx f1"><svg class="ln" viewBox="0 0 24 24"><use href="#ln-plane"></use></svg></span>
    <span class="fx f2 acc"><svg class="ln" viewBox="0 0 24 24"><use href="#ln-luggage"></use></svg></span>
    <span class="fx f3"><svg class="ln" viewBox="0 0 24 24"><use href="#ln-globe"></use></svg></span>
  </div>
  <div class="px" data-depth="40">
    <span class="fx f4"><svg class="ln" viewBox="0 0 24 24"><use href="#ln-mountain"></use></svg></span>
    <span class="fx f5"><svg class="ln" viewBox="0 0 24 24"><use href="#ln-book"></use></svg></span>
    <span class="fx f6 acc"><svg class="ln" viewBox="0 0 24 24"><use href="#ln-spark"></use></svg></span>
  </div>
  <div class="scene-vig"></div>
</div>

<main class="page">

  <!-- 顶部品牌区：Logo + Slogan -->
  <header class="brand">
    <span class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" role="img" aria-label="织途 山形标志">
        <defs>
          <linearGradient id="mk" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#1BA49A"/><stop offset="1" stop-color="#54C9BE"/>
          </linearGradient>
        </defs>
        <path d="M2.5 18 L9 8.2 L12.6 13 L15.4 9.4 L21.5 18 Z" fill="url(#mk)"/>
        <circle cx="17.6" cy="5.6" r="2.1" fill="#FFC77E"/>
      </svg>
    </span>
    <div class="b-name">织途<small>行程驾驶舱</small></div>
    <p class="slogan"><span>把每一次出发，</span><span>都收进<em>同一本行程簿</em></span></p>
    <div class="feat"><span>行程规划</span><span>多人协作</span><span>费用结算</span><span>AI 助手</span></div>
  </header>

  <button class="theme-toggle" type="button" id="themeToggle" data-theme-toggle aria-label="切换为浅色模式">浅色</button>

  <div class="auth-area">
  <section class="card" id="card" aria-labelledby="authTitle">
    <header class="card-head">
      <h1 id="authTitle">欢迎回来</h1>
      <p class="subtitle" id="authSubtitle">登录你的织途账户</p>
    </header>

    <div class="mode-tabs" role="tablist" aria-label="登录或注册">
      <span class="tab-pill" id="tabPill" aria-hidden="true"></span>
      <button type="button" role="tab" id="tabLogin" aria-selected="true" aria-controls="authPanel">登录</button>
      <button type="button" role="tab" id="tabRegister" aria-selected="false" aria-controls="authPanel" tabindex="-1">注册</button>
    </div>

    <div id="authPanel" role="tabpanel" aria-labelledby="tabLogin">
    <form class="form" id="form" novalidate>

      <div class="alert" id="alert" role="alert" hidden>
        <span class="ic" aria-hidden="true"><svg class="ln" viewBox="0 0 24 24"><use href="#ln-alert"></use></svg></span>
        <span id="alertText">用户名或密码不正确，请重新输入</span>
      </div>

      <div class="field">
        <label for="username">用户名</label>
        <span class="input-wrap">
          <span class="ico" aria-hidden="true"><svg class="ln" viewBox="0 0 24 24"><use href="#ln-account"></use></svg></span>
          <input id="username" name="username" type="text" autocomplete="username"
            autocapitalize="none" spellcheck="false" placeholder="输入用户名" required>
        </span>
        <p class="hint register-only" id="usernameHint">3–20 位字母、数字或下划线</p>
        <p class="field-error" id="usernameError" aria-live="polite" hidden></p>
      </div>

      <div class="field">
        <label for="password">密码</label>
        <span class="input-wrap">
          <span class="ico" aria-hidden="true"><svg class="ln" viewBox="0 0 24 24"><use href="#ln-lock"></use></svg></span>
          <input id="password" name="password" type="password" autocomplete="current-password"
            placeholder="输入密码" required>
          <button class="toggle-pw" type="button" id="togglePw" aria-label="显示密码"><svg class="ln" viewBox="0 0 24 24" aria-hidden="true"><use href="#ln-eye"></use></svg></button>
        </span>
        <p class="hint register-only" id="passwordHint">至少 8 位，且同时包含字母和数字</p>
        <p class="field-error" id="passwordError" aria-live="polite" hidden></p>
      </div>

      <div class="field register-only">
        <label for="confirm">确认密码</label>
        <span class="input-wrap">
          <span class="ico" aria-hidden="true"><svg class="ln" viewBox="0 0 24 24"><use href="#ln-lock"></use></svg></span>
          <input id="confirm" name="confirm" type="password" autocomplete="new-password"
            placeholder="再次输入密码" required disabled>
        </span>
        <p class="field-error" id="confirmError" aria-live="polite" hidden></p>
        <span class="hint">两次输入需要一致</span>
      </div>

      <div class="row-between login-only">
        <label class="check"><input type="checkbox" id="remember" checked> 记住我</label>
        <button class="link" type="button" id="forgotBtn" aria-expanded="false" aria-controls="resetHelp">忘记密码？</button>
      </div>
      <p class="reset-help login-only" id="resetHelp" hidden>请把用户名发给行程管理员，由管理员在后台重置密码。</p>

      <div class="form-actions">
        <button class="btn-stamp" type="submit" id="submitBtn">
          <span id="submitText">进入我的行程</span>
          <span class="arr" aria-hidden="true">→</span>
        </button>
      </div>

      <div class="hw-login">
        <span class="hw-divider"><em>或</em></span>
        <a class="hw-btn" href="/api/auth/huawei/web/authorize" id="huaweiLogin">
          <img class="hw-logo" src="../assets/img/huawei-logo.svg" alt="" width="18" height="18">
          <span>华为账号登录</span>
        </a>
        <p class="hw-note">与 App 同一账号，行程双端同步</p>
      </div>

      <p class="alt-note">
        <span id="altText">还没有账户？</span>
        <button class="link" type="button" id="altLink">立即注册</button>
      </p>

    </form>
    </div>
  </section>
  <div class="login-assistant" id="loginAssistant"></div>
  </div>

</main>

<script src="../assets/js/api.js"></script>
<script>window.TravelOSPetAuto = false;</script>
<script src="../assets/js/pet.js?v=login-p0"></script>
<script>
  (function () {
    var body = document.body;
    var authPanel = document.getElementById('authPanel');
    var tabLogin = document.getElementById('tabLogin');
    var tabRegister = document.getElementById('tabRegister');
    var title = document.getElementById('authTitle');
    var subtitle = document.getElementById('authSubtitle');
    var submitText = document.getElementById('submitText');
    var altText = document.getElementById('altText');
    var altLink = document.getElementById('altLink');
    var alertBox = document.getElementById('alert');
    var alertText = document.getElementById('alertText');
    var form = document.getElementById('form');
    var submitBtn = document.getElementById('submitBtn');
    var pwInput = document.getElementById('password');
    var togglePw = document.getElementById('togglePw');
    var usernameInput = document.getElementById('username');
    var confirmInput = document.getElementById('confirm');
    var forgotBtn = document.getElementById('forgotBtn');
    var resetHelp = document.getElementById('resetHelp');
    var fields = [usernameInput, pwInput, confirmInput];
    var card = document.getElementById('card');
    var pill = document.getElementById('tabPill');
    var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    // 已登录则直接跳走（避免重复登录）
    if (isLoggedIn()) {
      var here = consumeRedirect('/home/');
      location.replace(here);
      return;
    }

    if (window.TravelOSAi) {
      window.TravelOSAi.init({ mountEl: '#loginAssistant', inlineLauncher: true });
    }

    /* ===== 场景装饰：星屑 + 鼠标视差（尊重 reduced-motion） ===== */
    (function decorateScene() {
      var box = document.getElementById('sparkles');
      if (box && !reduceMotion) {
        for (var i = 0; i < 16; i++) {
          var dot = document.createElement('span');
          dot.className = 'spark';
          var size = 2 + Math.random() * 3;
          dot.style.width = size + 'px';
          dot.style.height = size + 'px';
          dot.style.left = (4 + Math.random() * 92) + '%';
          dot.style.top = (4 + Math.random() * 42) + '%';
          dot.style.animationDelay = (-Math.random() * 4).toFixed(2) + 's';
          box.appendChild(dot);
        }
      }
      if (reduceMotion || window.matchMedia('(max-width: 980px)').matches) return;
      var layers = document.querySelectorAll('.scene .px');
      window.addEventListener('pointermove', function (e) {
        if (e.pointerType !== 'mouse') return;
        var dx = e.clientX / window.innerWidth - 0.5;
        var dy = e.clientY / window.innerHeight - 0.5;
        layers.forEach(function (el) {
          var depth = parseFloat(el.getAttribute('data-depth') || '0');
          el.style.setProperty('--px-x', (-dx * depth).toFixed(1) + 'px');
          el.style.setProperty('--px-y', (-dy * depth).toFixed(1) + 'px');
        });
        if (card && card.matches(':hover')) {
          var rect = card.getBoundingClientRect();
          var localX = (e.clientX - rect.left) / rect.width - 0.5;
          var localY = (e.clientY - rect.top) / rect.height - 0.5;
          card.style.setProperty('--card-rotate-x', (-localY * 3.2).toFixed(2) + 'deg');
          card.style.setProperty('--card-rotate-y', (localX * 3.2).toFixed(2) + 'deg');
        }
      });
      if (card) {
        card.addEventListener('pointerleave', function () {
          card.style.setProperty('--card-rotate-x', '0deg');
          card.style.setProperty('--card-rotate-y', '0deg');
        });
      }
    })();

    /* ===== 登录/注册切换：滑动指示条 ===== */
    function movePill() {
      var active = document.querySelector('.mode-tabs button[aria-selected="true"]');
      if (!active || !pill) return;
      pill.style.width = active.offsetWidth + 'px';
      pill.style.transform = 'translateX(' + active.offsetLeft + 'px)';
    }
    window.addEventListener('resize', movePill);
    window.addEventListener('load', movePill);

    // 从 ?mode=register 解析初始模式
    var initialMode = (new URLSearchParams(location.search)).get('mode') === 'register' ? 'register' : 'login';
    setMode(initialMode);

    function setMode(mode) {
      body.setAttribute('data-mode', mode);
      var isLogin = mode === 'login';
      tabLogin.setAttribute('aria-selected', isLogin ? 'true' : 'false');
      tabRegister.setAttribute('aria-selected', isLogin ? 'false' : 'true');
      tabLogin.tabIndex = isLogin ? 0 : -1;
      tabRegister.tabIndex = isLogin ? -1 : 0;
      authPanel.setAttribute('aria-labelledby', isLogin ? 'tabLogin' : 'tabRegister');
      pwInput.autocomplete = isLogin ? 'current-password' : 'new-password';
      updatePasswordVisibility(false);
      confirmInput.disabled = isLogin;
      fields.forEach(function (input) { setFieldError(input, ''); });
      resetHelp.hidden = true;
      forgotBtn.setAttribute('aria-expanded', 'false');
      title.textContent = isLogin ? '欢迎回来' : '开启你的旅程';
      subtitle.textContent = isLogin ? '登录你的织途账户' : '只需用户名和密码，立即出发';
      submitText.textContent = isLogin ? '进入我的行程' : '创建账户并出发';
      altText.textContent = isLogin ? '还没有账户？' : '已经有账户了？';
      altLink.textContent = isLogin ? '立即注册' : '直接登录';
      alertBox.hidden = true;
      movePill();
    }

    tabLogin.addEventListener('click', function () { setMode('login'); });
    tabRegister.addEventListener('click', function () { setMode('register'); });
    tabLogin.parentElement.addEventListener('keydown', function (event) {
      var selected = event.target;
      if (selected !== tabLogin && selected !== tabRegister) return;
      var next;
      if (event.key === 'Home') next = tabLogin;
      if (event.key === 'End') next = tabRegister;
      if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
        next = selected === tabLogin ? tabRegister : tabLogin;
      }
      if (!next || next.disabled) return;
      event.preventDefault();
      next.click();
      next.focus();
    });
    altLink.addEventListener('click', function () {
      setMode(body.getAttribute('data-mode') === 'login' ? 'register' : 'login');
      (body.getAttribute('data-mode') === 'login' ? tabLogin : tabRegister).focus();
    });

    // 忘记密码：给出指引（账户由行程管理员重置）
    forgotBtn.addEventListener('click', function () {
      resetHelp.hidden = !resetHelp.hidden;
      forgotBtn.setAttribute('aria-expanded', String(!resetHelp.hidden));
    });

    // 密码可见切换
    function updatePasswordVisibility(show) {
      pwInput.type = show ? 'text' : 'password';
      togglePw.setAttribute('aria-label', show ? '隐藏密码' : '显示密码');
      togglePw.innerHTML = '<svg class="ln" viewBox="0 0 24 24" aria-hidden="true"><use href="#ln-'
        + (show ? 'eye-off' : 'eye') + '"></use></svg>';
    }
    togglePw.addEventListener('click', function () {
      updatePasswordVisibility(pwInput.type === 'password');
    });

    function setFieldError(input, message) {
      var error = document.getElementById(input.id + 'Error');
      error.textContent = message;
      error.hidden = !message;
      var descriptions = [];
      if (body.dataset.mode === 'register' && input !== confirmInput) {
        descriptions.push(input.id + 'Hint');
      }
      if (message) {
        descriptions.push(error.id);
        input.setAttribute('aria-invalid', 'true');
      } else {
        input.removeAttribute('aria-invalid');
      }
      if (descriptions.length) input.setAttribute('aria-describedby', descriptions.join(' '));
      else input.removeAttribute('aria-describedby');
    }

    form.addEventListener('input', function (event) {
      var input = event.target;
      if (!fields.includes(input)) return;
      alertBox.hidden = true;
      setFieldError(input, '');
      if (input === pwInput) setFieldError(confirmInput, '');
    });

    function fail(msg) {
      alertText.textContent = msg;
      alertBox.hidden = false;
      /* 出错时卡片轻晃，把视线引到错误提示 */
      if (!reduceMotion) {
        card.classList.remove('shake');
        void card.offsetWidth;
        card.classList.add('shake');
      }
    }

    function setLoading(loading) {
      [submitBtn, tabLogin, tabRegister, altLink].forEach(function (button) {
        button.disabled = loading;
      });
      fields.forEach(function (input) { input.readOnly = loading; });
      submitBtn.classList.toggle('is-loading', !!loading);
      submitText.textContent = loading
        ? (body.getAttribute('data-mode') === 'register' ? '注册中…' : '正在进入…')
        : (body.getAttribute('data-mode') === 'register' ? '创建账户并出发' : '进入我的行程');
    }

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      if (submitBtn.disabled) return;
      var u = usernameInput.value.trim();
      var p = pwInput.value;
      var isRegister = body.getAttribute('data-mode') === 'register';

      alertBox.hidden = true;
      var usernameError = '';
      var passwordError = '';
      var confirmError = '';
      if (!u) usernameError = '请输入用户名。';
      else if (isRegister && !/^[A-Za-z0-9_]{3,20}$/.test(u)) {
        usernameError = '请使用 3–20 位字母、数字或下划线。';
      } else if (u.length < 3 || u.length > 20) {
        usernameError = '请输入 3–20 位用户名。';
      }
      if (!p) passwordError = '请输入密码。';
      else if (isRegister && (p.length < 8 || !/[A-Za-z]/.test(p) || !/\d/.test(p))) {
        passwordError = '密码至少 8 位，且须同时包含字母和数字。';
      }
      if (isRegister) {
        if (!confirmInput.value) confirmError = '请再次输入密码。';
        else if (confirmInput.value !== p) confirmError = '两次输入的密码不一致。';
      }
      [usernameError, passwordError, confirmError].forEach(function (message, index) {
        setFieldError(fields[index], message);
      });
      var firstInvalid = fields.find(function (input) { return input.hasAttribute('aria-invalid'); });
      if (firstInvalid) {
        firstInvalid.focus();
        return;
      }

      setLoading(true);
      try {
        var data;
        if (isRegister) {
          data = await apiPost('/auth/register', { username: u, password: p });
        } else {
          data = await apiPost('/auth/login', { username: u, password: p });
        }
        // 登录/注册成功：body 里直接拿到 token + user（见 AuthController 已返回 token）
        var token = data && data.token;
        var user  = data && (data.user || (data.data && data.data.user));
        if (!token) {
          // 后端没返回 token 时回退到 cookie-only 模式（标记已登录，跳转后由 /auth/me 校验）
          setAuth('cookie', user || { username: u });
        } else {
          setAuth(token, user || { username: u });
        }
        var target = consumeRedirect('/home/');
        location.replace(target);
      } catch (err) {
        setLoading(false);
        if (isRegister && err.status === 409) {
          setFieldError(usernameInput, humanError(err));
          usernameInput.focus();
        } else {
          fail(humanError(err));
          submitBtn.focus();
        }
      }
    });
  })();
</script>
</body>
</html>
