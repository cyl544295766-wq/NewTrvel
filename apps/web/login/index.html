<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Travel OS · 登录</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Space+Grotesk:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/theme.css">
<style>
  :root {
    --brand: #0D6E6E;
    --brand-soft: #5BC5C0;
    --mist: #DCF2F0;
    --cloud: #F7FAFA;
    --stamp: #FF8A4C;
    --mute: #9BB0B5;
    --ink: #123A3C;
    --slab: "Fraunces", "Noto Sans SC", serif;
    --grot: "Space Grotesk", "Noto Sans SC", sans-serif;
    --card-shadow: 0 8px 24px rgba(13,110,110,0.10), 0 1px 2px rgba(13,110,110,0.06);
  }
  .auth { display: grid; grid-template-columns: 1.05fr 1fr; min-height: 100vh; }

  /* ===== 左侧：登机牌票面意象 ===== */
  .visual {
    position: relative; overflow: hidden;
    background: linear-gradient(150deg, #0D6E6E 0%, #137C79 42%, #1E9A93 100%);
    color: #fff; padding: 48px 52px;
    display: flex; flex-direction: column;
  }
  .visual::before {
    content: ""; position: absolute; right: -120px; top: -120px;
    width: 520px; height: 520px; border-radius: 50%;
    background: radial-gradient(circle, rgba(91,197,192,.5) 0%, rgba(91,197,192,0) 66%);
  }
  .visual::after {
    content: ""; position: absolute; left: -160px; bottom: -140px;
    width: 460px; height: 460px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,138,76,.22) 0%, rgba(255,138,76,0) 68%);
  }
  .v-top { position: relative; z-index: 1; display: flex; align-items: center; gap: 11px; }
  .v-logo {
    width: 38px; height: 38px; border-radius: 11px; flex: none;
    background: rgba(255,255,255,.16); border: 1.5px solid rgba(255,255,255,.3);
    display: grid; place-items: center; font-size: 17px;
  }
  .v-brand { font-family: var(--slab); font-weight: 700; font-size: 23px; }
  .v-brand small {
    display: block; font-family: var(--grot); font-weight: 500; font-size: 10.5px;
    letter-spacing: .16em; color: rgba(255,255,255,.62); margin-top: 1px;
  }
  .v-mid {
    position: relative; z-index: 1; margin: auto 0;
    display: flex; justify-content: center;
  }
  .pass-demo {
    width: 100%; max-width: 400px;
    background: rgba(255,255,255,.13);
    border: 1.5px solid rgba(255,255,255,.24);
    border-radius: 16px;
    backdrop-filter: blur(10px);
    padding: 26px 26px 22px;
    position: relative;
  }
  .pass-demo::after {
    content: ""; position: absolute; left: 26px; right: 26px; bottom: 62px;
    border-top: 1.5px dashed rgba(255,255,255,.3);
  }
  .pd-label { font-size: 10px; letter-spacing: .2em; color: rgba(255,255,255,.6); }
  .pd-route {
    display: flex; align-items: baseline; gap: 14px; margin-top: 4px;
  }
  .pd-route .from, .pd-route .to {
    font-family: var(--slab); font-weight: 700; font-size: 30px; letter-spacing: .02em;
  }
  .pd-route .to { color: #A7E3DF; }
  .pd-route .arrow { color: rgba(255,255,255,.5); font-size: 17px; }
  .pd-fields { display: flex; gap: 26px; margin-top: 20px; }
  .pd-fields .f .k { font-size: 9.5px; letter-spacing: .16em; color: rgba(255,255,255,.55); }
  .pd-fields .f .v { font-family: var(--slab); font-weight: 600; font-size: 15px; margin-top: 2px; }
  .pd-foot {
    display: flex; align-items: flex-end; justify-content: space-between;
    margin-top: 32px; padding-top: 16px;
  }
  .pd-barcode {
    flex: 1; height: 20px; max-width: 190px; opacity: .7;
    background: repeating-linear-gradient(90deg,
      #fff 0 1.5px, transparent 1.5px 4px,
      #fff 4px 6.5px, transparent 6.5px 9px,
      #fff 9px 10px, transparent 10px 14px);
  }
  .pd-stamp {
    font-size: 11px; font-weight: 600; color: #FFD9C2;
    border: 1.5px solid #FFD9C2; border-radius: 5px;
    padding: 3px 10px; transform: rotate(-5deg);
  }
  .v-foot { position: relative; z-index: 1; }
  .v-slogan {
    font-family: var(--slab); font-weight: 600; font-size: 25px; line-height: 1.4;
    margin-bottom: 10px;
  }
  .v-slogan em { font-style: normal; color: #A7E3DF; }
  .v-desc { font-size: 13.5px; color: rgba(255,255,255,.72); }

  /* ===== 右侧：表单 ===== */
  .panel {
    display: flex; align-items: center; justify-content: center;
    padding: 48px 40px;
    background: var(--cloud);
    position: relative;
  }
  .panel::before {
    content: ""; position: absolute; left: 0; right: 0; top: 0; height: 4px;
    background: linear-gradient(90deg, var(--brand) 0%, var(--brand-soft) 50%, #A7E3DF 100%);
  }
  .card { width: 100%; max-width: 400px; }
  .card-logo { display: none; align-items: center; gap: 10px; margin-bottom: 26px; }
  .card-logo .lg {
    width: 34px; height: 34px; border-radius: 10px; flex: none;
    background: var(--brand); color: #fff; display: grid; place-items: center; font-size: 16px;
  }
  .card-logo .tx { font-family: var(--slab); font-weight: 700; font-size: 20px; color: var(--brand); }
  h1 {
    font-family: var(--slab); font-weight: 600; font-size: 33px; line-height: 1.2;
    color: var(--brand);
  }
  .subtitle { font-size: 14px; color: var(--mute); margin-top: 8px; }

  .mode-tabs {
    display: flex; gap: 4px; margin: 26px 0 24px;
    background: #fff; padding: 5px; border-radius: 12px;
    box-shadow: var(--card-shadow); width: fit-content;
  }
  .mode-tabs button {
    font-family: var(--grot); font-size: 14px; color: #3D6A6C;
    background: none; border: none; padding: 9px 26px; border-radius: 9px;
    cursor: pointer; transition: background .16s, color .16s;
  }
  .mode-tabs button:hover { background: #F2FAF9; color: var(--brand); }
  .mode-tabs button[aria-selected="true"] { background: var(--brand); color: #fff; font-weight: 600; }

  .form { display: flex; flex-direction: column; gap: 17px; }
  .field { display: flex; flex-direction: column; gap: 7px; }
  .field label { font-size: 12.5px; color: #3D6A6C; font-weight: 500; }
  .input-wrap { position: relative; display: flex; align-items: center; }
  .input-wrap .ico {
    position: absolute; left: 15px; color: var(--mute); font-size: 15px;
    pointer-events: none; transition: color .16s;
  }
  .input-wrap input {
    width: 100%;
    font-family: var(--grot); font-size: 14.5px; color: var(--ink);
    background: #fff; border: 1.5px solid #E4F1F1; border-radius: 11px;
    padding: 14px 44px 14px 42px; outline: none;
    box-shadow: var(--card-shadow);
    transition: border-color .16s, box-shadow .16s;
  }
  .input-wrap input::placeholder { color: var(--mute); font-size: 13.5px; }
  .input-wrap input:focus { border-color: var(--brand-soft); box-shadow: 0 0 0 3px rgba(91,197,192,.18); }
  .input-wrap:focus-within .ico { color: var(--brand); }

  .toggle-pw {
    position: absolute; right: 13px;
    background: none; border: none; color: var(--mute); cursor: pointer;
    font-size: 14px; padding: 4px; line-height: 1;
    transition: color .16s;
  }
  .toggle-pw:hover { color: var(--brand); }

  .hint { font-size: 11.5px; color: var(--mute); }
  .row-between {
    display: flex; align-items: center; justify-content: space-between;
    gap: 14px; flex-wrap: wrap;
  }
  .check {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 13.5px; color: #3D6A6C; cursor: pointer;
  }
  .check input { accent-color: var(--brand); width: 16px; height: 16px; }

  .alert .ic { font-size: 15px; flex: none; }
  .divider {
    display: flex; align-items: center; gap: 12px;
    margin: 22px 0 18px; color: var(--mute); font-size: 12px;
  }
  .divider::before, .divider::after {
    content: ""; flex: 1; border-top: 1px solid #E4F1F1;
  }
  .alt-note {
    font-size: 13px; color: var(--mute); text-align: center;
  }

  .demo {
    margin-top: 24px; padding: 13px 16px; border-radius: 11px;
    background: var(--mist); border: 1.5px dashed #B9DEDC;
    font-size: 12.5px; color: #3D6A6C;
    display: flex; align-items: center; gap: 9px; flex-wrap: wrap;
  }
  .demo .k { color: var(--mute); }
  .demo code {
    font-family: monospace; background: #fff; padding: 2px 7px; border-radius: 5px;
    color: var(--brand); font-size: 12px;
  }
  .demo .fill {
    background: none; border: none; color: var(--brand); cursor: pointer;
    font-family: var(--grot); font-size: 12px; padding: 0;
    border-bottom: 1px dashed var(--brand-soft);
  }

  .register-only { display: none; }
  body[data-mode="register"] .register-only { display: flex; }
  body[data-mode="register"] .login-only { display: none; }

  @media (max-width: 960px) {
    .auth { grid-template-columns: 1fr; }
    .visual { padding: 26px 26px 30px; min-height: auto; display: block; }
    .v-mid { display: none; }
    .v-foot { margin-top: 22px; }
    .v-slogan { font-size: 21px; }
    .panel { padding: 34px 24px 44px; }
    .card-logo { display: flex; }
  }
  @media (max-width: 480px) {
    .visual { padding: 22px 20px 26px; }
    .v-slogan { font-size: 19px; }
    .panel { padding: 28px 18px 36px; }
    h1 { font-size: 27px; }
    .mode-tabs { width: 100%; }
    .mode-tabs button { flex: 1; padding: 9px 12px; }
  }
</style>
</head>
<body data-mode="login">

<div class="auth">

  <!-- ===== 左：登机牌意象 ===== -->
  <div class="visual">
    <div class="v-top">
      <span class="v-logo" aria-hidden="true">✈</span>
      <span class="v-brand">Travel OS<small>行程驾驶舱</small></span>
    </div>

    <div class="v-mid">
      <div class="pass-demo" aria-hidden="true">
        <div class="pd-label">BOARDING PASS</div>
        <div class="pd-route">
          <span class="from">此处</span>
          <span class="arrow">✈</span>
          <span class="to">远方</span>
        </div>
        <div class="pd-fields">
          <div class="f"><div class="k">FLIGHT</div><div class="v">TO-OS 001</div></div>
          <div class="f"><div class="k">SEAT</div><div class="v">01A</div></div>
          <div class="f"><div class="k">GATE</div><div class="v">A6</div></div>
        </div>
        <div class="pd-foot">
          <span class="pd-barcode"></span>
          <span class="pd-stamp">ON TIME</span>
        </div>
      </div>
    </div>

    <div class="v-foot">
      <p class="v-slogan">把每一次出发<br>都收进<em>同一本行程簿</em></p>
      <p class="v-desc">行程 · 费用 · 地图 · 游记 · 相册，一处管好</p>
    </div>
  </div>

  <!-- ===== 右：表单 ===== -->
  <div class="panel">
    <div class="card">

      <div class="card-logo">
        <span class="lg" aria-hidden="true">✈</span>
        <span class="tx">Travel OS</span>
      </div>

      <h1 id="authTitle">欢迎回来</h1>
      <p class="subtitle" id="authSubtitle">登录你的 Travel OS 账户</p>

      <div class="mode-tabs" role="tablist" aria-label="登录或注册">
        <button role="tab" id="tabLogin" aria-selected="true" aria-controls="form">登录</button>
        <button role="tab" id="tabRegister" aria-selected="false" aria-controls="form">注册</button>
      </div>

      <form class="form" id="form" novalidate>

        <div class="alert" id="alert" role="alert" hidden>
          <span class="ic" aria-hidden="true">⚠</span>
          <span id="alertText">用户名或密码不正确，请重新输入</span>
        </div>

        <div class="field">
          <label for="username">用户名</label>
          <span class="input-wrap">
            <span class="ico" aria-hidden="true">◯</span>
            <input id="username" name="username" type="text" autocomplete="username"
              placeholder="3–20 位字母、数字或下划线" required>
          </span>
        </div>

        <div class="field">
          <label for="password">密码</label>
          <span class="input-wrap">
            <span class="ico" aria-hidden="true">▮</span>
            <input id="password" name="password" type="password" autocomplete="current-password"
              placeholder="登录：任意 / 注册：8 位以上且含字母与数字" required>
            <button class="toggle-pw" type="button" id="togglePw" aria-label="显示密码">👁</button>
          </span>
          <span class="hint login-only">忘记密码请联系行程管理员重置</span>
        </div>

        <div class="field register-only">
          <label for="confirm">确认密码</label>
          <span class="input-wrap">
            <span class="ico" aria-hidden="true">▮</span>
            <input id="confirm" name="confirm" type="password" autocomplete="new-password"
              placeholder="再输一次密码">
          </span>
          <span class="hint">两次输入需要一致</span>
        </div>

        <div class="row-between login-only">
          <label class="check"><input type="checkbox" id="remember" checked> 记住我</label>
          <button class="link" type="button">忘记密码？</button>
        </div>

        <button class="btn-stamp" type="submit" id="submitBtn">
          <span id="submitText">进入我的行程</span>
          <span aria-hidden="true">→</span>
        </button>

        <p class="alt-note">
          <span id="altText">还没有账户？</span>
          <button class="link" type="button" id="altLink">立即注册</button>
        </p>

      </form>

      <div class="demo">
        <span class="k">演示账号</span>
        <code>admin</code>
        <span class="k">/</span>
        <code>admin123</code>
        <button class="fill" type="button" id="fillDemo">填入</button>
      </div>

    </div>
  </div>

</div>

<script src="../assets/js/api.js"></script>
<script>
  (function () {
    var body = document.body;
    var tabLogin = document.getElementById('tabLogin');
    var tabRegister = document.getElementById('tabRegister');
    var title = document.getElementById('authTitle');
    var subtitle = document.getElementById('authSubtitle');
    var submitText = document.getElementById('submitText');
    var altText = document.getElementById('altText');
    var altLink = document.getElementById('altLink');
    var alertBox = document.getElementById('alert');
    var alertText = document.getElementById('alertText');
    var form = document.getElementById('form');
    var submitBtn = document.getElementById('submitBtn');
    var pwInput = document.getElementById('password');
    var togglePw = document.getElementById('togglePw');
    var usernameInput = document.getElementById('username');
    var confirmInput = document.getElementById('confirm');
    var fillDemo = document.getElementById('fillDemo');

    // 已登录则直接跳走（避免重复登录）
    if (isLoggedIn()) {
      var here = consumeRedirect('/home/');
      location.replace(here);
      return;
    }

    // 从 ?mode=register 解析初始模式
    var initialMode = (new URLSearchParams(location.search)).get('mode') === 'register' ? 'register' : 'login';
    setMode(initialMode);

    function setMode(mode) {
      body.setAttribute('data-mode', mode);
      var isLogin = mode === 'login';
      tabLogin.setAttribute('aria-selected', isLogin ? 'true' : 'false');
      tabRegister.setAttribute('aria-selected', isLogin ? 'false' : 'true');
      title.textContent = isLogin ? '欢迎回来' : '开启你的旅程';
      subtitle.textContent = isLogin ? '登录你的 Travel OS 账户' : '只需用户名和密码，立即出发';
      submitText.textContent = isLogin ? '进入我的行程' : '创建账户并出发';
      altText.textContent = isLogin ? '还没有账户？' : '已经有账户了？';
      altLink.textContent = isLogin ? '立即注册' : '直接登录';
      alertBox.hidden = true;
    }

    tabLogin.addEventListener('click', function () { setMode('login'); });
    tabRegister.addEventListener('click', function () { setMode('register'); });
    altLink.addEventListener('click', function () {
      setMode(body.getAttribute('data-mode') === 'login' ? 'register' : 'login');
    });

    // 密码可见切换
    togglePw.addEventListener('click', function () {
      var show = pwInput.type === 'password';
      pwInput.type = show ? 'text' : 'password';
      togglePw.setAttribute('aria-label', show ? '隐藏密码' : '显示密码');
      togglePw.textContent = show ? '🙈' : '👁';
    });

    // 演示账号一键填入
    fillDemo.addEventListener('click', function () {
      usernameInput.value = 'admin';
      pwInput.value = 'admin123';
      confirmInput.value = '';
      usernameInput.focus();
      alertBox.hidden = true;
    });

    // 输入时收起错误提示
    form.addEventListener('input', function () { alertBox.hidden = true; });

    function fail(msg) {
      alertText.textContent = msg;
      alertBox.hidden = false;
    }

    function setLoading(loading) {
      submitBtn.disabled = !!loading;
      submitText.textContent = loading
        ? (body.getAttribute('data-mode') === 'register' ? '注册中…' : '正在进入…')
        : (body.getAttribute('data-mode') === 'register' ? '创建账户并出发' : '进入我的行程');
    }

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      var u = usernameInput.value.trim();
      var p = pwInput.value;
      var isRegister = body.getAttribute('data-mode') === 'register';

      if (!u || !p) return fail('请填写用户名和密码');
      if (u.length < 3 || u.length > 20) return fail('用户名需要 3–20 位');
      if (isRegister) {
        if (p.length < 8) return fail('注册密码至少 8 位');
        if (!(/[A-Za-z]/.test(p) && /\d/.test(p))) return fail('注册密码须同时包含字母和数字');
        if (confirmInput.value !== p) return fail('两次输入的密码不一致');
      }

      setLoading(true);
      try {
        var data;
        if (isRegister) {
          data = await apiPost('/auth/register', { username: u, password: p });
        } else {
          data = await apiPost('/auth/login', { username: u, password: p });
        }
        // 登录/注册成功：body 里直接拿到 token + user（见 AuthController 已返回 token）
        var token = data && data.token;
        var user  = data && (data.user || (data.data && data.data.user));
        if (!token) {
          // 后端没返回 token 时回退到 cookie-only 模式（标记已登录，跳转后由 /auth/me 校验）
          setAuth('cookie', user || { username: u });
        } else {
          setAuth(token, user || { username: u });
        }
        var target = consumeRedirect('/home/');
        location.replace(target);
      } catch (err) {
        fail(humanError(err));
        setLoading(false);
      }
    });
  })();
</script>
</body>
</html>
